function localizeDOM(root){
 if(S.lang==='en'||!root)return;
 const map={...(DOM_LOCAL[S.lang]||{}),...(DAY3_LOCAL[S.lang]||{})};
 const keys=Object.keys(map).sort((a,b)=>b.length-a.length);
 const esc=k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const re=new RegExp(keys.map(esc).join('|'),'g');
 const translate=s=>(s||'').replace(re,m=>map[m]??m);
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 let n;while(n=walker.nextNode())n.nodeValue=translate(n.nodeValue);
 root.querySelectorAll('[placeholder]').forEach(el=>el.setAttribute('placeholder',translate(el.getAttribute('placeholder')||'')));
}

function contextInsight(){const t=contextText(),out=[];if(/kettlebell|kettle bell/.test(t))out.push('Kettlebell recognized');if(/dumbbell|free weight/.test(t))out.push('Free weights recognized');if(/stretch|flexib/.test(t))out.push('Stretching requested');if(/aarom|assist/.test(t))out.push('AAROM requested');if(/arom|active range/.test(t))out.push('AROM requested');if(/stairs|stair|step/.test(t))out.push('Stair goal');if(/balance|fall/.test(t))out.push('Balance context');if(/gait|walk/.test(t))out.push('Walking / gait goal');if(/quad|knee/.test(t))out.push('Knee / quadriceps focus');return out.slice(0,6)}
function equipmentMatch(e,txt){const eq=(e.equipment||[e.equip]).join(' ').toLowerCase();if(/none|no equipment/.test(txt)&&/none/.test(eq))return 4;if(/band|theraband|resistance/.test(txt)&&/band/.test(eq))return 7;if(/chair/.test(txt)&&/chair/.test(eq))return 6;if(/counter|support/.test(txt)&&/counter|support/.test(eq))return 5;if(/step|stair/.test(txt)&&/step/.test(eq))return 6;if(/kettlebell|kettle bell/.test(txt)&&/kettlebell/.test(eq))return 12;if(/dumbbell|free weight/.test(txt)&&/dumbbell/.test(eq))return 10;if(/strap|towel/.test(txt)&&/strap|towel/.test(eq))return 6;if(/cane|dowel/.test(txt)&&/cane|dowel/.test(eq))return 6;if(/wall/.test(txt)&&/wall/.test(eq))return 5;return 0}
function aiSuggestionScore(e){const c=fullContextList('conditions','otherCondition').join(' ').toLowerCase(),g=fullContextList('goals','otherGoal').join(' ').toLowerCase(),q=fullContextList('equipment','otherEquipment').join(' ').toLowerCase(),levelText=fullContextList('levels','otherLevel').join(' ').toLowerCase(),f=((S.aiContext.focus||'')+' '+arr(S.aiContext.focusTypes).join(' ')).toLowerCase(),prec=arr(S.aiContext.precautions).join(' ').toLowerCase(),levels=arr(S.aiContext.levels),pain=S.aiContext.pain===''||S.aiContext.pain==null?null:Number(S.aiContext.pain);let score=0;const tags=((e.tags||[]).join(' ')+' '+e.type+' '+e.goal+' '+e.rom+' '+(e.regions||[]).join(' ')+' '+(e.conditions||[]).join(' ')).toLowerCase();
// Safety/precautions are weighted first.

// Clinician focus + goals.

// Condition informs but does not dominate.
if(/knee|oa|osteoarthritis|tka|acl|patell/.test(c)&&(e.regions||[e.region]).includes('Knee'))score+=7;if(/hip|glute/.test(c)&&(e.regions||[e.region]).includes('Hip'))score+=6;if(/back|lumbar|stenosis|sciatica/.test(c)&&(e.regions||[e.region]).includes('Lumbar'))score+=7;if(/shoulder|rotator|cuff/.test(c)&&(e.regions||[e.region]).includes('Shoulder'))score+=8;if(/balance|fall/.test(c)&&(e.type==='Balance'||e.type==='Gait'))score+=8;
// Exercise level can include more than one acceptable level.
if(levels.length){if(levels.includes(e.level))score+=6;else score-=5}if(/gentle|low.?load|low.?impact/.test(levelText)&&e.level==='Beginner')score+=5;if(/challeng|high level/.test(levelText)&&e.level==='Advanced')score+=4
// Equipment is additive; "Other" is interpreted with known concepts.

return score}
function aiSuggestionIds(){return EX.map(e=>({id:e.id,score:aiSuggestionScore(e)})).sort((a,b)=>b.score-a.score).slice(0,8).map(x=>x.id)}
function aiReasonFor(e){const r=[],goal=(fullContextList('goals','otherGoal').join(' ')+' '+S.aiContext.focus+' '+arr(S.aiContext.focusTypes).join(' ')).toLowerCase(),cond=fullContextList('conditions','otherCondition').join(' ').toLowerCase(),equip=fullContextList('equipment','otherEquipment').join(' ').toLowerCase(),levels=arr(S.aiContext.levels),pain=S.aiContext.pain===''?null:Number(S.aiContext.pain);if(/stretch/.test(goal)&&e.type==='Stretching')r.push('stretching focus');if(/stair|step/.test(goal)&&((e.tags||[]).includes('Stairs')||e.name==='Step-Up'))r.push('stair goal');if(/walk|gait/.test(goal)&&(e.type==='Gait'||(e.tags||[]).includes('Gait')))r.push('walking goal');if(/strength/.test(goal)&&e.type==='Strength')r.push('strength focus');if(/aarom/.test(goal)&&e.rom==='AAROM')r.push('AAROM match');if(levels.includes(e.level))r.push(e.level.toLowerCase()+' level');if(equipmentMatch(e,equip)>0&&equip)r.push('available equipment');if((/knee/.test(cond)&&(e.regions||[]).includes('Knee'))||(/hip/.test(cond)&&(e.regions||[]).includes('Hip'))||(/shoulder/.test(cond)&&(e.regions||[]).includes('Shoulder')))r.push('condition context');if(pain!==null&&pain>=7&&['Activation','Mobility','Stretching'].includes(e.type))r.push('lower-load fit');return r.slice(0,3).join(' + ')||'fits selected context'}

('marketing.v2')}</strong><p>${tx('marketing.v2s')}</p></div><div><strong>${tx('marketing.v3')}</strong><p>${tx('marketing.v3s')}</p></div></section></main>`}

pan>Caregiver-assisted</span></div></div><div class="signalQuick"><button class="btn small secondary" onclick="openPatient('James Lee')">Review</button></div></div></div></div><section class="quickSection"><div class="sectionTitle"><h2>Quick Actions</h2></div><div class="quickGrid">${[[ICON.heps,'HEP Builder','AI · manual · saved',"builder()"],[ICON.patients,'Patients','HEPs + check-ins',"nav('patients')"],[ICON.exercise,'Exercise Library','Strength · stretches · ROM',"nav('exercises')"],[ICON.message,'Messages','Contextual communication',"nav('messages')"]].map(x=>`<button class="quickTile" onclick="${x[3]}"><div class="quickIcon">${I(x[0])}</div><div><b>${x[1]}</b><p>${x[2]}</p></div></button>`).join('')}</div></section><div class="card recentCard"><div class="cardHeader"><h2>Between-visit activity</h2></div><div class="recentGrid">${[['SW','HEP session · pain 7/10','15m'],['RG','Exercise rated too easy','1h'],['MP','Barrier: not sure how','2h'],['JL','Low confidence reported','3h'],['AB','Print-only check-in due','Today'],['SW','Message received','5h']].map(x=>`<div class="recentItem"><div class="avatar" style="width:30px;height:30px;font-size:9px">${x[0]}</div><p>${x[1]}</p><time>${x[2]}</time></div>`).join('')}</div></div></section><aside class="rightStack"><div class="card"><div class="cardHeader"><h2>Follow-through</h2></div><div class="snapshotGrid"><div class="snapshot"><small>On track</small><strong>21</strong></div><div class="snapshot"><small>Need review</small><strong style="color:var(--amber)">${S.signalResolved?'3':'4'}</strong></div><div class="snapshot"><small>Adherence declining</small><strong style="color:var(--red)">3</strong></div><div class="snapshot"><small>Offline check-ins due</small><strong>${offline}</strong></div></div></div><div class="card"><div class="cardHeader"><h2>Delivery & activation</h2></div><div class="funnel"><div class="funnelStep"><strong>40</strong><span>Assigned</span></div><div class="funnelStep"><strong>36</strong><span> function explainHEPChange(){showModal(`<div class="modalHead"><h2>${I(ICON.ai)} What changed in HEP v2</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px">Compared with v1, Step-Up was added and standing hip abduction volume increased. The clinician recorded “progression” as the reason. Since that change, adherence stayed high while pain rose over the last two sessions.</p><div class="aiContext">${I(ICON.ai)} Summary only · no automatic changes</div>`)}
function quickCheckIn(name){S.selectedPatient=name;const p=patientByName(name);showModal(`<div class="modalHead"><div><h2>Quick check-in</h2><span class="compactLabel">${name} · clinician-entered from patient/caregiver report</span></div><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="checkinGrid"><div class="checkinBlock"><label>HEP completed?</label><select id="ciAdherence"><option>Most days</option><option>Some days</option><option>Rarely</option><option>Not at all</option></select></div><div class="checkinBlock"><label>Pain</label><select id="ciPain">${Array.from({length:11},(_,i)=>`<option>${i}/10</option>`).join('')}</select></div><div class="checkinBlock"><label>Difficulty</label><select id="ciDifficulty"><option>Too easy</option><option selected>Appropriate</option><option>Too difficult</option></select></div><div class="checkinBlock"><label>Response</label><select id="ciResponse"><option>Better</option><option selected>Same</option><option>Worse</option></select></div><div class="checkinBlock"><label>Barrier</label><select id="ciBarrier"><option>None</option><option>Pain / soreness</option><option>Forgot</option><option>No time</option><option>Unsure how</option><option>Unsafe</option><option>No equipment</option><option>Other</option></select></div><div class="checkinBlock"><label>Confidence</label><select id="ciConfidence"><option>Confident</option><option>Somewhat unsure</option><option>Not sure</option></select></div></div><div class="field"><label>Source</label><select id="ciSource"><option>Patient report during visit/call</option><option>Caregiver report</option><option>Clinician observation</option></select></div><button class="btn primary" style="width:100%" onclick="saveQuickCheckIn('${name.replace("'","\\'")}')">Save check-in</button>`)}
function saveQuickCheckIn(name){const p=patientByName(name),rec={when:'Just now',adherence:document.getElementById('ciAdherence').value,pain:document.getElementById('ciPain').value,difficulty:document.getElementById('ciDifficulty').value,response:document.getElementById('ciResponse').value,barrier:document.getElementById('ciBarrier').value,confidence:document.getElementById('ciConfidence').value,source:document.getElementById('ciSource').value};p.checkins=p.checkins||[];p.checkins.unshift(rec);p.timeline=p.timeline||[];p.timeline.unshift({when:'Just now',title:'Quick check-in',detail:`${rec.adherence} · pain ${rec.pain} · ${rec.response} · barrier: ${rec.barrier}`,source:rec.source});p.status=rec.response==='Worse'||rec.difficulty==='Too difficult'?'Check-in needs review':'Check-in saved';p.statusType=rec.response==='Worse'?'red':'green';persist();closeModal();render();toast('Check-in saved · source preserved')}
function printPatientHEP(name){const p=patientByName(name),ids=p.assignedExerciseIds||[];showModal(`<div class="modalHead"><div><h2>Print HEP</h2><span class="compactLabel">${name} · ${p.hep||'Draft'}</span></div><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="printCard"><b>${p.programName||'Home Exercise Program'}</b><p style="font-size:11px;color:var(--muted)">${ids.length} exercises · Preferred language: ${p.preferredLanguage||'English'} · QR link optional</p></div>${ids.map(id=>{const e=EX.find(x=>x.id===id);return e?`<div class="exerciseSuggestion"><div class="exerciseThumb">IMAGE</div><div><b>${exText(e,'name')}</b><p>${e.dose} · ${exerciseWhy(e)}</p></div></div>`:''}).join('')}<div class="successActions"><button class="btn secondary" onclick="toast('PDF export prepared')">Download PDF</button><button class="btn primary" onclick="window.print()">Print</button></div>`)}
function pauseExercise(name,id){const p=patientByName(name);p.pausedExerciseIds=p.pausedExerciseIds||[];if(!p.pausedExerciseIds.includes(id))p.pausedExerciseIds.push(id);p.timeline=p.timeline||[];const e=EX.find(x=>x.id===id);p.timeline.unshift({when:'Just now',title:'Exercise paused',detail:exText(e,'name'),source:'Clinician'});persist();render();toast('Exercise paused · history preserved')}
function patient(){const p=patientByName(S.selectedPatient);return `<div class="patientHero"><div class="patientHeroLeft"><div class="avatar">${p.initial}</div><div><h1>${p.name}</h1><p>${p.condition||'Condition not entered'} · ${p.hep||'No HEP assigned'}</p><div class="programStatusStrip"><span class="engagementPill">${p.engagementMode||'Digital'}</span>${p.goals&&p.goals!=='Not entered'?`<span class="engagementPill">Goal: ${p.goals}</span>`:''}</div></div></div><div class="pageActions"><button class="btn secondary" onclick="quickCheckIn('${p.name.replace("'","\\'")}')">Quick check-in</button><button class="btn secondary" onclick="printPatientHEP('${p.name.replace("'","\\'")}')">Print HEP</button><button class="btn secondary" onclick="builderForPatient('${p.name.replace("'","\\'")}','manual')">${I(ICON.edit)} ${p.assignedExerciseIds?.length?'Edit HEP':'Create HEP'}</button><button class="btn primary" onclick="contextMessage('${p.name.replace("'","\\'")}','')">${I(ICON.message)} Message</button></div></div>${p.engagementMode==='Print only'?`<div class="offlineNote"><b>Print-only patient.</b> No digital inactivity alerts. HEPmate uses clinician/caregiver check-ins for between-visit insight.</div>`:''}<nav class="tabs">${[['overview','Overview'],['hep','HEP'],['progress','Progress'],['messages','Messages']].map(([id,l])=>`<button class="tab ${S.patientTab===id?'on':''}" onclick="S.patientTab='${id}';render()">${l}</button>`).join('')}</nav>${S.patientTab==='overview'?patientOverview():S.patientTab==='hep'?patientHEP():S.patientTab==='progress'?patientProgress():`<div class="card" style="padding:20px">Open Messages to continue the conversation.</div>`}` }

function assignmentMemory(p){return (p.assignmentEvents||[]).map(x=>`<div class="timelineEvent"><span class="dot"></span><div><b>${x.title}<span class="badge sourceBadge">Clinician</span></b><p>${x.detail}</p></div><time>${x.when}</time></div>`).join('')}
function patientOverview(){const p=patientByName(S.selectedPatient),lastCI=(p.checkins||[])[0];if(p.name!=='Sarah Williams'||p.engagementMode==='Print only'){return `<div class="patientDetailGrid"><section><div class="card"><div class="cardHeader"><h2>Between-visit status</h2><span class="badge ${p.statusType||'green'}">${p.status||'Active'}</span></div><div class="missionList"><div class="missionItem"><div><b>Engagement</b><p>${p.engagementMode||'Digital'} · ${p.pending?'activation pending':'active record'}</p></div></div><div class="missionItem"><div><b>Delivery</b><p>${p.engagementMode==='Print only'?'Print / PDF':deliveryDescription(p)}</p></div></div><div class="missionItem"><div><b>Latest check-in</b><p>${lastCI?`${lastCI.adherence} · pain ${lastCI.pain} · ${lastCI.response}`:'No check-in recorded yet'}</p></div><button class="btn small secondary" onclick="quickCheckIn('${p.name.replace("'","\\'")}')">Add</button></div><div class="missionItem"><div><b>Adaptive reminder</b><p>${p.engagementMode==='Print only'?'Not applicable · check-in reminder for clinician':p.engagementMode==='SMS'?'SMS near patient’s usual completion time':p.engagementMode==='Caregiver-assisted'?'Care partner reminder':'App/SMS/email based on engagement pattern'}</p></div></div></div></div></section><aside><div class="memoryCard"><div class="cardHeader"><h2>Between-visit timeline</h2></div><div class="timelineStream">${timelineHTML(p)}</div></div></aside></div>`}return patientOverviewSarah() }
function timelineHTML(p){const built=[...(p.timeline||[])];if(!built.length)built.push({when:'Today',title:'Patient active',detail:p.engagementMode==='Print only'?'Print-only tracking':'HEPmate engagement active',source:'HEPmate'});return built.slice(0,8).map(x=>`<div class="timelineEvent"><span class="dot"></span><div><b>${x.title}<span class="badge sourceBadge">${x.source||'HEPmate'}</span></b><p>${x.detail||''}</p></div><time>${x.when}</time></div>`).join('')}
function patientOverviewSarah(){const p=patientByName('Sarah Williams');return `<div class="patientDetailGrid"><section>${!S.signalResolved?`<div class="signalCard"><div><b>Pain ↑ 4 → 7</b><div class="signalMeta"><span>82% adherence</span><span>Difficulty appropriate</span><span>2 worse responses</span></div><div class="signalActions"><button class="btn small primary" onclick="openSignalReview()">Review</button><button class="btn small secondary" onclick="showPatientAISummary()">${I(ICON.ai)} Why?</button></div></div><span class="badge red">High</span></div>`:`<div class="assignmentBanner">✓ Latest pain signal resolved · ${S.signalAction}</div>`}<div class="metricGrid"><div class="metricCard"><small>Adherence</small><strong>82%</strong></div><div class="metricCard"><small>Pain</small><strong>7/10</strong></div><div class="metricCard"><small>Difficulty</small><strong style="font-size:16px">Appropriate</strong></div><div class="metricCard"><small>Response</small><strong style="font-size:16px;color:var(--red)">Worse 2×</strong></div></div><div class="card" style="margin-top:14px"><div class="cardHeader"><h2>Exercise response</h2></div><div class="missionList"><div class="missionItem"><div><b>Step-Up</b><p>Pain 7/10 · appropriate difficulty · worse</p></div><span class="badge red">Review</span></div><div class="missionItem"><div><b>Sit-to-Stand</b><p>Pain 4/10 · appropriate · same</p></div><span class="badge green">Stable</span></div><div class="missionItem"><div><b>Hip Abduction</b><p>Pain 3/10 · too easy · better</p></div><span class="badge amber">Progress?</span></div></div></div></section><aside><div class="memoryCard"><div class="cardHeader"><h2>Between-visit timeline</h2></div><div class="timelineStream">${timelineHTML({...p,timeline:[...(p.timeline||[]),{when:'Today',title:'Pain signal',detail:'Pain 7/10 for second session · Step-Up introduced in v2',source:'Patient app'},{when:'Aug 31',title:'HEP session',detail:'Completed · pain 6/10 · response worse',source:'Patient app'},{when:'Aug 28',title:'HEP v2 published',detail:'Step-Up added · progression',source:'Clinician'},{when:'Aug 25',title:'HEP session',detail:'Pain 4/10 · response same',source:'Patient app'}]})}</div></div></aside></div>`}

function chart(){return `<div class="chartCard"><div class="chartTop"><h3>Pain trend + HEP changes</h3><div class="chartLegend"><span style="color:var(--red)">● Pain</span><span>┆ HEP change</span></div></div><div class="chartCanvas"><svg viewBox="0 0 700 240" width="100%" height="100%" preserveAspectRatio="none"><line x1="38" y1="18" x2="38" y2="205" stroke="#d9dfdb"/><line x1="38" y1="205" x2="680" y2="205" stroke="#d9dfdb"/><g stroke="#edf0ee"><line x1="38" y1="55" x2="680" y2="55"/><line x1="38" y1="105" x2="680" y2="105"/><line x1="38" y1="155" x2="680" y2="155"/></g><line x1="300" y1="18" x2="300" y2="205" stroke="#9fb1a8" stroke-dasharray="5 5"/><text x="308" y="30" font-size="11" fill="#69776f">HEP v2 · Step-Up added</text><polyline fill="none" stroke="#be4c50" stroke-width="4" points="45,123 140,140 230,149 320,116 420,85 530,67 670,70"/><circle cx="670" cy="70" r="5" fill="#be4c50"/><text x="3" y="59" font-size="10" fill="#7b8781">8</text><text x="3" y="109" font-size="10" fill="#7b8781">5</text><text x="3" y="159" font-size="10" fill="#7b8781">2</text><text x="42" y="225" font-size="10" fill="#7b8781">Aug 12</text><text x="635" y="225" font-size="10" fill="#7b8781">Sep 3</text></svg></div></div>`}
function patientHEP(){const p=patientByName(S.selectedPatient),ids=p.assignedExerciseIds||[],paused=p.pausedExerciseIds||[];if(!ids.length)return `<div class="card" style="padding:22px"><h2 style="margin-top:0">No active HEP</h2><p style="color:var(--muted)">Build from AI, Manual or Saved HEPs, or create a print-only program.</p><div class="pageActions"><button class="btn primary" onclick="builderForPatient('${p.name.replace("'","\\'")}','manual')">Create HEP</button></div></div>`;return `<div class="card"><div class="cardHeader"><div><h2>${p.hep||'Active HEP'}</h2><p style="font-size:11px;color:var(--muted);margin:4px 0 0">${p.programName||'Patient-specific program'}</p><div class="deliverySummary"><span class="channelChip on">Assigned</span><span class="channelChip ${p.engagementMode==='Print only'?'on':''}">${p.engagementMode==='Print only'?'Print ready':p.pending?'Invite delivered':'Patient active'}</span>${p.engagementMode!=='Print only'?`<span class="channelChip ${p.pending?'':'on'}">HEP ${p.pending?'queued':'opened'}</span><span class="channelChip ${p.pending?'':'on'}">First session ${p.pending?'pending':'completed'}</span>`:''}</div></div><div><button class="btn small secondary" onclick="printPatientHEP('${p.name.replace("'","\\'")}')">Print</button> <button class="btn small primary" onclick="builderForPatient('${p.name.replace("'","\\'")}','manual')">Edit</button></div></div><div style="padding:0 16px">${ids.map(id=>{const e=EX.find(x=>x.id===id);if(!e)return'';const isPaused=paused.includes(id);return `<div class="exerciseSuggestion" style="opacity:${isPaused?.65:1}"><div class="exerciseThumb">MEDIA</div><div><b>${exText(e,'name')}</b><div class="taxonomyRow"><span class="badge">${clinicalTerm('type',e.type)}</span><span class="badge">${clinicalTerm('level',e.level)}</span></div><div class="whyLine"><b>Why:</b> ${exerciseWhy(e)}</div></div><div class="dosePreview">${e.dose}</div>${isPaused?`<span class="badge amber">Paused</span>`:`<button class="btn small ghost" onclick="pauseExercise('${p.name.replace("'","\\'")}','${e.id}')">Pause</button>`}</div>`}).join('')}</div></div><div class="card" style="margin-top:14px"><div class="cardHeader"><h2>HEP history</h2><button class="btn small ghost" onclick="explainHEPChange()">${I(ICON.ai)} Explain change</button></div><div class="timelineStream">${assignmentMemory(p)||'<div class="timelineEvent"><span class="dot"></span><div><b>'+p.hep+'</b><p>Current assigned program</p></div><time>Active</time></div>'}</div></div>`}

function patientProgressSarah(){return `${chart()}<div class="metricGrid" style="margin-top:14px"><div class="metricCard"><small>Adherence trend</small><strong>82%</strong><em>12 completed sessions</em></div><div class="metricCard"><small>Pain trend</small><strong>4 → 7</strong><em style="color:var(--red)">Worsening recently</em></div><div class="metricCard"><small>Difficulty</small><strong style="font-size:16px">Mostly just right</strong><em>1 exercise too easy</em></div><div class="metricCard"><small>Post-session response</small><strong style="font-size:16px">Mostly better</strong><em>Worse on last 2</em></div></div><div class="card" style="margin-top:14px"><div class="cardHeader"><h2>Barriers</h2></div><div class="missionList"><div class="missionItem"><div><b>No recurring barrier</b><p>Two missed sessions this month; one reported “didn’t have time.”</p></div><span class="badge green">Low</span></div></div></div>`}
function patientProgress(){const p=patientByName(S.selectedPatient);if(p.name==='Sarah Williams')return patientProgressSarah();return `<div class="card" style="padding:20px"><h2 style="margin-top:0">Between-visit progress</h2><p style="color:var(--muted)">${p.pending?'Progress begins after activation and the first HEP activity is recorded.':'No demo response history is available yet for this patient.'}</p><div class="metricGrid"><div class="metricCard"><small>Adherence</small><strong>${p.adherence||'—'}</strong></div><div class="metricCard"><small>Pain</small><strong>—</strong></div><div class="metricCard"><small>Difficulty</small><strong>—</strong></div><div class="metricCard"><small>Response</small><strong>—</strong></div></div></div>`}

function heps(){return savedHEPsPage(false)}
function savedHEPsPage(inBuilder=false){const tags=['All','Favorites','Recently used','Frequently assigned','Knee','Hip','Shoulder','Lumbar','Balance','Strength','Stretching','Mobility','Beginner','Intermediate','Advanced'];let list=SAVED.filter(h=>{if(S.savedTag==='Favorites'&&!h.favorite)return false;if(S.savedTag==='Recently used'&&h.lastUsed==='Never')return false;if(S.savedTag==='Frequently assigned'&&(h.used||0)<10)return false;if(!['All','Favorites','Recently used','Frequently assigned'].includes(S.savedTag)&&!(h.tags||[]).includes(S.savedTag))return false;return !S.savedSearch||(h.name+' '+(h.tags||[]).join(' ')).toLowerCase().includes(S.savedSearch.toLowerCase())});return `${inBuilder?`<div class="builderTop day3"><div class="builderTitle"><div><h1>Saved HEPs</h1><p>Reusable programs · tagged and learned from your workflow</p></div></div><div class="builderActions"><button class="btn secondary small" onclick="builder()">Back</button></div></div><div class="builderMain">`:pageTitle('Saved HEPs','Reuse what works. Assign, personalize, print or duplicate.',`<button class="btn primary" onclick="builder()">${I(ICON.plus)} HEP Builder</button>`)}<div class="savedToolbar"><input placeholder="Search by name, body region or tag…" value="${S.savedSearch}" oninput="S.savedSearch=this.value;render()"><button class="btn secondary" onclick="builder('manual')">${I(ICON.plus)} New HEP</button></div><div class="filters">${tags.map(tag=>`<button class="filter ${S.savedTag===tag?'on':''}" onclick="S.savedTag='${tag}';render()">${tag}</button>`).join('')}</div><div class="smartNote" style="margin:10px 0">${I(ICON.ai)}<span>HEPmate can surface frequently used programs and suggest tags. It never changes a Saved HEP automatically.</span></div><div class="savedGrid">${list.map(h=>savedCard(h)).join('')||`<div class="card" style="padding:20px">No Saved HEPs match these filters.</div>`}</div>${inBuilder?'</div>':''}` }
function savedCard(h){return `<div class="savedCard"><div class="savedTop"><div><span class="badge ${h.scope==='Clinic template'?'green':'violet'}">${h.scope}</span><h3>${h.name}</h3><p>${h.desc}</p></div><button class="btn iconOnly small ghost" onclick="toggleSavedFavorite('${h.id}')">${h.favorite?'★':'☆'}</button></div><div class="programMeta">${(h.tags||[]).map(t=>`<span class="badge">${t}</span>`).join('')}</div><div class="savedStats"><span><b>${h.used||0}</b> assignments</span><span>Last used ${h.lastUsed||'—'}</span></div><div class="programFooterRow"><button class="btn small primary" onclick="assignSaved('${h.id}')">Assign</button><button class="btn small secondary" onclick="openSavedInBuilder('${h.id}')">Open</button><button class="btn small ghost" onclick="duplicateSaved('${h.id}')">Duplicate</button><button class="btn small ghost" onclick="downloadSaved('${h.id}')">Print</button></div></div>`}
function toggleSavedFavorite(id){const h=SAVED.find(x=>x.id===id);h.favorite=!h.favorite;persist();render()}
function duplicateSaved(id){const h=SAVED.find(x=>x.id===id),n={...h,id:'s'+Date.now(),name:h.name+' — Copy',used:0,lastUsed:'Never',favorite:false};SAVED.unshift(n);persist();render();toast('Saved HEP duplicated')}
function openSaved(id){const h=SAVED.find(x=>x.id===id);S.program=h.ids.map(id=>({...EX.find(e=>e.id===id)}));S.programName=h.name;S.builderMode='manual';S.builderTab='library';S.page='builder';persist();render();toast('Saved HEP opened')}
function duplicateSaved(id){const h=SAVED.find(x=>x.id===id);const copy={...h,id:'saved_'+Date.now(),name:h.name+' — Copy',used:0,lastUsed:'Not yet'};SAVED.unshift(copy);persist();render();toast('Saved HEP duplicated')}
function assignSaved(id){const h=SAVED.find(x=>x.id===id);h.used=(h.used||0)+1;h.lastUsed='Today';S.program=h.ids.map(id=>({...EX.find(e=>e.id===id)}));S.programName=h.name;persist();assignChooser()}
function suggestTags(id){const h=SAVED.find(x=>x.id===id);showModal(`<div class="modalHead"><h2>${I(ICON.ai)} AI suggested tags</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px;color:var(--muted)">Based on the exercises and intended use of <b>${h.name}</b>:</p><div class="tagRow">${[...(h.tags||[]),'Home program'].slice(0,6).map(t=>`<span class="tag">${t}</span>`).join('')}</div><p style="font-size:11px;color:var(--muted)">AI only suggests organization metadata. You decide what is saved.</p><button class="btn primary" style="width:100%" onclick="closeModal();toast('Tags reviewed')">Done</button>`)}
function downloadSaved(id){const h=SAVED.find(x=>x.id===id);const exs=h.ids.map(id=>EX.find(e=>e.id===id)).filter(Boolean);const body=`<html><head><title>${h.name}</title><style>body{font-family:Arial;padding:32px;max-width:760px;margin:auto}li{margin:14px 0}

function saveToLibraryModal(){if(!S.program.length)return;showModal(`<div class="modalHead"><h2>Save to Saved HEPs</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="field"><label>Program name</label><input id="saveName" value="${S.programName}"></div><div class="field"><label>Tags</label><input id="saveTags" value="Knee, Strength" placeholder="Knee, balance, gait…"></div><button class="btn secondary" style="width:100%;margin-bottom:8px" onclick="suggestSaveTags()">${I(ICON.ai)} Suggest tags with AI</button><button class="btn primary" style="width:100%" onclick="saveToLibrary()">Save for later</button>`)}
function suggestSaveTags(){const el=document.getElementById('saveTags');if(el)el.value='Knee, Strength, Function, Stairs';toast('AI suggested tags')}
function saveToLibrary(){const name=document.getElementById('saveName')?.value.trim()||'Untitled HEP';const tags=(document.getElementById('saveTags')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);SAVED.unshift({id:'saved_'+Date.now(),name,desc:`${S.program.length} exercises · reusable home program`,ids:S.program.map(e=>e.id),scope:'My HEP',tags,used:0,lastUsed:'Not yet'});S.programName=name;persist();closeModal();successCustom('HEP saved','This program is now in Saved HEPs and can be assigned, edited, duplicated, downloaded or printed later.')}

function builderHub(){return `${pageTitle('HEP Builder','Build a program first. Choose the patient only when you are ready to assign it.')}${S.program.length?`<div class="card" style="padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px"><div><b style="font-size:13px">Current draft · ${S.programName}</b><p style="font-size:11px;color:var(--muted);margin:3px 0 0">${S.program.length} exercises · autosaved</p></div><button class="btn secondary" onclick="builder('manual')">Resume draft</button></div>`:''}<div class="hepHub"><button class="hubCard" onclick="startNewBuilder('ai')"><div><div class="hubIcon">${I(ICON.ai)}</div><h2>AI HEP Builder</h2><p>Start with AI suggestions using optional clinical context. You still review, edit and approve every exercise.</p></div><span class="hubCTA">Start with AI ${I(ICON.arrow)}</span></button><button class="hubCard" onclick="startNewBuilder('manual')"><div><div class="hubIcon">${I(ICON.exercise)}</div><h2>Manual HEP Builder</h2><p>Build exercise by exercise from the library with full control over selection, dosage and instructions.</p></div><span class="hubCTA">Build manually ${I(ICON.arrow)}</span></button><button class="hubCard" onclick="builder('saved')"><div><div class="hubIcon">${I(ICON.heps)}</div><h2>Saved HEPs</h2><p>Reuse a tagged program, edit it, assign it, or print it.</p></div><span class="hubCTA">Browse saved HEPs ${I(ICON.arrow)}</span></button></div>`}

ent')}</button></div><div class="programBottom"><button class="btn secondary" ${!S.program.length?'disabled':''} onclick="reviewProgram()">Review program</button><button class="btn primary" style="margin-top:8px" ${!S.program.length?'disabled':''} onclick="assignChooser()">Assign HEP ${I(ICON.arrow)}</button><div class="autosaveText">${tx('builder.autosaved')}</div></div></aside></div><div class="mobileProgramBar" onclick="programDrawer()"><div><b>${tx('builder.program')} · ${S.program.length}</b><br><span>${S.program.length?S.program.map(x=>exText(x,'name')).slice(0,2).join(', '):'No exercises yet'}</span></div>${I(ICON.chevron)}</div>`}
function previewGenericProgram(){if(!S.program.length){toast('Add exercises before previewing','info');return}showModal(`<div class="modalHead"><h2>Patient preview · not assigned</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px;color:var(--muted)">${S.programName} · ${S.program.length} exercises. This is a generic preview; no patient is attached.</p>${S.program.map((e,i)=>`<div class="exerciseSuggestion"><div class="exerciseThumb">${i+1}</div><div><b>${exText(e,'name')}</b><p>${exText(e,'desc')}</p></div><div class="dosePreview">${e.dose}<br>${clinicalTerm('freq',e.freq)}</div><span class="badge">Preview</span></div>`).join('')}<button class="btn primary" style="width:100%;margin-top:12px" onclick="closeModal()">Done</button>`)}
function programItems(){if(!S.program.length)return `<div class="programEmpty">Add exercises from AI suggestions or Manual HEP Builder. Save, assign or print whenever you are ready.</div>`;return S.program.map((e,i)=>`<div class="programItem" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')" ondragover="event.preventDefault()" ondrop="event.preventDefault();reorderProgram(Number(event.dataTransfer.getData('text/plain')),${i})"><span class="dragHandle">⋮⋮</span><div class="exerciseThumb">${i+1}</div><div><b>${exText(e,'name')}</b><button class="btn ghost microAction" style="display:flex;margin-top:4px" onclick="editProgramExercise('${e.id}')">${e.dose} · ${clinicalTerm('freq',e.freq)}</button></div><button class="kebab" title="AI progression / regression" onclick="suggestModification('${e.id}')">${I(ICON.ai)}</button><button class="kebab" title="Remove" onclick="removeExercise('${e.id}')">${I(ICON.close)}</button></div>`).join('')}
function reorderProgram(from,to){if(from===to||from<0||to<0)return;const [item]=S.program.splice(from,1);S.program.splice(to,0,item);persist();render();toast('Program reordered')}
function editProgramExercise(id){const e=S.program.find(x=>x.id===id);if(!e)return;showModal(`<div class="modalHead"><div><h2>${exText(e,'name')}</h2><span class="compactLabel">Edit patient-specific dosage</span></div><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="row2"><div class="field"><label>Dosage</label><input id="editDose" value="${e.dose||''}" placeholder="e.g., 3 × 10"></div><div class="field"><label>Frequency</label><select id="editFreq"><option ${e.freq==='Daily'?'selected':''}>Daily</option><option ${e.freq==='2×/day'?'selected':''}>2×/day</option><option ${e.freq==='3×/week'?'selected':''}>3×/week</option><option ${e.freq==='Every other day'?'selected':''}>Every other day</option><option>Other</option></select></div></div><div class="field"><label>Patient note <span class="optionalLabel">optional</span></label><input id="editExerciseNote" value="${e.patientNote||''}" placeholder="Short exercise-specific instruction"></div><div class="whyLine"><b>Why:</b> ${exerciseWhy(e)}</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveProgramExercise('${id}')">Save</button>`)}
function saveProgramExercise(id){const e=S.program.find(x=>x.id===id);if(!e)return;e.dose=document.getElementById('editDose')?.value.trim()||e.dose;e.freq=document.getElementById('editFreq')?.value||e.freq;e.patientNote=document.getElementById('editExerciseNote')?.value.trim()||'';persist();closeModal();render();toast('Exercise updated')}
function editAIContext(){const c=normalizeAIContext(S.aiContext);S.aiContext=c;const conditions=['Knee Osteoarthritis','Post-op Knee','Knee Pain','Low Back Pain','Lumbar Stenosis','Hip Pain','Shoulder Pain','Post-op Shoulder','Balance / Fall Risk'],goals=['Stairs','Walking / gait','Balance / fall prevention','Strength','Stretching / flexibility','Mobility / ROM','Transfers / sit-to-stand','Reach / overhead use','Return to work/activity'],equipment=['None','Chair','Resistance band','Counter / stable support','Step','Cane / walker','Strap / towel','Ankle weights','Dumbbells','Kettlebell','Wall / stable surface'],levels=['Beginner','Intermediate','Advanced'];const chips=(key,opts)=>opts.map(v=>`<label class="choiceChip ${arr(c[key]).includes(v)?'on':''}"><input type="checkbox" data-key="${key}" value="${v}" ${arr(c[key]).includes(v)?'checked':''} onchange="this.parentElement.classList.toggle('on',this.checked)">${v}</label>`).join('');showModal(`<div class="modalHead"><h2>HEP context</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="smartNote">${I(ICON.ai)}<span>Choose any that apply. <b>Other</b> stacks with selected choices and is interpreted with the full context.</span></div><div class="multiField" style="margin-top:12px"><div class="multiFieldHead"><b>Conditions</b><span class="compactLabel">multiple allowed</span></div><div class="choiceGrid">${chips('conditions',conditions)}<label class="choiceChip ${c.otherCondition?'on':''}"><input type="checkbox" id="otherConditionCheck" ${c.otherCondition?'checked':''} onchange="document.getElementById('ctxOtherCondition').classList.toggle('hidden',!this.checked);this.parentElement.classList.toggle('on',this.checked)">Other</label></div><input id="ctxOtherCondition" class="otherInput ${c.otherCondition?'':'hidden'}" value="${c.otherCondition||''}" placeholder="Type another condition"></div><div class="multiField" style="margin-top:10px"><div class="multiFieldHead"><b>Goals</b><span class="compactLabel">multiple allowed</span></div><div class="choiceGrid">${chips('goals',goals)}<label class="choiceChip ${c.otherGoal?'on':''}"><input type="checkbox" id="otherGoalCheck" ${c.otherGoal?'checked':''} onchange="document.getElementById('ctxOtherGoal').classList.toggle('hidden',!this.checked);this.parentElement.classList.toggle('on',this.checked)">Other</label></div><input id="ctxOtherGoal" class="otherInput ${c.otherGoal?'':'hidden'}" value="${c.otherGoal||''}" placeholder="Type another rehab goal"></div><div class="row2" style="margin-top:10px"><div class="multiField"><div class="multiFieldHead"><b>Equipment</b><span class="compactLabel">multiple allowed</span></div><div class="choiceGrid">${chips('equipment',equipment)}<label class="choiceChip ${c.otherEquipment?'on':''}"><input type="checkbox" id="otherEquipmentCheck" ${c.otherEquipment?'checked':''} onchange="document.getElementById('ctxOtherEquipment').classList.toggle('hidden',!this.checked);this.parentElement.classList.toggle('on',this.checked)">Other</label></div><input id="ctxOtherEquipment" class="otherInput ${c.otherEquipment?'':'hidden'}" value="${c.otherEquipment||''}" placeholder="e.g., TRX, cable machine"></div><div class="multiField"><div class="multiFieldHead"><b>Exercise level</b><span class="compactLabel">multiple allowed</span></div><div class="choiceGrid">${chips('levels',levels)}<label class="choiceChip ${c.otherLevel?'on':''}"><input type="checkbox" id="otherLevelCheck" ${c.otherLevel?'checked':''} onchange="document.getElementById('ctxOtherLevel').classList.toggle('hidden',!this.checked);this.parentElement.classList.toggle('on',this.checked)">Other</label></div><input id="ctxOtherLevel" class="otherInput ${c.otherLevel?'':'hidden'}" value="${c.otherLevel||''}" placeholder="Describe another level constraint"></div></div><div class="row2"><div class="field"><label>Pain / symptoms</label><select id="ctxPain"><option value="" ${c.pain===''?'selected':''}>Not specified</option>${Array.from({length:11},(_,i)=>`<option value="${i}" ${String(c.pain)===String(i)?'selected':''}>${i}/10</option>`).join('')}</select></div><div class="field"><label>Precautions</label><select id="ctxPrecautions" multiple size="4"><option ${arr(c.precautions).includes('Weight-bearing restriction')?'selected':''}>Weight-bearing restriction</option><option ${arr(c.precautions).includes('Fall risk')?'selected':''}>Fall risk</option><option ${arr(c.precautions).includes('Post-op precautions')?'selected':''}>Post-op precautions</option><option ${arr(c.precautions).includes('Avoid high impact')?'selected':''}>Avoid high impact</option></select></div></div><button class="btn primary" style="width:100%" onclick="saveAIContext()">Save context</button>`)}
function saveAIContext(){const get=(key)=>[...document.querySelectorAll(`input[data-key="${key}"]:checked`)].map(x=>x.value);S.aiContext.conditions=get('conditions');S.aiContext.goals=get('goals');S.aiContext.equipment=get('equipment');if(S.aiContext.equipment.length>1)S.aiContext.equipment=S.aiContext.equipment.filter(x=>x!=='None');S.aiContext.levels=get('levels');S.aiContext.otherCondition=document.getElementById('otherConditionCheck')?.checked?(document.getElementById('ctxOtherCondition')?.value.trim()||''):'';S.aiContext.otherGoal=document.getElementById('otherGoalCheck')?.checked?(document.getElementById('ctxOtherGoal')?.value.trim()||''):'';S.aiContext.otherEquipment=document.getElementById('otherEquipmentCheck')?.checked?(document.getElementById('ctxOtherEquipment')?.value.trim()||''):'';S.aiContext.otherLevel=document.getElementById('otherLevelCheck')?.checked?(document.getElementById('ctxOtherLevel')?.value.trim()||''):'';S.aiContext.pain=document.getElementById('ctxPain')?.value||'';S.aiContext.precautions=[...document.getElementById('ctxPrecautions')?.selectedOptions||[]].map(x=>x.value);persist();closeModal();S.generated=false;render();toast('Context updated')}

nerated?`<div class="suggestionList fadeIn"><div class="suggestionHeader"><div><h2>${tx('builder.suggested')}</h2><span style="font-size:11px;color:var(--muted)">Context-ranked · nothing is added automatically</span></div><button class="btn small ghost" onclick="S.builderMode='manual';render()">Browse library</button></div>${aiSuggestionIds().map(id=>exerciseSuggestion(id,true)).join('')}</div>`:`<div class="smartNote" style="margin-top:14px">${I(ICON.ai)}<span>Select context and focus, then generate a draft. You can mix AI suggestions with manual exercises and Saved HEPs.</span></div>`}`}

function exerciseSuggestion(id,showReason=false){const e=EX.find(x=>x.id===id),added=S.program.some(x=>x.id===id);return `<div class="exerciseSuggestion"><div class="exerciseThumb">MEDIA</div><div><b>${exText(e,'name')}</b><div class="taxonomyRow"><span class="badge">${clinicalTerm('type',e.type)}</span><span class="badge">${clinicalTerm('level',e.level)}</span>${e.rom!=='N/A'?`<span class="badge">${e.rom}</span>`:''}</div>${showReason?`<div class="aiSuggestionReason">${I(ICON.ai)} ${aiReasonFor(e)}</div>`:''}<div class="whyLine"><b>Why:</b> ${exerciseWhy(e)}</div></div><div class="dosePreview">${e.dose}<br>${clinicalTerm('freq',e.freq)}</div><button class="btn small ${added?'ghost':'secondary'}" ${added?'disabled':''} onclick="addExercise('${e.id}')">${added?'✓ Added':'Add'}</button></div>`}
function setLibraryFilter(key,value){S[key]=S[key]===value?'All':value;render()}
function exerciseSearchText(e){return [e.name,e.desc,e.region,(e.regions||[]).join(' '),e.type,e.rom,e.level,(e.equipment||[]).join(' '),(e.tags||[]).join(' '),exText(e,'name'),exText(e,'desc')].join(' ').toLowerCase()}
function exerciseWhy(e){
 if(S.lang==='en')return e.why||'';
 const goal=(e.goal||'').toLowerCase(),type=(e.type||'').toLowerCase(),tags=(e.tags||[]).join(' ').toLowerCase();
 if(S.lang==='es'){
  if(/stair/.test(tags))return 'Ayuda a desarrollar la fuerza y el control necesarios para subir y bajar escaleras.';
  if(/gait|walking/.test(tags)||type==='gait')return 'Ayuda a practicar la fuerza, el control y la coordinación necesarios para caminar.';
  if(type==='stretching')return 'Ayuda a mejorar la flexibilidad y reducir la rigidez relacionada con este objetivo.';
  if(type==='balance')return 'Ayuda a mejorar el equilibrio y el control para moverse con mayor seguridad.';
  if(type==='mobility')return 'Ayuda a mejorar el movimiento y el rango de movimiento de forma controlada.';
  if(type==='activation')return 'Ayuda a activar el músculo objetivo con una carga baja y controlada.';
  if(type==='motor control')return 'Ayuda a mejorar el control y la coordinación durante el movimiento.';
  if(goal==='strength'||type==='strength')return 'Ayuda a desarrollar la fuerza necesaria para las actividades indicadas por su profesional.';
  return 'Apoya el objetivo de rehabilitación seleccionado para este programa.';
 }
 if(S.lang==='ar'){
  if(/stair/.test(tags))return 'يساعد على تطوير القوة والتحكم اللازمين لصعود ونزول السلالم.';
  if(/gait|walking/.test(tags)||type==='gait')return 'يساعد على تدريب القوة والتحكم والتناسق اللازم للمشي.';
  if(type==='stretching')return 'يساعد على تحسين المرونة وتقليل التيبّس المرتبط بهذا الهدف.';
  if(type==='balance')return 'يساعد على تحسين التوازن والتحكم للحركة بأمان أكبر.';
  if(type==='mobility')return 'يساعد على تحسين الحركة ومدى الحركة بصورة متحكم بها.';
  if(type==='activation')return 'يساعد على تنشيط العضلة المستهدفة بحمل خفيف ومتحكم به.';
  if(type==='motor control')return 'يساعد على تحسين التحكم والتناسق أثناء الحركة.';
  if(goal==='strength'||type==='strength')return 'يساعد على بناء القوة اللازمة للأنشطة التي حددها المعالج.';
  return 'يدعم هدف إعادة التأهيل المحدد لهذا البرنامج.';
 }
 return e.why||'';
}
function exerciseInstruction(e){return exText(e,'instruction')||(S.lang==='es'?'Realice el movimiento lentamente, dentro de un rango cómodo, y siga la dosis indicada por su profesional.':S.lang==='ar'?'نفّذ الحركة ببطء وفي مدى مريح واتبع الجرعة التي حددها المعالج.':'Move slowly through a comfortable range and follow the dosage selected by your clinician.')}

ROM='${f}';render()">${f}</button>`).join('')}</div></div><div class="filterGroup"><span>Equipment</span><div class="filters">${['All','None','Chair','Resistance band','Dumbbells','Kettlebell','Counter / stable support','Strap / towel'].map(f=>`<button class="filter ${S.libraryEquipment===f?'on':''}" onclick="S.libraryEquipment='${f}';render()">${f}</button>`).join('')}</div></div></div>`:''}<div class="libraryCount">${list.length} exercises · filters can be combined</div><div class="exerciseGrid">${list.map(e=>`<div class="exerciseCard" onclick="S.previewExercise='${e.id}'"><div class="exerciseCardTop"><div class="exerciseThumb">MEDIA</div><div><h3>${exText(e,'name')}</h3><p>${exText(e,'desc')}</p><div class="taxonomyRow"><span class="badge">${clinicalTerm('type',e.type)}</span><span class="badge">${clinicalTerm('level',e.level)}</span>${e.rom!=='N/A'?`<span class="badge">${e.rom}</span>`:''}</div></div></div><div class="whyLine"><b>Why:</b> ${exerciseWhy(e)}</div><div class="exerciseCardFooter"><button class="btn small ghost" onclick="event.stopPropagation();previewExercise('${e.id}')">${tx('common.preview')}</button><button class="btn small primary" onclick="event.stopPropagation();addExercise('${e.id}')">+ Add</button></div></div>`).join('')}</div>`}
function customExercise(){showModal(`<div class="modalHead"><h2>New custom exercise</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="field"><label>Exercise name</label><input value="Supported Mini Squat"></div><div class="field"><label>Patient instructions</label><textarea>Stand at a counter for support. Bend your knees into a comfortable mini squat, then return to standing.</textarea></div><div class="row2"><div class="field"><label>Body region</label><select><option>Knee</option><option>Hip</option><option>Shoulder</option><option>Lumbar</option></select></div><div class="field"><label>Category</label><select><option>Strength</option><option>Stretching</option><option>Mobility</option><option>Balance</option><option>Gait</option><option>Motor Control</option></select></div></div><div class="row2"><div class="field"><label>ROM</label><select><option>AROM</option><option>AAROM</option><option>PROM</option><option>Isometric</option></select></div><div class="field"><label>Difficulty</label><select><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div></div><div class="field"><label>Equipment</label><input value="Counter / stable support"></div><div class="field"><label>Why is the patient doing this?</label><input value="Builds supported lower-extremity strength for standing and walking."></div><div class="field"><label>Media</label><button class="btn secondary" style="width:100%">Upload photo or video</button></div><button class="btn primary" style="width:100%" onclick="closeModal();toast('Custom exercise saved')">Save exercise</button>`)}

function messages(){const threads=[['Sarah Williams','Step-ups are bothering my knee','2m'],['Maya Patel','Can I do these before work?','1h'],['Robert Green','Thanks — feels easier now','Yesterday']];return `${pageTitle(tx('common.messages'),'Patient communication with original + translated text preserved.') }<div class="messagesGrid"><aside class="threads">${threads.map((x,i)=>`<button class="thread ${S.selectedThread===i?'on':''}" style="width:100%;border:0;text-align:left" onclick="S.selectedThread=${i};render()"><div class="avatar">${['SW','MP','RG'][i]}</div><div><b>${x[0]}</b><p>${x[1]}</p><span style="font-size:10px;color:var(--muted)">${x[2]}</span></div></button>`).join('')}</aside><section class="chat"><div class="chatHead"><div class="avatar">SW</div><div><b>Sarah Williams</b><div style="font-size:10px;color:var(--muted)">Preferred language: English</div></div><button class="btn small secondary" style="margin-left:auto" onclick="draftReply()">${I(ICON.ai)} Draft reply with AI</button></div><div class="chatBody"><div class="bubble">Hi Dr. Moustafa — the step-ups have been bothering the front of my knee the last two times.<div class="translationLine">Original · English</div></div><div class="bubble me">Thanks for letting me know. I’m going to review the exercise and your recent pain scores before we decide whether to modify it.</div><div class="bubble">Everything else feels okay.</div></div><div class="chatCompose"><input id="chatInput" placeholder="Write a message…"><button class="btn primary" onclick="sendMessage()">${I(ICON.message)} ${tx('common.send')}</button></div></section></div>`}

function app(){return shell(appContent())}
function patientApp(){return `<div class="patientApp"><header class="patientTop"><span class="wordmark">HEP<span>mate</span></span><div style="display:flex;gap:7px"><select class="btn secondary small" onchange="setLang(this.value)"><option value="en" ${S.lang==='en'?'selected':''}>EN</option><option value="es" ${S.lang==='es'?'selected':''}>ES</option><option value="ar" ${S.lang==='ar'?'selected':''}>AR</option></select><button class="userButton" onclick="S.view='app';S.page='home';render()"><div class="avatar">SW</div></button></div></header><main class="patientMain">${S.patientPage==='today'?patientToday():S.patientPage==='progress'?patientMobileProgress():S.patientPage==='messages'?patientMobileMessages():patientMore()}</main><nav class="patientBottomNav">${[['today',tx('common.today'),ICON.home],['progress',tx('common.progress'),ICON.progress],['messages',tx('common.messages'),ICON.message],['more',tx('common.more'),ICON.more]].map(([p,l,ic])=>`<button class="${S.patientPage===p?'on':''}" onclick="S.patientPage='${p}';render()">${I(ic)}<span>${l}</span></button>`).join('')}</nav></div>`}
function patientToday(){const p=patientByName('Sarah Williams'),items=(p.assignedExerciseIds||['e1','e3','e4']).slice(0,4);return `<div class="todayHero"><small>Good afternoon, Sarah</small><h1>Today’s program</h1><p>${items.length} exercises · about 12 minutes</p><div class="todayProgress"><span style="width:${Math.min(100,Object.keys(S.patientCompleted).length/Math.max(1,items.length)*100)}%"></span></div></div>${items.map((id,i)=>{const e=EX.find(x=>x.id===id),done=S.patientCompleted[id],paused=(p.pausedExerciseIds||[]).includes(id);if(!e)return'';return `<div class="patientExercise"><div class="patientExerciseMedia">EXERCISE VIDEO</div><div class="patientExerciseBody"><div style="display:flex;justify-content:space-between;gap:8px"><span class="badge">${i+1} of ${items.length}</span>${paused?'<span class="badge amber">Paused by clinician</span>':''}</div><h3>${exText(e,'name')}</h3><p>${e.dose} · ${clinicalTerm('freq',e.freq)}</p><div class="whyLine"><b>Why:</b> ${exerciseWhy(e)}</div>${paused?'<div class="offlineNote">Skip this exercise until your clinician reactivates it.</div>':`<details style="margin-top:10px"><summary style="font-size:12px;font-weight:800;cursor:pointer">How to do it</summary><p>${exerciseInstruction(e)}</p></details><div style="font-size:12px;font-weight:800;margin:11px 0 6px">Difficulty</div><div class="ratingRow"><button class="ratingBtn">Too easy</button><button class="ratingBtn on">Just right</button><button class="ratingBtn">Too difficult</button></div><div class="painLine"><span>Pain</span><input type="range" min="0" max="10" value="${S.sessionPain}" oninput="S.sessionPain=this.value;this.nextElementSibling.textContent=this.value+'/10'"><b>${S.sessionPain}/10</b></div>${i===0?`<div style="font-size:12px;font-weight:800;margin:12px 0 6px">Doing this correctly?</div><div class="responseRow">${['Confident','Somewhat unsure','Not sure'].map(x=>`<button class="responseBtn ${S.confidence===x?'on':''}" onclick="S.confidence='${x}';render()">${x}</button>`).join('')}</div>`:''}<button class="btn ${done?'secondary':'primary'}" style="width:100%;margin-top:12px" onclick="completePatientExercise('${id}')">${done?'✓ Done':'Mark complete'}</button>`}</div></div>`}).join('')}<div class="patientProgressCard"><h2>After your program</h2><div class="responseRow">${['Better','About the same','Worse'].map(x=>`<button class="responseBtn ${S.sessionResponse===x?'on':''}" onclick="S.sessionResponse='${x}';render()">${x}</button>`).join('')}</div></div><button class="btn dark" style="width:100%;margin-top:14px" onclick="finishPatientSession()">Finish</button>`}
function completePatientExercise(id){S.patientCompleted[id]=true;toast(tx('patientApp.complete'));render()}
function finishPatientSession(){const total=Math.max(1,(patientByName('Sarah Williams').assignedExerciseIds||[]).filter(id=>!(patientByName('Sarah Williams').pausedExerciseIds||[]).includes(id)).slice(0,4).length),done=Object.keys(S.patientCompleted).length;if(done<total){barrierModal();return}successCustom('Session complete',`Your session was saved. Pain: ${S.sessionPain}/10 · Difficulty: just right · Response: ${S.sessionResponse}. Your clinician can review these trends.` ,`<button class="btn primary" onclick="closeModal();S.patientPage='progress';render()">View progress</button>`)}
function barrierModal(){showModal(`<div class="modalHead"><h2>What got in the way today?</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px;color:var(--muted)">One tap helps your clinician understand why the program was not completed.</p><div class="responseRow">${['Pain / soreness','Didn’t have time','Forgot','Wasn’t sure how','Didn’t feel safe','No equipment','Didn’t think I needed to','Other'].map(x=>`<button class="responseBtn" onclick="saveBarrier('${x.replace("'","\\'")}')">${x}</button>`).join('')}</div><button class="btn ghost" style="width:100%;margin-top:12px" onclick="closeModal()">Skip</button>`)}
function saveBarrier(v){S.barrier=v;closeModal();toast('Barrier saved');successCustom('Session saved',`Your clinician can see that ${v.toLowerCase()} got in the way today, along with your pain and exercise responses.`)}
function patientMobileProgress(){return `<div class="patientProgressCard"><h2>${tx('patientApp.progress')}</h2><div class="metricGrid"><div class="metricCard"><small>Adherence</small><strong>82%</strong></div><div class="metricCard"><small>Pain trend</small><strong>4 → 7</strong></div><div class="metricCard"><small>Difficulty</small><strong style="font-size:15px">Mostly just right</strong></div><div class="metricCard"><small>Session response</small><strong style="font-size:15px">Mostly better</strong></div></div></div><div class="patientProgressCard"><h2>Barriers</h2><div class="missionItem"><div><b>Pain / soreness</b><p>Reported once this month</p></div><span class="badge amber">1</span></div></div><div class="patientProgressCard"><h2>Last 4 weeks</h2>${chart()}</div>`}
function patientMobileMessages(){return `<div class="patientProgressCard"><h2>${tx('patientApp.messages')}</h2><div class="bubble">Your clinician updated your HEP on Aug 28.</div><div class="bubble me">Thanks — the new program is clear.</div><div class="chatCompose" style="padding:10px 0 0;border:0"><input placeholder="Message your clinician…"><button class="btn primary">${I(ICON.message)}</button></div></div>`}
function patientMore(){return `<div class="patientProgressCard"><h2>${tx('patientApp.more')}</h2><button class="btn secondary" style="width:100%;justify-content:flex-start">${I(ICON.globe)} ${tx('common.language')}</button><button class="btn secondary" style="width:100%;justify-content:flex-start;margin-top:8px">Education & resources</button><button class="btn secondary" style="width:100%;justify-content:flex-start;margin-top:8px" onclick="S.view='app';S.page='home';render()">Exit patient preview</button></div>`}
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';const r=document.getElementById('root');r.innerHTML=S.view==='marketing'?marketing():S.view==='auth'?auth():S.view==='patient'?patientApp():app();localizeDOM(r);if(S.searchOpen)setTimeout(()=>{renderSearchResults('');localizeDOM(document.getElementById('searchResults'))},0)}
render();
</script>
</body>
</html>
