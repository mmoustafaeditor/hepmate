function toast(msg,type='success'){const stack=document.getElementById('toastStack');const el=document.createElement('div');el.className='toast '+type+' slideUp';el.innerHTML=`<span class="toastIcon">${type==='success'?'✓':'•'}</span><span>${msg}</span>`;stack.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(8px)';setTimeout(()=>el.remove(),180)},2500)}

function addExercise(id){if(S.program.some(x=>x.id===id)){toast('Already in program','info');return}const e=EX.find(x=>x.id===id);S.program.push({...e});persist();toast(`${e.name} — ${tx('feedback.added')}`);render()}
function removeExercise(id){S.program=S.program.filter(x=>x.id!==id);persist();toast('Exercise removed','info');render()}
function useTemplate(id){const tpl=TPL.find(t=>t.id===id);tpl.ids.forEach(id=>{if(!S.program.some(x=>x.id===id)){const e=EX.find(x=>x.id===id);S.program.push({...e})}});persist();toast(`${tpl.name} loaded`);render()}

.v2')}</strong><p>${tx('marketing.v2s')}</p></div><div><strong>${tx('marketing.v3')}</strong><p>${tx('marketing.v3s')}</p></div></section></main>`}

function searchResults(q){const all=[...PATIENTS.map(p=>({name:p.name,type:'Patient',action:`nav('patient')`})),...EX.slice(0,8).map(e=>({name:e.name,type:'Exercise',action:`nav('exercises')`})),...TPL.map(t=>({name:t.name,type:'Template',action:`nav('heps')`}))];const res=all.filter(x=>x.name.toLowerCase().includes(q.toLowerCase())).slice(0,8);return res.length?res.map(x=>`<button class="searchResult" style="width:100%;border:0;background:none;text-align:left" onclick="S.searchOpen=false;${x.action}"><b>${x.name}</b><span>${x.type}</span></button>`).join(''):`<div style="padding:12px;font-size:9px;color:var(--muted)">No results</div>`}

function heps(){return `${pageTitle(tx('common.heps'),'Active assignments, drafts, reusable templates and program history.',`<button class="btn primary" onclick="builder('ai')">${I(ICON.plus)} ${tx('common.createHEP')}</button>`)}<nav class="hepTabs">${[['active','common.active'],['drafts','common.drafts'],['templates','common.templates'],['archived','common.archived']].map(([id,k])=>`<button class="${S.hepTab===id?'on':''}" onclick="S.hepTab='${id}';render()">${tx(k)}</button>`).join('')}</nav>${S.hepTab==='templates'?templateCards():programCards()}`}
function programCards(){const cards=S.hepTab==='drafts'?[['Sarah Williams','Knee OA Progression','Draft · 5 exercises','Edited 12 min ago'],['Maya Patel','Lumbar Control','Draft · 4 exercises','Edited yesterday']]:S.hepTab==='archived'?[['Alicia Brown','Ankle ORIF Phase 1','Archived','Completed Jul 18'],['James Lee','Lumbar Mobility','Archived','Completed Aug 2']]:[['Sarah Williams','Knee OA Program','Active · v2','82% adherence'],['Robert Green','Shoulder RC Rehab','Active · v3','94% adherence'],['Maya Patel','Lumbar Control','Active · v1','41% adherence'],['David Chen','Shoulder Mobility','Active · v2','88% adherence']];return `<div class="programGrid">${cards.map((x,i)=>`<div class="programCard"><span class="badge ${S.hepTab==='active'?'green':''}">${x[2]}</span><h3>${x[1]}</h3><p>${x[0]}<br>${x[3]}</p><div class="programMeta"><span class="badge">Last updated Aug ${28-i}</span><span class="badge">English</span></div><div class="programFooterRow"><button class="btn small ghost">${tx('common.preview')}</button><button class="btn small primary" onclick="builder('library')">${tx('common.edit')}</button></div></div>`).join('')}</div>`}
function templateCards(){return `<div class="programGrid">${TPL.map(t=>`<div class="programCard"><span class="badge violet">${t.scope}</span><h3>${t.name}</h3><p>${t.desc}</p><div class="programMeta"><span class="badge">${t.ids.length} exercises</span><span class="badge">Used 18×</span></div><div class="programFooterRow"><button class="btn small ghost">${tx('common.preview')}</button><button class="btn small primary" onclick="useTemplate('${t.id}');builder('templates')">Use template</button></div></div>`).join('')}</div>`}
function builderPage(){return `<div class="builderTop"><div class="builderTitle"><div><h1>${tx('builder.title')}</h1><p>Sarah Williams · L Knee OA</p></div></div><select class="patientSelect"><option>Sarah Williams · L Knee OA</option></select><div class="builderActions"><button class="btn secondary small" onclick="saveDraft()">${tx('common.saveDraft')}</button><button class="btn primary small" ${!S.program.length?'disabled':''} onclick="reviewProgram()">${tx('common.reviewAssign')}</button></div></div><div class="builderGrid"><section class="builderMain"><nav class="builderTabs">${[['ai',tx('builder.ai')],['library',tx('builder.library')],['templates',tx('builder.templates')]].map(([id,l])=>`<button class="builderTab ${S.builderTab===id?'on':''}" onclick="S.builderTab='${id}';render()">${l}</button>`).join('')}</nav>${S.builderTab==='ai'?aiBuilder():S.builderTab==='library'?libraryBuilder():templateBuilder()}</section><aside class="builderProgram"><div class="programHead"><div><h2>${tx('builder.program')} · ${S.program.length} Exercises</h2><span style="font-size:8px;color:var(--muted)">${tx('builder.drag')}</span></div><span class="badge green">Draft</span></div><div class="programScroll">${programItems()}</div><div class="programDetails"><b style="font-size:10px">${tx('builder.programDetails')}</b><div class="row2"><div class="field"><label>${tx('builder.startDate')}</label><input type="date" value="2026-09-02"></div><div class="field"><label>${tx('builder.frequency')}</label><select><option>Daily</option><option>5× / week</option><option>3× / week</option></select></div></div><div class="field"><label>${tx('builder.notes')}</label><textarea placeholder="Optional">Stop if symptoms significantly worsen and contact your clinician.</textarea></div><button class="btn small ghost" style="width:100%" onclick="S.view='patient';S.patientPage='today';render()">${I(ICON.eye)} ${tx('builder.previewPatient')}</button></div><div class="programBottom"><button class="btn primary" ${!S.program.length?'disabled':''} onclick="reviewProgram()">${tx('common.reviewAssign')} ${I(ICON.arrow)}</button><div class="autosaveText">${tx('builder.autosaved')}</div></div></aside></div><div class="mobileProgramBar" onclick="programDrawer()"><div><b>${tx('builder.program')} · ${S.program.length}</b><br><span>${S.program.length?S.program.map(x=>x.name).slice(0,2).join(', '):'No exercises yet'}</span></div>${I(ICON.chevron)}</div>`}
function programItems(){if(!S.program.length)return `<div class="programEmpty">Add exercises from AI suggestions, the library, or a saved template. Everything lands in this same program.</div>`;return S.program.map((e,i)=>`<div class="programItem"><span class="dragHandle">⋮⋮</span><div class="exerciseThumb">${i+1}</div><div><b>${e.name}</b><p>${e.dose} · ${e.freq}</p></div><button class="kebab" onclick="removeExercise('${e.id}')">${I(ICON.close)}</button></div>`).join('')}
function aiBuilder(){return `<div class="sectionTitle"><h2>${tx('builder.context')}</h2><button class="btn small ghost">${I(ICON.edit)} ${tx('common.edit')}</button></div><div class="contextGrid"><div class="contextBox"><small>${tx('builder.condition')}</small><b>Knee Osteoarthritis</b></div><div class="contextBox"><small>${tx('builder.goals')}</small><b>Walk &gt;20 min, stairs</b></div><div class="contextBox"><small>${tx('builder.pain')}</small><b>5/10</b></div><div class="contextBox"><small>${tx('builder.equipment')}</small><b>Chair, band</b></div><div class="contextBox"><small>${tx('builder.precautions')}</small><b>None</b></div><div class="contextBox"><small>${tx('builder.difficulty')}</small><b>Moderate</b></div></div><div class="aiPrompt"><h3>${tx('builder.focus')}</h3><textarea>${tx('builder.prompt')}</textarea><div class="aiMeta"><p>AI recommends. Clinician approves. Nothing changes the active HEP automatically.</p><button class="btn primary small" onclick="generateAI()">${I(ICON.ai)} ${tx('builder.generate')}</button></div></div>${S.generated?`<div class="suggestionList fadeIn"><div class="suggestionHeader"><div><h2>${tx('builder.suggested')} (6)</h2><span style="font-size:8px;color:var(--muted)">${tx('builder.suggestedSub')}</span></div><button class="btn small ghost" onclick="S.builderTab='library';render()">+ ${tx('builder.library')}</button></div>${['e1','e2','e3','e4','e5','e7'].map(id=>exerciseSuggestion(id)).join('')}</div>`:`<div style="margin-top:16px;border:1px dashed #cbd8d0;border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:9px">Generate a draft to see suggestions, or switch to the library/templates at any time.</div>`}`}
function exerciseSuggestion(id){const e=EX.find(x=>x.id===id),added=S.program.some(x=>x.id===id);return `<div class="exerciseSuggestion"><div class="exerciseThumb">MEDIA</div><div><b>${e.name}</b><p>${e.desc}</p></div><div class="dosePreview">${e.dose}<br>${e.freq}</div><button class="btn small ${added?'ghost':'secondary'}" ${added?'disabled':''} onclick="addExercise('${e.id}')">${added?'✓ Added':'Add'}</button></div>`}
function libraryBuilder(){let list=EX.filter(e=>(S.libraryFilter==='All'||e.region===S.libraryFilter)&&(!S.librarySearch||e.name.toLowerCase().includes(S.librarySearch.toLowerCase())));return `<div class="libraryToolbar"><input placeholder="${tx('common.search')}" value="${S.librarySearch}" oninput="S.librarySearch=this.value;render()"><button class="btn secondary small" onclick="customExercise()">+ Custom exercise</button></div><div class="filters">${['All','Knee','Hip','Lumbar','Ankle','Thoracic'].map(f=>`<button class="filter ${S.libraryFilter===f?'on':''}" onclick="S.libraryFilter='${f}';render()">${f}</button>`).join('')}<button class="filter">★ Favorites</button><button class="filter">Recently used</button></div><p style="font-size:9px;color:var(--muted)">${tx('builder.manualHint')}</p><div class="exerciseGrid">${list.map(e=>`<div class="exerciseCard" onclick="S.previewExercise='${e.id}'"><div class="exerciseCardTop"><div class="exerciseThumb">MEDIA</div><div><h3>${e.name}</h3><p>${e.desc}</p><span class="badge" style="margin-top:5px">${e.region}</span></div></div><div class="exerciseCardFooter"><button class="btn small ghost" onclick="event.stopPropagation();previewExercise('${e.id}')">${tx('common.preview')}</button><button class="btn small primary" onclick="event.stopPropagation();addExercise('${e.id}')">+ Add</button></div></div>`).join('')}</div>`}
function templateBuilder(){return `<p style="font-size:9px;color:var(--muted)">${tx('builder.templateHint')}</p><div class="templateGrid">${TPL.map(t=>`<div class="templateCard"><span class="badge violet">${t.scope}</span><h3>${t.name}</h3><p>${t.desc}</p><div class="programFooterRow"><button class="btn small ghost">${tx('common.preview')}</button><button class="btn small primary" onclick="useTemplate('${t.id}')">Use template</button></div></div>`).join('')}</div>`}
function customExercise(){showModal(`<div class="modalHead"><h2>New custom exercise</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="field"><label>Exercise name</label><input value="Supported Mini Squat"></div><div class="field"><label>Patient instructions</label><textarea>Stand at a counter for support. Bend your knees into a comfortable mini squat, then return to standing.</textarea></div><div class="row2"><div class="field"><label>Body region</label><select><option>Knee</option><option>Hip</option></select></div><div class="field"><label>Equipment</label><input value="Counter"></div></div><div class="field"><label>Media</label><button class="btn secondary" style="width:100%">Upload photo or video</button></div><button class="btn primary" style="width:100%" onclick="closeModal();toast('Custom exercise saved')">Save exercise</button>`)}
function previewExercise(id){const e=EX.find(x=>x.id===id);showModal(`<div class="modalHead"><h2>${e.name}</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="previewMedia">EXERCISE MEDIA</div><p style="font-size:10px;color:var(--muted);line-height:1.55">${e.desc}. Patient-friendly instructions and licensed media will appear here.</p><div class="detailList"><div><span>Region</span><b>${e.region}</b></div><div><span>Goal</span><b>${e.goal}</b></div><div><span>Equipment</span><b>${e.equip}</b></div><div><span>Default dosage</span><b>${e.dose}</b></div><div><span>Progression</span><b>View related exercises</b></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="addExercise('${e.id}');closeModal()">+ Add to program</button>`)}
function exercises(){const e=EX.find(x=>x.id===S.previewExercise)||EX[0];return `${pageTitle(tx('common.exercises'),'Browse HEPmate exercises, clinic content, favorites and custom exercises.',`<button class="btn secondary" onclick="customExercise()">+ Custom exercise</button><button class="btn primary" onclick="builder('library')">${I(ICON.plus)} Add to HEP</button>`)}<div class="fullLibrary"><section>${libraryBuilder()}</section><aside class="previewPanel"><div class="previewMedia">EXERCISE MEDIA</div><div class="previewBody"><span class="badge green">HEPmate Library</span><h2>${e.name}</h2><p>${e.desc}. This preview stays visible while you browse on desktop.</p><div class="detailList"><div><span>Region</span><b>${e.region}</b></div><div><span>Goal</span><b>${e.goal}</b></div><div><span>Equipment</span><b>${e.equip}</b></div><div><span>Dosage</span><b>${e.dose}</b></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="addExercise('${e.id}')">+ Add to program</button></div></aside></div>`}
function messages(){const threads=[['Sarah Williams','Step-ups are bothering my knee','2m'],['Maya Patel','Can I do these before work?','1h'],['Robert Green','Thanks — feels easier now','Yesterday']];return `${pageTitle(tx('common.messages'),'Patient communication with original + translated text preserved.') }<div class="messagesGrid"><aside class="threads">${threads.map((x,i)=>`<button class="thread ${S.selectedThread===i?'on':''}" style="width:100%;border:0;text-align:left" onclick="S.selectedThread=${i};render()"><div class="avatar">${['SW','MP','RG'][i]}</div><div><b>${x[0]}</b><p>${x[1]}</p><span style="font-size:8px;color:var(--muted)">${x[2]}</span></div></button>`).join('')}</aside><section class="chat"><div class="chatHead"><div class="avatar">SW</div><div><b>Sarah Williams</b><div style="font-size:8px;color:var(--muted)">Preferred language: English</div></div></div><div class="chatBody"><div class="bubble">Hi Dr. Moustafa — the step-ups have been bothering the front of my knee the last two times.<div class="translationLine">Original · English</div></div><div class="bubble me">Thanks for letting me know. I’m going to review the exercise and your recent pain scores before we decide whether to modify it.</div><div class="bubble">Everything else feels okay and stairs are a little easier.</div></div><div class="chatCompose"><input id="chatInput" placeholder="Write a message…"><button class="btn primary" onclick="sendMessage()">${I(ICON.message)} ${tx('common.send')}</button></div></section></div>`}
function sendMessage(){const val=document.getElementById('chatInput')?.value?.trim();if(!val){toast('Write a message first','info');return}toast(tx('feedback.messageSent'));document.getElementById('chatInput').value=''}
function outcomes(){return `${pageTitle(tx('common.outcomes'),'Track function, symptoms and validated outcome measures over time.',`<button class="btn secondary">Assign outcome</button>`)}<div class="outcomeGrid"><section><div class="outcomeCards"><div class="miniCard"><small>Outcomes due</small><strong>5</strong><span class="badge amber">Today</span></div><div class="miniCard"><small>Completed this week</small><strong>18</strong><span class="badge green">+12%</span></div><div class="miniCard"><small>Avg function change</small><strong>+16%</strong><span class="badge green">Improving</span></div></div><div class="questionnaireList">${[['Sarah Williams','LEFS','Due Sep 5','Baseline 44 → Current 52'],['James Lee','Oswestry Disability Index','Completed today','42% → 30%'],['Robert Green','QuickDASH','Due Sep 6','Baseline 57 → Current 41'],['Maya Patel','PSFS','Due Sep 7','4.2 → 5.7']].map(x=>`<div class="questionnaire"><div><b>${x[0]} · ${x[1]}</b><p>${x[2]} · ${x[3]}</p></div><button class="btn small ghost">Open</button></div>`).join('')}</div></section><aside>${chart()}</aside></div>`}
function rtm(){return `${pageTitle(tx('common.rtm'),'RTM-ready monitoring workflow and documentation support. Eligibility remains payer/ruleset dependent.') }<div class="syntheticBar">Prototype only. HEPmate will surface potential eligibility/documentation readiness; it will not guarantee reimbursement.</div><div class="rtmGrid"><div class="rtmCard"><h3>Monitoring periods</h3><p>See device/activity days and identify patients who may need documentation review.</p><div style="margin:13px 0 6px;font-size:9px;display:flex;justify-content:space-between"><b>Sarah Williams</b><span>12 / 15 days</span></div><div class="progressBar"><span style="width:80%"></span></div>${[['Robert Green','18 / 30 device days','Potential 98977 window'],['Maya Patel','8 / 15 device days','Potential 98985 window'],['David Chen','21 / 30 device days','Review interaction time']].map(x=>`<div class="rtmPatient"><div><b>${x[0]}</b><p>${x[2]}</p></div><span class="badge green">${x[1]}</span></div>`).join('')}</div><div class="rtmCard"><h3>Interactive treatment time</h3><p>Track qualifying synchronous interaction separately from passive exercise logging.</p>${[['Sarah Williams','12 min','This period'],['Robert Green','24 min','This period'],['Maya Patel','8 min','This period']].map(x=>`<div class="rtmPatient"><div><b>${x[0]}</b><p>${x[2]}</p></div><span class="badge">${x[1]}</span></div>`).join('')}<button class="btn secondary" style="width:100%;margin-top:10px">Add interaction time</button></div><div class="rtmCard"><h3>Documentation readiness</h3><p>Structured evidence that can support clinician review and documentation.</p><div class="progressBar"><span style="width:72%"></span></div><p style="margin-top:8px">72% of active RTM patients have complete structured activity + interaction records in this demo.</p></div><div class="rtmCard"><h3>Ruleset</h3><p>Effective date: 2026 · Musculoskeletal RTM<br>Rules remain configurable by payer and effective date.</p><button class="btn ghost small">View rules</button></div></div>`}
function aiAssistant(){return `<div class="aiAssistant"><div class="assistantHero"><div class="assistantMark">${I(ICON.ai)}</div><h1>${tx('common.ai')}</h1><p>Ask about patient progress, recent signals, HEP history or clinic workflow.</p></div><div class="promptChips">${['Summarize Sarah’s last 2 weeks','Who needs attention today?','What changed after HEP v2?','Show patients with declining adherence'].map(q=>`<button class="promptChip" onclick="document.getElementById('aiPrompt').value='${q}';askAssistant()">${q}</button>`).join('')}</div><div class="assistantConversation"><div class="assistantResponse"><b>HEPmate</b><p style="margin:6px 0 0">I can summarize structured rehabilitation data and suggest what to review. I won’t modify an active HEP without clinician approval.</p></div>${S.assistantReply?`<div class="assistantResponse fadeIn" style="margin-top:10px"><b>Sarah Williams · 14-day summary</b><p>Adherence is 82%. Pain increased from 4/10 to 7/10 over the last two sessions after Step-Up was introduced in HEP v2. Step-Up difficulty remained “just right,” suggesting symptom response rather than perceived effort is driving the signal. Function has improved approximately 18% on the tracked goal measure.</p><div style="margin-top:8px"><span class="badge red">Review Step-Up tolerance</span> <span class="badge green">Function improving</span></div></div>`:''}</div><div class="assistantCompose"><textarea id="aiPrompt" placeholder="Ask HEPmate…"></textarea><button class="btn primary" onclick="askAssistant()">${I(ICON.arrow)}</button></div></div>`}
function askAssistant(){S.assistantReply=true;render();setTimeout(()=>toast('Summary generated'),100)}
function clinicPage(){return `${pageTitle(tx('common.clinic'),'Manage locations, team members, branding and shared templates.') }<div class="programGrid"><div class="programCard"><span class="badge green">Workspace</span><h3>Main Street Rehab</h3><p>1 location · 6 clinicians · 42 active patients</p><div class="programFooterRow"><button class="btn small ghost">Manage</button></div></div><div class="programCard"><span class="badge">Branding</span><h3>Patient-facing identity</h3><p>Logo, contact information, HEP PDF footer and invite settings.</p><div class="programFooterRow"><button class="btn small ghost">Edit</button></div></div><div class="programCard"><span class="badge violet">Shared content</span><h3>Clinic Templates</h3><p>12 shared HEP templates · 18 custom exercises</p><div class="programFooterRow"><button class="btn small ghost">Open</button></div></div></div>`}
function settingsPage(){return `${pageTitle(tx('common.settings'),'Personal preferences, language, notifications and account controls.') }<div style="max-width:620px"><div class="card" style="padding:16px"><div class="field"><label>${tx('common.language')}</label><select onchange="setLang(this.value)"><option value="en" ${S.lang==='en'?'selected':''}>English</option><option value="es" ${S.lang==='es'?'selected':''}>Español</option><option value="ar" ${S.lang==='ar'?'selected':''}>العربية</option></select></div><div class="field"><label>Default patient reminder time</label><input type="time" value="18:00"></div><div class="field"><label>Notifications</label><select><option>Important clinical signals + messages</option><option>All activity</option><option>Minimal</option></select></div><button class="btn primary" onclick="toast('Settings saved')">${tx('common.save')}</button></div></div>`}
function appContent(){switch(S.page){case'home':return dashboard();case'patients':return patients();case'patient':return patient();case'heps':return heps();case'builder':return builderPage();case'exercises':return exercises();case'messages':return messages();case'outcomes':return outcomes();case'rtm':return rtm();case'ai':return aiAssistant();case'clinic':return clinicPage();case'settings':return settingsPage();default:return dashboard()}}
function app(){return shell(appContent())}
function patientApp(){return `<div class="patientApp"><header class="patientTop"><span class="wordmark">HEP<span>mate</span></span><div style="display:flex;gap:7px"><select class="btn secondary small" onchange="setLang(this.value)"><option value="en" ${S.lang==='en'?'selected':''}>EN</option><option value="es" ${S.lang==='es'?'selected':''}>ES</option><option value="ar" ${S.lang==='ar'?'selected':''}>AR</option></select><button class="userButton" onclick="S.view='app';S.page='home';render()"><div class="avatar">SW</div></button></div></header><main class="patientMain">${S.patientPage==='today'?patientToday():S.patientPage==='progress'?patientMobileProgress():S.patientPage==='messages'?patientMobileMessages():patientMore()}</main><nav class="patientBottomNav">${[['today',tx('common.today'),ICON.home],['progress',tx('common.progress'),ICON.outcome],['messages',tx('common.messages'),ICON.message],['more',tx('common.more'),ICON.more]].map(([p,l,ic])=>`<button class="${S.patientPage===p?'on':''}" onclick="S.patientPage='${p}';render()">${I(ic)}<span>${l}</span></button>`).join('')}</nav></div>`}
function patientToday(){const items=['e1','e3','e4'];return `<div class="todayHero"><small>Good afternoon, Sarah</small><h1>${tx('patientApp.today')}</h1><p>${tx('patientApp.sub')}</p><div class="todayProgress"><span style="width:${Object.keys(S.patientCompleted).length/items.length*100}%"></span></div></div>${items.map((id,i)=>{const e=EX.find(x=>x.id===id),done=S.patientCompleted[id];return `<div class="patientExercise"><div class="patientExerciseMedia">EXERCISE VIDEO</div><div class="patientExerciseBody"><span class="badge">${i+1} of ${items.length}</span><h3>${e.name}</h3><p>${e.dose} · ${e.freq}<br>${e.desc}</p><div style="font-size:9px;font-weight:800;margin:10px 0 6px">How did this feel?</div><div class="ratingRow"><button class="ratingBtn">Too easy</button><button class="ratingBtn on">Just right</button><button class="ratingBtn">Too difficult</button></div><div class="painLine"><span>Pain</span><input type="range" min="0" max="10" value="${S.sessionPain}" oninput="S.sessionPain=this.value;this.nextElementSibling.textContent=this.value+'/10'"><b>${S.sessionPain}/10</b></div><button class="btn ${done?'secondary':'primary'}" style="width:100%;margin-top:11px" onclick="completePatientExercise('${id}')">${done?'✓ '+tx('common.done'):tx('patientApp.complete')}</button></div></div>`}).join('')}<button class="btn dark" style="width:100%;margin-top:14px" onclick="finishPatientSession()">${tx('patientApp.finish')}</button>`}
function completePatientExercise(id){S.patientCompleted[id]=true;toast(tx('patientApp.complete'));render()}
function finishPatientSession(){showModal(`<div class="successModal"><div class="successIcon">${I(ICON.check)}</div><h2>Session complete</h2><p>Your progress was saved and shared with your clinician. Nice work staying consistent.</p><div class="successActions"><button class="btn primary" onclick="closeModal();S.patientPage='progress';render()">View progress</button></div></div>`)}
function patientMobileProgress(){return `<div class="patientProgressCard"><h2>${tx('patientApp.progress')}</h2><div class="metricGrid"><div class="metricCard"><small>${tx('patientApp.consistency')}</small><strong>82%</strong></div><div class="metricCard"><small>${tx('patientApp.symptoms')}</small><strong>7 → 4</strong></div><div class="metricCard"><small>${tx('patientApp.function')}</small><strong>+18%</strong></div><div class="metricCard"><small>Sessions</small><strong>12</strong></div></div></div><div class="patientProgressCard"><h2>Last 4 weeks</h2>${chart()}</div>`}
function patientMobileMessages(){return `<div class="patientProgressCard"><h2>${tx('patientApp.messages')}</h2><div class="bubble">Your clinician updated your HEP on Aug 28.</div><div class="bubble me">Thanks — the new program is clear.</div><div class="chatCompose" style="padding:10px 0 0;border:0"><input placeholder="Message your clinician…"><button class="btn primary">${I(ICON.message)}</button></div></div>`}
function patientMore(){return `<div class="patientProgressCard"><h2>${tx('patientApp.more')}</h2><button class="btn secondary" style="width:100%;justify-content:flex-start">${I(ICON.globe)} ${tx('common.language')}</button><button class="btn secondary" style="width:100%;justify-content:flex-start;margin-top:8px">Education & resources</button><button class="btn secondary" style="width:100%;justify-content:flex-start;margin-top:8px" onclick="S.view='app';S.page='home';render()">Exit patient preview</button></div>`}
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';const r=document.getElementById('root');r.innerHTML=S.view==='marketing'?marketing():S.view==='auth'?auth():S.view==='patient'?patientApp():app();if(S.searchOpen)setTimeout(()=>renderSearchResults(''),0)}
render();
</script>
</body>
</html>
