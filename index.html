function localizeDOM(root){
 if(S.lang==='en'||!root)return;
 const map={...(DOM_LOCAL[S.lang]||{}),...(DAY3_LOCAL[S.lang]||{})};
 const keys=Object.keys(map).sort((a,b)=>b.length-a.length);
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 let n;while(n=walker.nextNode()){
  let s=n.nodeValue;
  for(const k of keys) if(s.includes(k)) s=s.split(k).join(map[k]);
  n.nodeValue=s;
 }
 root.querySelectorAll('[placeholder]').forEach(el=>{let s=el.getAttribute('placeholder')||'';for(const k of keys) if(s.includes(k)) s=s.split(k).join(map[k]);el.setAttribute('placeholder',s)});
}

function renderSearchResults(q=''){const el=document.getElementById('searchResults');if(el)el.innerHTML=q.trim()?searchResults(q):`<div style="padding:10px;font-size:9px;color:var(--muted)">Start typing to search patients, HEPs and exercises.</div>`}
function openSearch(q=''){S.searchOpen=true;const el=document.getElementById('searchResults');if(el)el.classList.remove('hidden');renderSearchResults(q)}
function mobileHeader(){return `<header class="mobileHeader"><span class="wordmark">HEP<span>mate</span></span><div style="display:flex;gap:5px"><button class="topAction" onclick="openDrawer('notifications')">${I(ICON.bell)}<span class="notifDot">4</span></button><button class="userButton" onclick="openDrawer('profile')"><div class="avatar">MM</div></button></div></header>`}
function mobileBottom(){return `<nav class="mobileBottom">${[['home','common.home',ICON.home],['patients','common.patients',ICON.patients],['builder','HEP Builder',ICON.heps],['messages','common.messages',ICON.message],['more','common.more',ICON.more]].map(([p,k,ic])=>`<button class="${S.page===p?'on':''}" onclick="${p==='builder'?"builder()":p==='more'?"openMobileMore()":`nav('${p}')`}">${I(ic)}<span>${k.includes('.')?tx(k):k}</span></button>`).join('')}</nav>`}
function openMobileMore(){document.getElementById('drawerRoot').innerHTML=`<div class="drawer slideUp"><div class="drawerHead"><h2>${tx('common.more')}</h2><button class="closeBtn" onclick="closeDrawer()">${I(ICON.close)}</button></div><div class="drawerBody"><button class="btn secondary" style="width:100%;justify-content:flex-start" onclick="closeDrawer();nav('saved')">${I(ICON.heps)} Saved HEPs</button><button class="btn secondary" style="width:100%;justify-content:flex-start;margin-top:8px" onclick="closeDrawer();nav('exercises')">${I(ICON.exercise)} ${tx('common.exercises')}</button><button class="btn secondary" style="width:100%;justify-content:flex-start;margin-top:8px" onclick="closeDrawer();nav('rtm')">${I(ICON.rtm)} ${tx('common.rtm')}</button><button class="btn ghost" style="width:100%;justify-content:flex-start;margin-top:8px" onclick="closeDrawer();nav('settings')">${I(ICON.settings)} ${tx('common.settings')}</button></div></div>`}
function shell(content){return `<div class="clinicianShell"><div class="desktopApp">${sidebar()}<section class="appColumn">${topbar()}${mobileHeader()}<main class="main ${S.page==='builder'&&S.builderMode?'builderShell':''}">${content}</main></section></div>${mobileBottom()}</div>`}
function pageTitle(title,sub,actions=''){return `<div class="pageTitle"><div><h1>${title}</h1><p>${sub}</p></div><div class="pageActions">${actions}</div></div>`}
function dashboard(){return `${pageTitle(tx('dash.hello'),tx('dash.headline'),`<button class="btn secondary" onclick="invitePatient()">${I(ICON.patients)} ${tx('common.invite')}</button><button class="btn primary" onclick="builder()">${I(ICON.plus)} HEP Builder</button>`)}<div class="syntheticBar">Synthetic demo data only — do not enter real patient information.</div><div class="dashboardGrid"><section><div class="card"><div class="cardHeader"><h2>${tx('dash.attention')} <span class="badge red">4</span></h2><a>${tx('common.viewAll')}</a></div><div class="attentionList">${[
['SW','Sarah Williams','L Knee OA','Pain increased','4 → 7 over last 2 sessions','red'],['RG','Robert Green','R Shoulder RC Rehab','Exercise too easy','Rated “too easy” 3×','amber'],['MP','Maya Patel','Low Back Pain','No activity','No HEP activity in 5 days','amber'],['JL','James Lee','Low Back Pain','Confidence low','Unsure about new exercise 2×','violet']].map((x,i)=>`<button class="attentionRow" style="width:100%;border:0;background:transparent;text-align:left" onclick="${i===0?"openSignalReview()":"toast('Patient opened')"}"><div class="avatar">${x[0]}</div><div><b>${x[1]}</b><p>${x[2]}</p></div><div><span class="badge ${x[5]}">${x[3]}</span><p>${x[4]}</p></div>${I(ICON.chevron)}</button>`).join('')}</div></div><section class="quickSection"><div class="sectionTitle"><h2>${tx('dash.quick')}</h2></div><div class="quickGrid">${[
[ICON.heps,'HEP Builder','AI, manual or saved programs',"builder()"],[ICON.patients,tx('common.patients'),'View adherence and response',"nav('patients')"],[ICON.message,tx('common.messages'),'Patient communication',"nav('messages')"],[ICON.rtm,tx('common.rtm'),'Monitoring & documentation',"nav('rtm')"]].map(x=>`<button class="quickTile" onclick="${x[3]}"><div class="quickIcon">${I(x[0])}</div><div><b>${x[1]}</b><p>${x[2]}</p></div></button>`).join('')}</div></section><div class="card recentCard"><div class="cardHeader"><h2>${tx('dash.recent')}</h2><a>${tx('common.viewAll')}</a></div><div class="recentGrid">${[['SW','Sarah completed a HEP session','15m'],['RG','Robert rated an exercise too easy','1h'],['MP','Maya reported “not sure how” as a barrier','2h'],['JL','James reported low confidence with a new exercise','3h'],['SW','New message from Sarah','5h'],['RG','HEP v3 assigned to Robert','Yesterday']].map(x=>`<div class="recentItem"><div class="avatar" style="width:30px;height:30px;font-size:9px">${x[0]}</div><p>${x[1]}</p><time>${x[2]}</time></div>`).join('')}</div></div></section><aside class="rightStack"><div class="card"><div class="cardHeader"><h2>Recovery Snapshot</h2><a>${tx('common.viewAll')}</a></div><div class="snapshotGrid"><div class="snapshot"><small>On track</small><strong>21</strong></div><div class="snapshot"><small>Need attention</small><strong style="color:var(--amber)">4</strong></div><div class="snapshot"><small>Follow-through declining</small><strong style="color:var(--red)">3</strong></div><div class="snapshot"><small>Worsening despite adherence</small><strong style="color:var(--red)">2</strong></div></div></div><div class="card"><div class="cardHeader"><h2>Between-visit signals</h2><a>${tx('common.viewAll')}</a></div><div class="missionList">${[['Pain / soreness','6 patients','Primary barrier'],['Not sure how','3 patients','Barrier'],['Repeated “too easy”','5 patients','Difficulty signal'],['Low confidence','2 patients','New / changed exercise'],['Changes awaiting response','4 programs','HEP change follow-up']].map(x=>`<div class="missionItem"><div><b>${x[0]}</b><p>${x[2]}</p></div><strong>${x[1].split(' ')[0]}</strong></div>`).join('')}</div></div></aside></div>`}
function patients(){return `${pageTitle(tx('common.patients'),'View adherence, symptoms, exercise difficulty, response and barriers between visits.',`<button class="btn secondary" onclick="invitePatient()">${I(ICON.plus)} ${tx('common.invite')}</button><button class="btn primary" onclick="builder()">${I(ICON.plus)} HEP Builder</button>`)}<div class="tableCard"><div class="tableHead"><span>Patient</span><span>Condition</span><span>Active HEP</span><span>Adherence</span><span>Status</span><span></span></div>${PATIENTS.map((p,i)=>`<div class="patientRow"><div class="patientIdentity"><div class="avatar">${p.initial}</div><div><b>${p.name}</b><p>Last active ${p.last}</p></div></div><span>${p.condition}</span><span>${p.hep}</span><span>${p.adherence}</span><span><span class="badge ${p.statusType}">${p.status}</span></span><button class="btn iconOnly small ghost" onclick="${i===0?"nav('patient')":"toast('Patient opened')"}">${I(ICON.chevron)}</button></div>`).join('')}</div>`}
function showPatientAISummary(){showModal(`<div class="modalHead"><h2>${I(ICON.ai)} AI summary of last 14 days</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="signalEvidence"><b>What changed</b><p>Adherence remained high at 82%, but pain rose from 4/10 to 7/10 after Step-Up entered HEP v2. Difficulty stayed “just right.” The last two post-session responses were “worse.”</p></div><div class="signalEvidence"><b>Why it matters</b><p>The combination suggests tolerance or symptom response deserves review rather than a simple effort/difficulty problem.</p></div><div class="aiContext">${I(ICON.ai)} AI recommendation · Clinician decides</div><p style="font-size:12px">Review Step-Up dosage, height or appropriateness before progressing further. No automatic HEP change will occur.</p><button class="btn primary" style="width:100%" onclick="closeModal();builderForPatient('Sarah Williams','manual')">Review HEP</button>`)}
function explainSignalAI(){showPatientAISummary()}
function openSignalReview(){showModal(`<div class="modalHead"><h2>Review signal · Sarah Williams</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="signalEvidence"><b>Evidence</b><p>Pain 4 → 7 across two sessions · Step-Up added in HEP v2 · difficulty “just right” · response “worse” twice · adherence 82%.</p></div><div class="signalActions"><button class="btn secondary" onclick="closeModal();showPatientAISummary()">${I(ICON.ai)} Explain signal</button><button class="btn secondary" onclick="closeModal();nav('messages')">Message patient</button><button class="btn primary" onclick="closeModal();builderForPatient('Sarah Williams','manual')">Review HEP</button><button class="btn ghost" onclick="signalAction('Reviewed — no change')">Reviewed — no change</button><button class="btn ghost" onclick="signalAction('Snoozed for 48 hours')">Snooze</button><button class="btn ghost" onclick="signalAction('Resolved')">Resolve</button></div>`)}
function signalAction(action){S.signalAction=action;closeModal();render();toast(action+' · added to Rehabilitation Memory')}
function suggestModification(id){const e=EX.find(x=>x.id===id);showModal(`<div class="modalHead"><h2>${I(ICON.ai)} AI recommendation</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px;color:var(--muted)">For <b>${exText(e,'name')}</b>, based on the recent symptom pattern:</p><div class="signalEvidence"><b>Regression option</b><p>Reduce step height and volume to 2 × 6–8, then reassess symptom response.</p></div><div class="signalEvidence"><b>Alternative</b><p>Temporarily replace with Sit-to-Stand if stair loading remains provocative.</p></div><div class="aiContext">${I(ICON.ai)} Clinician approval required</div><div class="successActions"><button class="btn secondary" onclick="closeModal()">Keep current</button><button class="btn primary" onclick="closeModal();toast('Suggestion applied to draft only')">Apply to draft</button></div>`)}
function explainHEPChange(){showModal(`<div class="modalHead"><h2>${I(ICON.ai)} What changed in HEP v2</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px">Compared with v1, Step-Up was added and standing hip abduction volume increased. The clinician recorded “progression” as the reason. Since that change, adherence stayed high while pain rose over the last two sessions.</p><div class="aiContext">${I(ICON.ai)} Summary only · no automatic changes</div>`)}
function patient(){return `<div class="patientHero"><div class="patientHeroLeft"><div class="avatar">SW</div><div><h1>Sarah Williams</h1><p>L Knee OA · Active HEP v2 · Assigned clinician: Dr. Moustafa</p></div></div><div class="pageActions"><button class="btn secondary" onclick="showPatientAISummary()">${I(ICON.ai)} AI summary</button><button class="btn secondary" onclick="builderForPatient('Sarah Williams','manual')">${I(ICON.edit)} Edit HEP</button><button class="btn primary" onclick="nav('messages')">${I(ICON.message)} Message Sarah</button></div></div><nav class="tabs">${[['overview',tx('common.overview')],['hep',tx('patient.hep')],['progress',tx('patient.progress')],['messages',tx('patient.messages')]].map(([id,l])=>`<button class="tab ${S.patientTab===id?'on':''}" onclick="S.patientTab='${id}';render()">${l}</button>`).join('')}</nav>${S.patientTab==='overview'?patientOverview():S.patientTab==='hep'?patientHEP():S.patientTab==='progress'?patientProgress():`<div class="card" style="padding:20px">Open the Messages workspace to continue the conversation with Sarah.</div>`}`}
function patientOverview(){const action=S.signalAction?`<div class="memoryEvent"><span class="memoryDot"></span><div><b>Clinician action</b><p>${S.signalAction}</p><time>Just now</time></div></div>`:'';return `<div class="patientDetailGrid"><section><div class="signalCard"><div><b>${tx('patient.needs')}</b><p>Pain increased from 4 → 7 across two sessions after Step-Up was introduced. Difficulty remained “just right,” and the last two session responses were “worse.”</p><div class="signalActions"><button class="btn small secondary" onclick="explainSignalAI()">${I(ICON.ai)} Explain signal</button><button class="btn small primary" onclick="openSignalReview()">Review</button></div></div><span class="badge red">High priority</span></div><div class="metricGrid"><div class="metricCard"><small>Adherence</small><strong>82%</strong><em>+6% vs prior week</em></div><div class="metricCard"><small>Current pain</small><strong>7/10</strong><em style="color:var(--red)">↑ 3 points</em></div><div class="metricCard"><small>Difficulty</small><strong style="font-size:16px">Just right</strong><em>Most sessions</em></div><div class="metricCard"><small>Post-session response</small><strong style="font-size:16px;color:var(--red)">Worse 2×</strong><em>Last 2 sessions</em></div></div>${chart()}<div class="card" style="margin-top:14px"><div class="cardHeader"><h2>Exercise response</h2><a>View all</a></div><div style="padding:0 14px">${[['Step-Up','Pain 7/10','Just right','Worse','Review'],['Sit-to-Stand','Pain 4/10','Just right','Same','Stable'],['Hip Abduction','Pain 3/10','Too easy','Better','Progress']].map(x=>`<div style="display:grid;grid-template-columns:1fr auto auto auto auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);font-size:11px;align-items:center"><b>${x[0]}</b><span>${x[1]}</span><span>${x[2]}</span><span>${x[3]}</span><span class="badge ${x[4]==='Review'?'red':'green'}">${x[4]}</span></div>`).join('')}</div></div></section><aside><div class="memoryCard"><div class="cardHeader"><h2>Rehabilitation Memory</h2><a>${tx('common.viewAll')}</a></div><div class="memoryList">${action}${[['Today','Attention signal created','Pain 7/10 for second consecutive session; response worse after program.'],['Aug 31','Barrier check','No barrier reported; adherence remained high.'],['Aug 28','HEP v2 published','Step-Up added. Clinician reason: progression.'],['Aug 25','Patient check-in','Pain 4/10 · difficulty just right · response same.'],['Aug 12','Initial HEP assigned','4 exercises assigned.']].map(x=>`<div class="memoryEvent"><span class="memoryDot"></span><div><b>${x[1]}</b><p>${x[2]}</p><time>${x[0]}</time></div></div>`).join('')}</div></div></aside></div>`}
function chart(){return `<div class="chartCard"><div class="chartTop"><h3>Pain trend + HEP changes</h3><div class="chartLegend"><span style="color:var(--red)">● Pain</span><span>┆ HEP change</span></div></div><div class="chartCanvas"><svg viewBox="0 0 700 240" width="100%" height="100%" preserveAspectRatio="none"><line x1="38" y1="18" x2="38" y2="205" stroke="#d9dfdb"/><line x1="38" y1="205" x2="680" y2="205" stroke="#d9dfdb"/><g stroke="#edf0ee"><line x1="38" y1="55" x2="680" y2="55"/><line x1="38" y1="105" x2="680" y2="105"/><line x1="38" y1="155" x2="680" y2="155"/></g><line x1="300" y1="18" x2="300" y2="205" stroke="#9fb1a8" stroke-dasharray="5 5"/><text x="308" y="30" font-size="11" fill="#69776f">HEP v2 · Step-Up added</text><polyline fill="none" stroke="#be4c50" stroke-width="4" points="45,123 140,140 230,149 320,116 420,85 530,67 670,70"/><circle cx="670" cy="70" r="5" fill="#be4c50"/><text x="3" y="59" font-size="10" fill="#7b8781">8</text><text x="3" y="109" font-size="10" fill="#7b8781">5</text><text x="3" y="159" font-size="10" fill="#7b8781">2</text><text x="42" y="225" font-size="10" fill="#7b8781">Aug 12</text><text x="635" y="225" font-size="10" fill="#7b8781">Sep 3</text></svg></div></div>`}
function patientHEP(){return `<div class="card"><div class="cardHeader"><h2>Active HEP · v2</h2><div><button class="btn small secondary" onclick="suggestModification('e3')">${I(ICON.ai)} Suggest progression / regression</button> <button class="btn small primary" onclick="builderForPatient('Sarah Williams','manual')">${tx('common.edit')}</button></div></div><div style="padding:0 16px">${['e1','e3','e4','e7'].map((id,i)=>{const e=EX.find(x=>x.id===id);return `<div class="exerciseSuggestion"><div class="exerciseThumb">MEDIA</div><div><b>${exText(e,'name')}</b><p>${exText(e,'desc')}</p></div><div class="dosePreview">${e.dose}<br>${clinicalTerm('freq',e.freq)}</div><span class="badge green">Active</span></div>`}).join('')}</div></div><div class="card" style="margin-top:14px"><div class="cardHeader"><h2>Version history</h2><button class="btn small ghost" onclick="explainHEPChange()">${I(ICON.ai)} Explain what changed</button></div><div style="padding:0 16px">${[['v2','Aug 28','Progression','Step-Up added; hip abduction dosage increased'],['v1','Aug 12','Initial program','4 exercises assigned']].map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line2);display:grid;grid-template-columns:50px 80px 100px 1fr;gap:10px;font-size:11px"><b>${x[0]}</b><span>${x[1]}</span><span>${x[2]}</span><span>${x[3]}</span></div>`).join('')}</div></div>`}
function patientProgress(){return `${chart()}<div class="metricGrid" style="margin-top:14px"><div class="metricCard"><small>Adherence trend</small><strong>82%</strong><em>12 completed sessions</em></div><div class="metricCard"><small>Pain trend</small><strong>4 → 7</strong><em style="color:var(--red)">Worsening recently</em></div><div class="metricCard"><small>Difficulty</small><strong style="font-size:16px">Mostly just right</strong><em>1 exercise too easy</em></div><div class="metricCard"><small>Post-session response</small><strong style="font-size:16px">Mostly better</strong><em>Worse on last 2</em></div></div><div class="card" style="margin-top:14px"><div class="cardHeader"><h2>Barriers</h2></div><div class="missionList"><div class="missionItem"><div><b>No recurring barrier</b><p>Two missed sessions this month; one reported “didn’t have time.”</p></div><span class="badge green">Low</span></div></div></div>`}
function heps(){return savedHEPsPage(false)}
function savedHEPsPage(inBuilder=false){const tags=['All','Knee','Hip','Lumbar','Balance','Gait','Strength','Mobility','Post-op','Beginner'];const list=SAVED.filter(h=>(S.savedTag==='All'||(h.tags||[]).includes(S.savedTag))&&(!S.savedSearch||[h.name,h.desc,...(h.tags||[])].join(' ').toLowerCase().includes(S.savedSearch.toLowerCase())));return `${inBuilder?`<div class="builderTop day3"><div class="builderTitle"><div><h1>Saved HEPs</h1><p>Personal library · tagged and reusable</p></div></div><div class="builderActions"><button class="btn secondary small" onclick="builder()">Back to HEP Builder</button></div></div><div class="builderMain">`:pageTitle('Saved HEPs','Reusable programs you can assign, edit, duplicate, download or print.',`<button class="btn primary" onclick="builder()">${I(ICON.plus)} HEP Builder</button>`)}<div class="savedToolbar"><input placeholder="Search saved HEPs…" value="${S.savedSearch}" oninput="S.savedSearch=this.value;render()"><button class="btn secondary" onclick="builder('manual')">${I(ICON.plus)} New HEP</button></div><div class="filters">${tags.map(tag=>`<button class="filter ${S.savedTag===tag?'on':''}" onclick="S.savedTag='${tag}';render()">${tag==='All'?'All tags':tag}</button>`).join('')}</div><div class="savedGrid">${list.map(h=>savedCard(h)).join('')||`<div class="card" style="padding:20px">No saved HEPs match these filters.</div>`}</div>${inBuilder?'</div>':''}`}
function savedCard(h){return `<div class="savedCard"><div style="display:flex;justify-content:space-between;gap:10px"><span class="badge violet">${h.scope||'My HEP'}</span><button class="btn small ghost" onclick="suggestTags('${h.id}')">${I(ICON.ai)} Suggest tags with AI</button></div><h3>${templateName(h)}</h3><p>${h.desc}</p><div class="tagRow">${(h.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div><div style="font-size:11px;color:var(--muted)">Used ${h.used||0} times · Last used ${h.lastUsed||'—'}</div><div class="savedActions"><button class="btn small primary" onclick="assignSaved('${h.id}')">Assign HEP</button><button class="btn small secondary" onclick="openSaved('${h.id}')">Open & edit</button><button class="btn small ghost" onclick="duplicateSaved('${h.id}')">Duplicate</button><button class="btn small ghost" onclick="downloadSaved('${h.id}')">Download / Print</button></div></div>`}
function openSaved(id){const h=SAVED.find(x=>x.id===id);S.program=h.ids.map(id=>({...EX.find(e=>e.id===id)}));S.programName=h.name;S.builderMode='manual';S.builderTab='library';S.page='builder';persist();render();toast('Saved HEP opened')}
function duplicateSaved(id){const h=SAVED.find(x=>x.id===id);const copy={...h,id:'saved_'+Date.now(),name:h.name+' — Copy',used:0,lastUsed:'Not yet'};SAVED.unshift(copy);persist();render();toast('Saved HEP duplicated')}
function assignSaved(id){const h=SAVED.find(x=>x.id===id);S.program=h.ids.map(id=>({...EX.find(e=>e.id===id)}));S.programName=h.name;persist();assignChooser()}
function suggestTags(id){const h=SAVED.find(x=>x.id===id);showModal(`<div class="modalHead"><h2>${I(ICON.ai)} AI suggested tags</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px;color:var(--muted)">Based on the exercises and intended use of <b>${h.name}</b>:</p><div class="tagRow">${[...(h.tags||[]),'Home program'].slice(0,6).map(t=>`<span class="tag">${t}</span>`).join('')}</div><p style="font-size:11px;color:var(--muted)">AI only suggests organization metadata. You decide what is saved.</p><button class="btn primary" style="width:100%" onclick="closeModal();toast('Tags reviewed')">Done</button>`)}
function downloadSaved(id){const h=SAVED.find(x=>x.id===id);const exs=h.ids.map(id=>EX.find(e=>e.id===id)).filter(Boolean);const body=`<html><head><title>${h.name}</title><style>body{font-family:Arial;padding:32px;max-width:760px;margin:auto}li{margin:14px 0}</style></head><body><h1>${h.name}</h1><p>${h.desc}</p><ol>${exs.map(e=>`<li><b>${exText(e,'name')}</b> — ${e.dose}, ${clinicalTerm('freq',e.freq)}<br>${exText(e,'desc')}</li>`).join('')}</ol><p>HEPmate prototype handout</p></body></html>`;const blob=new Blob([body],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=h.name.replace(/[^a-z0-9]+/gi,'_')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Handout downloaded')}
function saveToLibraryModal(){if(!S.program.length)return;showModal(`<div class="modalHead"><h2>Save to Saved HEPs</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="field"><label>Program name</label><input id="saveName" value="${S.programName}"></div><div class="field"><label>Tags</label><input id="saveTags" value="Knee, Strength" placeholder="Knee, balance, gait…"></div><button class="btn secondary" style="width:100%;margin-bottom:8px" onclick="suggestSaveTags()">${I(ICON.ai)} Suggest tags with AI</button><button class="btn primary" style="width:100%" onclick="saveToLibrary()">Save for later</button>`)}
function suggestSaveTags(){const el=document.getElementById('saveTags');if(el)el.value='Knee, Strength, Function, Stairs';toast('AI suggested tags')}
function saveToLibrary(){const name=document.getElementById('saveName')?.value.trim()||'Untitled HEP';const tags=(document.getElementById('saveTags')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);SAVED.unshift({id:'saved_'+Date.now(),name,desc:`${S.program.length} exercises · reusable home program`,ids:S.program.map(e=>e.id),scope:'My HEP',tags,used:0,lastUsed:'Not yet'});S.programName=name;persist();closeModal();successCustom('HEP saved','This program is now in Saved HEPs and can be assigned, edited, duplicated, downloaded or printed later.')}
function programCards(){return savedHEPCards()}
function templateCards(){return savedHEPCards()}
function builderHub(){return `${pageTitle('HEP Builder','Build a program first. Choose the patient only when you are ready to assign it.')}<div class="hepHub"><button class="hubCard" onclick="builder('ai')"><div><div class="hubIcon">${I(ICON.ai)}</div><h2>AI HEP Builder</h2><p>Start with AI suggestions using optional clinical context. You still review, edit and approve every exercise.</p></div><span class="hubCTA">Start with AI ${I(ICON.arrow)}</span></button><button class="hubCard" onclick="builder('manual')"><div><div class="hubIcon">${I(ICON.exercise)}</div><h2>Manual HEP Builder</h2><p>Build exercise by exercise from the library with full control over selection, dosage and instructions.</p></div><span class="hubCTA">Build manually ${I(ICON.arrow)}</span></button><button class="hubCard" onclick="builder('saved')"><div><div class="hubIcon">${I(ICON.heps)}</div><h2>Saved HEPs</h2><p>Reuse a tagged program, edit it, assign it, or print it.</p></div><span class="hubCTA">Browse saved HEPs ${I(ICON.arrow)}</span></button></div>`}
function builderPage(){if(!S.builderMode)return builderHub();if(S.builderMode==='saved')return savedHEPsPage(true);return `<div class="builderTop day3"><div class="builderTitle"><div><input class="programNameInput" value="${S.programName}" oninput="S.programName=this.value;persist()"><p class="builderWorkspaceNote"><span class="badge">${S.assignPatient?S.assignPatient:'Not assigned'}</span> ${S.builderMode==='ai'?'AI HEP Builder':'Manual HEP Builder'} · Draft</p></div></div><div class="builderActions"><button class="btn secondary small" onclick="saveToLibraryModal()">Save to Saved HEPs</button><button class="btn primary small" ${!S.program.length?'disabled':''} onclick="assignChooser()">Assign HEP</button></div></div><div class="builderGrid"><section class="builderMain"><nav class="builderTabs">${[['ai','AI HEP Builder'],['manual','Manual HEP Builder'],['saved','Saved HEPs']].map(([id,l])=>`<button class="builderTab ${S.builderMode===id?'on':''}" onclick="S.builderMode='${id}';S.builderTab='${id==='manual'?'library':id}';render()">${l}</button>`).join('')}</nav>${S.builderMode==='ai'?aiBuilder():libraryBuilder()}</section><aside class="builderProgram"><div class="programHead"><div><h2>${tx('builder.program')} · ${S.program.length} Exercises</h2><span style="font-size:10px;color:var(--muted)">${tx('builder.drag')}</span></div><span class="badge green">Draft</span></div><div class="programScroll">${programItems()}</div><div class="programDetails"><b style="font-size:12px">${tx('builder.programDetails')}</b><div class="field"><label>${tx('builder.notes')}</label><textarea placeholder="Optional">Stop if symptoms significantly worsen and contact your clinician.</textarea></div><button class="btn small ghost" style="width:100%" onclick="S.view='patient';S.patientPage='today';render()">${I(ICON.eye)} ${tx('builder.previewPatient')}</button></div><div class="programBottom"><button class="btn secondary" ${!S.program.length?'disabled':''} onclick="reviewProgram()">Review program</button><button class="btn primary" style="margin-top:8px" ${!S.program.length?'disabled':''} onclick="assignChooser()">Assign HEP ${I(ICON.arrow)}</button><div class="autosaveText">${tx('builder.autosaved')}</div></div></aside></div><div class="mobileProgramBar" onclick="programDrawer()"><div><b>${tx('builder.program')} · ${S.program.length}</b><br><span>${S.program.length?S.program.map(x=>exText(x,'name')).slice(0,2).join(', '):'No exercises yet'}</span></div>${I(ICON.chevron)}</div>`}
function programItems(){if(!S.program.length)return `<div class="programEmpty">Add exercises from AI suggestions or Manual HEP Builder. You can save this program before assigning it to anyone.</div>`;return S.program.map((e,i)=>`<div class="programItem"><span class="dragHandle">⋮⋮</span><div class="exerciseThumb">${i+1}</div><div><b>${exText(e,'name')}</b><p>${e.dose} · ${clinicalTerm('freq',e.freq)}</p></div><button class="kebab" title="AI modification suggestion" onclick="suggestModification('${e.id}')">${I(ICON.ai)}</button><button class="kebab" onclick="removeExercise('${e.id}')">${I(ICON.close)}</button></div>`).join('')}
function aiBuilder(){return `<div class="sectionTitle"><h2>Optional clinical context</h2><span class="aiContext">${I(ICON.ai)} AI recommends · Clinician decides</span></div><div class="contextGrid"><div class="contextBox"><small>Condition / focus</small><b>Knee Osteoarthritis</b></div><div class="contextBox"><small>Primary goal</small><b>Stairs & walking tolerance</b></div><div class="contextBox"><small>Equipment</small><b>Chair, band</b></div><div class="contextBox"><small>Precautions</small><b>None entered</b></div></div><div class="aiPrompt"><h3>${tx('builder.focus')}</h3><textarea>Build a moderate knee OA home program focused on quad and hip strength, functional loading and stair tolerance.</textarea><div class="aiMeta"><p>AI suggests validated HEPmate exercise objects. Nothing is prescribed or assigned automatically.</p><button class="btn primary small" onclick="generateAI()">${I(ICON.ai)} ${tx('builder.generate')}</button></div></div>${S.generated?`<div class="suggestionList fadeIn"><div class="suggestionHeader"><div><h2>${tx('builder.suggested')} (6)</h2><span style="font-size:11px;color:var(--muted)">Edit or add manually at any time</span></div><button class="btn small ghost" onclick="S.builderMode='manual';S.builderTab='library';render()">+ Manual HEP Builder</button></div>${['e1','e2','e3','e4','e5','e7'].map(id=>exerciseSuggestion(id)).join('')}</div>`:`<div style="margin-top:16px;border:1px dashed #cbd8d0;border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:12px">Generate a draft, or switch to Manual HEP Builder without losing your current program.</div>`}`}
function exerciseSuggestion(id){const e=EX.find(x=>x.id===id),added=S.program.some(x=>x.id===id);return `<div class="exerciseSuggestion"><div class="exerciseThumb">MEDIA</div><div><b>${exText(e,'name')}</b><p>${exText(e,'desc')}</p></div><div class="dosePreview">${e.dose}<br>${clinicalTerm('freq',e.freq)}</div><button class="btn small ${added?'ghost':'secondary'}" ${added?'disabled':''} onclick="addExercise('${e.id}')">${added?'✓ Added':'Add'}</button></div>`}
function libraryBuilder(){let list=EX.filter(e=>(S.libraryFilter==='All'||e.region===S.libraryFilter)&&(!S.librarySearch||exerciseSearchText(e).includes(S.librarySearch.toLowerCase())));return `<div class="libraryToolbar"><input placeholder="${S.lang==='es'?'Buscar ejercicios…':S.lang==='ar'?'ابحث عن تمرين…':'Search exercises…'}" value="${S.librarySearch}" oninput="S.librarySearch=this.value;render()"><button class="btn secondary small" onclick="customExercise()">+ Custom exercise</button></div><div class="filters">${['All','Knee','Hip','Lumbar','Ankle','Thoracic'].map(f=>`<button class="filter ${S.libraryFilter===f?'on':''}" onclick="S.libraryFilter='${f}';render()">${clinicalTerm('region',f)}</button>`).join('')}<button class="filter">★ Favorites</button><button class="filter">Recently used</button></div><p style="font-size:9px;color:var(--muted)">${tx('builder.manualHint')}</p><div class="exerciseGrid">${list.map(e=>`<div class="exerciseCard" onclick="S.previewExercise='${e.id}'"><div class="exerciseCardTop"><div class="exerciseThumb">MEDIA</div><div><h3>${exText(e,'name')}</h3><p>${exText(e,'desc')}</p><span class="badge" style="margin-top:5px">${clinicalTerm('region',e.region)}</span></div></div><div class="exerciseCardFooter"><button class="btn small ghost" onclick="event.stopPropagation();previewExercise('${e.id}')">${tx('common.preview')}</button><button class="btn small primary" onclick="event.stopPropagation();addExercise('${e.id}')">+ Add</button></div></div>`).join('')}</div>`}
function customExercise(){showModal(`<div class="modalHead"><h2>New custom exercise</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="field"><label>Exercise name</label><input value="Supported Mini Squat"></div><div class="field"><label>Patient instructions</label><textarea>Stand at a counter for support. Bend your knees into a comfortable mini squat, then return to standing.</textarea></div><div class="row2"><div class="field"><label>Body region</label><select><option>Knee</option><option>Hip</option></select></div><div class="field"><label>Equipment</label><input value="Counter"></div></div><div class="field"><label>Media</label><button class="btn secondary" style="width:100%">Upload photo or video</button></div><button class="btn primary" style="width:100%" onclick="closeModal();toast('Custom exercise saved')">Save exercise</button>`)}
function previewExercise(id){const e=EX.find(x=>x.id===id);showModal(`<div class="modalHead"><h2>${exText(e,'name')}</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="previewMedia">EXERCISE MEDIA</div><p style="font-size:10px;color:var(--muted);line-height:1.55">${exText(e,'desc')}</p><div style="border-left:3px solid var(--green);background:var(--mint);padding:10px 12px;border-radius:7px;margin:10px 0;font-size:10px;line-height:1.55"><b>${S.lang==='es'?'Instrucciones para el paciente':S.lang==='ar'?'تعليمات المريض':'Patient instructions'}</b><br>${CLINICAL_LOCAL[S.lang]?.exercise?.[e.id]?.instruction||'Perform the movement slowly and within a comfortable range. Follow your clinician’s prescribed dosage.'}</div><div class="detailList"><div><span>Region</span><b>${clinicalTerm('region',e.region)}</b></div><div><span>Goal</span><b>${clinicalTerm('goal',e.goal)}</b></div><div><span>Equipment</span><b>${clinicalTerm('equip',e.equip)}</b></div><div><span>Default dosage</span><b>${e.dose}</b></div><div><span>Progression</span><b>View related exercises</b></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="addExercise('${e.id}');closeModal()">+ Add to program</button>`)}

function exercises(){const e=EX.find(x=>x.id===S.previewExercise)||EX[0];return `${pageTitle(tx('common.exercises'),'Browse HEPmate exercises, clinic content, favorites and custom exercises.',`<button class="btn secondary" onclick="customExercise()">+ Custom exercise</button><button class="btn primary" onclick="builder('manual')">${I(ICON.plus)} Add to HEP</button>`)}<div class="fullLibrary"><section>${libraryBuilder()}</section><aside class="previewPanel"><div class="previewMedia">EXERCISE MEDIA</div><div class="previewBody"><span class="badge green">HEPmate Library</span><h2>${e.name}</h2><p>${e.desc}. This preview stays visible while you browse on desktop.</p><div class="detailList"><div><span>Region</span><b>${e.region}</b></div><div><span>Goal</span><b>${e.goal}</b></div><div><span>Equipment</span><b>${e.equip}</b></div><div><span>Dosage</span><b>${e.dose}</b></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="addExercise('${e.id}')">+ Add to program</button></div></aside></div>`}
function messages(){const threads=[['Sarah Williams','Step-ups are bothering my knee','2m'],['Maya Patel','Can I do these before work?','1h'],['Robert Green','Thanks — feels easier now','Yesterday']];return `${pageTitle(tx('common.messages'),'Patient communication with original + translated text preserved.') }<div class="messagesGrid"><aside class="threads">${threads.map((x,i)=>`<button class="thread ${S.selectedThread===i?'on':''}" style="width:100%;border:0;text-align:left" onclick="S.selectedThread=${i};render()"><div class="avatar">${['SW','MP','RG'][i]}</div><div><b>${x[0]}</b><p>${x[1]}</p><span style="font-size:10px;color:var(--muted)">${x[2]}</span></div></button>`).join('')}</aside><section class="chat"><div class="chatHead"><div class="avatar">SW</div><div><b>Sarah Williams</b><div style="font-size:10px;color:var(--muted)">Preferred language: English</div></div><button class="btn small secondary" style="margin-left:auto" onclick="draftReply()">${I(ICON.ai)} Draft reply with AI</button></div><div class="chatBody"><div class="bubble">Hi Dr. Moustafa — the step-ups have been bothering the front of my knee the last two times.<div class="translationLine">Original · English</div></div><div class="bubble me">Thanks for letting me know. I’m going to review the exercise and your recent pain scores before we decide whether to modify it.</div><div class="bubble">Everything else feels okay.</div></div><div class="chatCompose"><input id="chatInput" placeholder="Write a message…"><button class="btn primary" onclick="sendMessage()">${I(ICON.message)} ${tx('common.send')}</button></div></section></div>`}
function draftReply(){const el=document.getElementById('chatInput');if(el){el.value='Thanks for telling me. I reviewed your recent responses and I want to adjust the step-up before you continue progressing it. If it causes a meaningful increase in symptoms, stop that exercise and message me.';toast('AI draft ready — review before sending')}}
function sendMessage(){const val=document.getElementById('chatInput')?.value?.trim();if(!val){toast('Write a message first','info');return}toast(tx('feedback.messageSent'));document.getElementById('chatInput').value=''}
function rtm(){return `${pageTitle(tx('common.rtm'),'RTM-ready monitoring workflow and documentation support. Eligibility remains payer/ruleset dependent.') }<div class="syntheticBar">Prototype only. HEPmate will surface potential eligibility/documentation readiness; it will not guarantee reimbursement.</div><div class="rtmGrid"><div class="rtmCard"><h3>Monitoring periods</h3><p>See device/activity days and identify patients who may need documentation review.</p><div style="margin:13px 0 6px;font-size:9px;display:flex;justify-content:space-between"><b>Sarah Williams</b><span>12 / 15 days</span></div><div class="progressBar"><span style="width:80%"></span></div>${[['Robert Green','18 / 30 device days','Potential 98977 window'],['Maya Patel','8 / 15 device days','Potential 98985 window'],['David Chen','21 / 30 device days','Review interaction time']].map(x=>`<div class="rtmPatient"><div><b>${x[0]}</b><p>${x[2]}</p></div><span class="badge green">${x[1]}</span></div>`).join('')}</div><div class="rtmCard"><h3>Interactive treatment time</h3><p>Track qualifying synchronous interaction separately from passive exercise logging.</p>${[['Sarah Williams','12 min','This period'],['Robert Green','24 min','This period'],['Maya Patel','8 min','This period']].map(x=>`<div class="rtmPatient"><div><b>${x[0]}</b><p>${x[2]}</p></div><span class="badge">${x[1]}</span></div>`).join('')}<button class="btn secondary" style="width:100%;margin-top:10px">Add interaction time</button></div><div class="rtmCard"><h3>Documentation readiness</h3><p>Structured evidence that can support clinician review and documentation.</p><div class="progressBar"><span style="width:72%"></span></div><p style="margin-top:8px">72% of active RTM patients have complete structured activity + interaction records in this demo.</p></div><div class="rtmCard"><h3>Ruleset</h3><p>Effective date: 2026 · Musculoskeletal RTM<br>Rules remain configurable by payer and effective date.</p><button class="btn ghost small">View rules</button></div></div>`}
function clinicPage(){return `${pageTitle(tx('common.clinic'),'Manage locations, team members, branding and shared templates.') }<div class="programGrid"><div class="programCard"><span class="badge green">Workspace</span><h3>Main Street Rehab</h3><p>1 location · 6 clinicians · 42 active patients</p><div class="programFooterRow"><button class="btn small ghost">Manage</button></div></div><div class="programCard"><span class="badge">Branding</span><h3>Patient-facing identity</h3><p>Logo, contact information, HEP PDF footer and invite settings.</p><div class="programFooterRow"><button class="btn small ghost">Edit</button></div></div><div class="programCard"><span class="badge violet">Shared content</span><h3>Clinic Templates</h3><p>12 shared HEP templates · 18 custom exercises</p><div class="programFooterRow"><button class="btn small ghost">Open</button></div></div></div>`}
function settingsPage(){return `${pageTitle(tx('common.settings'),'Personal preferences, language, notifications and account controls.') }<div style="max-width:620px"><div class="card" style="padding:16px"><div class="field"><label>${tx('common.language')}</label><select onchange="setLang(this.value)"><option value="en" ${S.lang==='en'?'selected':''}>English</option><option value="es" ${S.lang==='es'?'selected':''}>Español</option><option value="ar" ${S.lang==='ar'?'selected':''}>العربية</option></select></div><div class="field"><label>Default patient reminder time</label><input type="time" value="18:00"></div><div class="field"><label>Notifications</label><select><option>Important clinical signals + messages</option><option>All activity</option><option>Minimal</option></select></div><button class="btn primary" onclick="toast('Settings saved')">${tx('common.save')}</button></div></div>`}
function appContent(){switch(S.page){case'home':return dashboard();case'patients':return patients();case'patient':return patient();case'heps':return savedHEPsPage(false);case'saved':return savedHEPsPage(false);case'builder':return builderPage();case'exercises':return exercises();case'messages':return messages();case'rtm':return rtm();case'clinic':return clinicPage();case'settings':return settingsPage();default:return dashboard()}}
function app(){return shell(appContent())}
function patientApp(){return `<div class="patientApp"><header class="patientTop"><span class="wordmark">HEP<span>mate</span></span><div style="display:flex;gap:7px"><select class="btn secondary small" onchange="setLang(this.value)"><option value="en" ${S.lang==='en'?'selected':''}>EN</option><option value="es" ${S.lang==='es'?'selected':''}>ES</option><option value="ar" ${S.lang==='ar'?'selected':''}>AR</option></select><button class="userButton" onclick="S.view='app';S.page='home';render()"><div class="avatar">SW</div></button></div></header><main class="patientMain">${S.patientPage==='today'?patientToday():S.patientPage==='progress'?patientMobileProgress():S.patientPage==='messages'?patientMobileMessages():patientMore()}</main><nav class="patientBottomNav">${[['today',tx('common.today'),ICON.home],['progress',tx('common.progress'),ICON.outcome],['messages',tx('common.messages'),ICON.message],['more',tx('common.more'),ICON.more]].map(([p,l,ic])=>`<button class="${S.patientPage===p?'on':''}" onclick="S.patientPage='${p}';render()">${I(ic)}<span>${l}</span></button>`).join('')}</nav></div>`}
function patientToday(){const items=['e1','e3','e4'];return `<div class="todayHero"><small>Good afternoon, Sarah</small><h1>${tx('patientApp.today')}</h1><p>${tx('patientApp.sub')}</p><div class="todayProgress"><span style="width:${Object.keys(S.patientCompleted).length/items.length*100}%"></span></div></div>${items.map((id,i)=>{const e=EX.find(x=>x.id===id),done=S.patientCompleted[id];return `<div class="patientExercise"><div class="patientExerciseMedia">EXERCISE VIDEO</div><div class="patientExerciseBody"><span class="badge">${i+1} of ${items.length}</span><h3>${exText(e,'name')}</h3><p>${e.dose} · ${clinicalTerm('freq',e.freq)}<br>${exText(e,'desc')}</p><div style="font-size:11px;font-weight:800;margin:10px 0 6px">How did this feel?</div><div class="ratingRow"><button class="ratingBtn">Too easy</button><button class="ratingBtn on">Just right</button><button class="ratingBtn">Too difficult</button></div><div class="painLine"><span>Pain</span><input type="range" min="0" max="10" value="${S.sessionPain}" oninput="S.sessionPain=this.value;this.nextElementSibling.textContent=this.value+'/10'"><b>${S.sessionPain}/10</b></div>${id==='e3'?`<div style="font-size:11px;font-weight:800;margin:12px 0 6px">How confident are you that you are doing this correctly?</div><div class="responseRow">${['Confident','Somewhat unsure','Not sure'].map(x=>`<button class="responseBtn ${S.confidence===x?'on':''}" onclick="S.confidence='${x}';render()">${x}</button>`).join('')}</div>`:''}<button class="btn ${done?'secondary':'primary'}" style="width:100%;margin-top:12px" onclick="completePatientExercise('${id}')">${done?'✓ '+tx('common.done'):tx('patientApp.complete')}</button></div></div>`}).join('')}<div class="patientProgressCard"><h2>After your program, how do you feel?</h2><div class="responseRow">${['Better','About the same','Worse'].map(x=>`<button class="responseBtn ${S.sessionResponse===x?'on':''}" onclick="S.sessionResponse='${x}';render()">${x}</button>`).join('')}</div></div><button class="btn dark" style="width:100%;margin-top:14px" onclick="finishPatientSession()">${tx('patientApp.finish')}</button>`}
function completePatientExercise(id){S.patientCompleted[id]=true;toast(tx('patientApp.complete'));render()}
function finishPatientSession(){const total=3,done=Object.keys(S.patientCompleted).length;if(done<total){barrierModal();return}successCustom('Session complete',`Your session was saved. Pain: ${S.sessionPain}/10 · Difficulty: just right · Response: ${S.sessionResponse}. Your clinician can review these trends.` ,`<button class="btn primary" onclick="closeModal();S.patientPage='progress';render()">View progress</button>`)}
function barrierModal(){showModal(`<div class="modalHead"><h2>What got in the way today?</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px;color:var(--muted)">One tap helps your clinician understand why the program was not completed.</p><div class="responseRow">${['Pain / soreness','Didn’t have time','Forgot','Wasn’t sure how','Didn’t feel safe','No equipment','Didn’t think I needed to','Other'].map(x=>`<button class="responseBtn" onclick="saveBarrier('${x.replace("'","\\'")}')">${x}</button>`).join('')}</div><button class="btn ghost" style="width:100%;margin-top:12px" onclick="closeModal()">Skip</button>`)}
function saveBarrier(v){S.barrier=v;closeModal();toast('Barrier saved');successCustom('Session saved',`Your clinician can see that ${v.toLowerCase()} got in the way today, along with your pain and exercise responses.`)}
function patientMobileProgress(){return `<div class="patientProgressCard"><h2>${tx('patientApp.progress')}</h2><div class="metricGrid"><div class="metricCard"><small>Adherence</small><strong>82%</strong></div><div class="metricCard"><small>Pain trend</small><strong>4 → 7</strong></div><div class="metricCard"><small>Difficulty</small><strong style="font-size:15px">Mostly just right</strong></div><div class="metricCard"><small>Session response</small><strong style="font-size:15px">Mostly better</strong></div></div></div><div class="patientProgressCard"><h2>Barriers</h2><div class="missionItem"><div><b>Pain / soreness</b><p>Reported once this month</p></div><span class="badge amber">1</span></div></div><div class="patientProgressCard"><h2>Last 4 weeks</h2>${chart()}</div>`}
function patientMobileMessages(){return `<div class="patientProgressCard"><h2>${tx('patientApp.messages')}</h2><div class="bubble">Your clinician updated your HEP on Aug 28.</div><div class="bubble me">Thanks — the new program is clear.</div><div class="chatCompose" style="padding:10px 0 0;border:0"><input placeholder="Message your clinician…"><button class="btn primary">${I(ICON.message)}</button></div></div>`}
function patientMore(){return `<div class="patientProgressCard"><h2>${tx('patientApp.more')}</h2><button class="btn secondary" style="width:100%;justify-content:flex-start">${I(ICON.globe)} ${tx('common.language')}</button><button class="btn secondary" style="width:100%;justify-content:flex-start;margin-top:8px">Education & resources</button><button class="btn secondary" style="width:100%;justify-content:flex-start;margin-top:8px" onclick="S.view='app';S.page='home';render()">Exit patient preview</button></div>`}
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';const r=document.getElementById('root');r.innerHTML=S.view==='marketing'?marketing():S.view==='auth'?auth():S.view==='patient'?patientApp():app();localizeDOM(r);if(S.searchOpen)setTimeout(()=>{renderSearchResults('');localizeDOM(document.getElementById('searchResults'))},0)}
render();
</script>
</body>
</html>
