   e3:{name:'Subir al escalón',desc:'Fortalecimiento funcional para subir escaleras.',instruction:'Coloque un pie sobre un escalón estable. Suba el cuerpo de forma controlada y vuelva a bajar manteniendo la rodilla alineada.'},
   e4:{name:'Abducción de cadera de pie',desc:'Fortalecimiento de los músculos abductores de la cadera.',instruction:'De pie con apoyo si lo necesita, lleve la pierna hacia un lado sin inclinar el tronco y vuelva lentamente.'},
   e5:{name:'Extensión de rodilla sentado',desc:'Fortalecimiento del cuádriceps en posición sentada.',instruction:'Siéntese con la espalda apoyada. Estire la rodilla hasta enderezarla cómodamente y baje lentamente.'},
   e6:{name:'Deslizamiento de talón',desc:'Movilidad de flexión de rodilla.',instruction:'Acostado boca arriba, deslice el talón hacia los glúteos para doblar la rodilla y después vuelva a estirarla.'},
   e7:{name:'Elevación de talones',desc:'Fortalecimiento de pantorrilla y tolerancia a la carga.',instruction:'Con apoyo en una superficie estable, elévese sobre las puntas de los pies y baje lentamente.'},
   e8:{name:'Ejercicio de almeja',desc:'Fortalecimiento de rotadores externos y abductores de cadera.',instruction:'Acuéstese de lado con las rodillas flexionadas. Mantenga los pies juntos y abra la rodilla superior sin girar la pelvis.'},
   e9:{name:'Contracción isométrica de cuádriceps',desc:'Activación suave del cuádriceps.',instruction:'Con la pierna estirada, contraiga el muslo intentando llevar la parte posterior de la rodilla hacia la superficie.'},
   e10:{name:'Marcha acostado boca arriba',desc:'Control del tronco y coordinación.',instruction:'Acostado boca arriba con las rodillas flexionadas, eleve un pie y luego el otro manteniendo el tronco estable.'},
   e11:{name:'Libro abierto',desc:'Movilidad de rotación torácica.',instruction:'Acuéstese de lado con las rodillas flexionadas. Abra el brazo superior hacia el otro lado siguiendo la mano con la mirada.'},
   e12:{name:'Extensión alterna en cuadrupedia',desc:'Control del tronco y la cadera en cuadrupedia.',instruction:'En cuatro apoyos, extienda un brazo y la pierna contraria sin dejar que el tronco gire.'},
   e13:{name:'Retracción escapular',desc:'Activación y control de los músculos escapulares.',instruction:'Siéntese o póngase de pie erguido. Lleve suavemente los omóplatos hacia atrás y abajo sin elevar los hombros.'},
   e14:{name:'Rotación externa de hombro con banda',desc:'Fortalecimiento del manguito rotador con banda elástica.',instruction:'Mantenga el codo pegado al costado y gire el antebrazo hacia afuera contra la banda sin mover el tronco.'},
   e15:{name:'Equilibrio en tándem',desc:'Entrenamiento de equilibrio con base de apoyo reducida.',instruction:'Coloque un pie directamente delante del otro cerca de un apoyo estable y mantenga la posición con seguridad.'},

function localizeDOM(root){
 if(S.lang==='en'||!root)return;
 const map={...(DOM_LOCAL[S.lang]||{}),...(DAY3_LOCAL[S.lang]||{})};
 const keys=Object.keys(map).sort((a,b)=>b.length-a.length);
 const esc=k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const re=new RegExp(keys.map(esc).join('|'),'g');
 const translate=s=>(s||'').replace(re,m=>map[m]??m);
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 let n;while(n=walker.nextNode())n.nodeValue=translate(n.nodeValue);
 root.querySelectorAll('[placeholder]').forEach(el=>el.setAttribute('placeholder',translate(el.getAttribute('placeholder')||'')));
}

function contextInsight(){const t=[S.aiContext.condition,S.aiContext.goals,S.aiContext.equipment,S.aiContext.precautions,S.aiContext.focus].join(' ').toLowerCase(),out=[];if(/kettlebell|kettle bell/.test(t))out.push('Kettlebell recognized');if(/dumbbell|free weight/.test(t))out.push('Free weights recognized');if(/ankle weight/.test(t))out.push('Ankle weights recognized');if(/stairs|stair|step/.test(t))out.push('Stair-loading goal');if(/balance|fall/.test(t))out.push('Balance / fall-prevention context');if(/gait|walk/.test(t))out.push('Walking / gait goal');if(/quad|knee/.test(t))out.push('Knee / quadriceps focus');if(/shoulder|rotator|cuff/.test(t))out.push('Shoulder focus');if(/weight.?bearing|non.?weight|nwb|ttwb|pwb/.test(t))out.push('Weight-bearing precaution recognized');return out.slice(0,5)}
function aiSuggestionScore(e){const c=(S.aiContext.condition||'').toLowerCase(),g=(S.aiContext.goals||'').toLowerCase(),q=(S.aiContext.equipment||'').toLowerCase(),f=(S.aiContext.focus||'').toLowerCase(),prec=(S.aiContext.precautions||'').toLowerCase(),diff=(S.aiContext.difficulty||'').toLowerCase(),pain=S.aiContext.pain===''||S.aiContext.pain==null?null:Number(S.aiContext.pain);let score=0;
// Condition fit
if(/knee|oa|osteoarthritis|tka|acl|patell/.test(c)){if(e.region==='Knee')score+=7;if(e.region==='Hip'||e.region==='Ankle')score+=2;if(['e1','e3','e5','e9','e17'].includes(e.id))score+=2}
if(/hip|glute/.test(c)&&e.region==='Hip')score+=7;
if(/back|lumbar|stenosis|sciatica/.test(c)&&e.region==='Lumbar')score+=8;
if(/shoulder|rotator|cuff/.test(c)&&e.region==='Shoulder')score+=9;
if(/balance|fall/.test(c)&&(e.region==='Balance'||e.goal==='Balance'||e.goal==='Gait'))score+=8;
// Goal + focus fit
const gf=g+' '+f;if(/stair|step/.test(gf)){if(e.id==='e3')score+=10;if(['e1','e7','e17'].includes(e.id))score+=4}
if(/walk|gait|ambulat/.test(gf)){if(e.goal==='Gait')score+=9;if(['e7','e15','e16','e19','e20'].includes(e.id))score+=3}
if(/balance|fall/.test(gf)&&(e.goal==='Balance'||e.region==='Balance'||e.goal==='Gait'))score+=9;
if(/strength|strong/.test(gf)&&e.goal==='Strength')score+=5;
if(/mobility|range|rom|flexib/.test(gf)&&e.goal==='Mobility')score+=6;
if(/transfer|sit.?to.?stand|chair/.test(gf)&&e.id==='e1')score+=9;
if(/quad/.test(f)&&['e1','e3','e5','e9','e17'].includes(e.id))score+=8;
if(/hip|glute/.test(f)&&e.region==='Hip')score+=6;
// Equipment fit. Free text can still map to known equipment concepts.
if(/kettlebell|kettle bell/.test(q+' '+f)){if(e.equip==='Kettlebell')score+=14;else if(e.equip!=='None')score-=1}else if(e.equip==='Kettlebell')score-=7;
if(/band|theraband|resistance/.test(q)&&e.equip==='Band')score+=6;
if(/chair/.test(q)&&e.equip==='Chair')score+=5;
if(/counter|support/.test(q)&&e.equip==='Counter')score+=4;
if(/step|stair/.test(q)&&e.equip==='Step')score+=5;
if(/none|no equipment/.test(q)&&e.equip!=='None')score-=5;
// Pain + difficulty tune load, not diagnosis.
if(pain!==null&&pain>=7){if(e.goal==='Activation'||e.goal==='Mobility')score+=5;if(['e3','e17','e18','e20'].includes(e.id))score-=6}else if(pain!==null&&pain<=3&&e.goal==='Strength')score+=2;
if(/too difficult/.test(diff)){if(e.goal==='Activation'||e.goal==='Mobility')score+=4;if(['e17','e18'].includes(e.id))score-=4}
if(/too easy/.test(diff)){if(e.goal==='Strength')score+=4;if(['e17','e18'].includes(e.id))score+=3}
// Precaution fit can override otherwise attractive suggestions.
if(/weight.?bearing|nwb|ttwb|pwb/.test(prec)&&['e1','e3','e7','e15','e17','e18','e19','e20'].includes(e.id))score-=20;
if(/fall risk/.test(prec)){if(['e15','e16','e19'].includes(e.id))score+=4;if(e.id==='e20')score-=5}
if(/post.?op/.test(prec)){if(e.goal==='Activation'||e.goal==='Mobility')score+=3;if(e.id==='e18')score-=7}
if(/avoid high impact/.test(prec)&&['e17'].includes(e.id))score-=2;
return score}
function aiSuggestionIds(){return EX.map(e=>({id:e.id,score:aiSuggestionScore(e)})).sort((a,b)=>b.score-a.score).slice(0,6).map(x=>x.id)}
function aiReasonFor(e){const reasons=[],goal=(S.aiContext.goals+' '+S.aiContext.focus).toLowerCase(),cond=(S.aiContext.condition||'').toLowerCase(),equip=(S.aiContext.equipment||'').toLowerCase(),prec=(S.aiContext.precautions||'').toLowerCase(),pain=S.aiContext.pain===''||S.aiContext.pain==null?null:Number(S.aiContext.pain);if((/knee/.test(cond)&&e.region==='Knee')||(/hip/.test(cond)&&e.region==='Hip')||(/lumbar|back/.test(cond)&&e.region==='Lumbar')||(/shoulder/.test(cond)&&e.region==='Shoulder'))reasons.push('condition match');if(/stair|step/.test(goal)&&['e1','e3','e7','e17'].includes(e.id))reasons.push('stair goal');if(/walk|gait/.test(goal)&&e.goal==='Gait')reasons.push('walking/gait goal');if(/strength/.test(goal)&&e.goal==='Strength')reasons.push('strength focus');if(/kettlebell/.test(equip)&&e.equip==='Kettlebell')reasons.push('uses available kettlebell');if(e.equip!=='None'&&equip.includes((e.equip||'').toLowerCase()))reasons.push('uses available '+e.equip.toLowerCase());if(pain!==null&&pain>=7&&(e.goal==='Activation'||e.goal==='Mobility'))reasons.push('lower-load fit for current pain');if(/fall risk/.test(prec)&&['e15','e16','e19'].includes(e.id))reasons.push('supported option for fall-risk context');return reasons.slice(0,3).join(' · ')||'ranked from the entered condition, goals, equipment, pain and focus'}

div><button class="btn primary" style="width:100%" onclick="assignExisting()">Assign to patient</button></div><div id="newAssign" class="hidden"><div class="row2"><div class="field"><label>First name</label><input id="newFirst" value="Maria"></div><div class="field"><label>Last name</label><input id="newLast" value="Lopez"></div></div><div class="row2"><div class="field"><label>Email <span class="optionalLabel">optional if mobile entered</span></label><input id="newEmail" type="email" value="maria@example.com"></div><div class="field"><label>Mobile <span class="optionalLabel">optional if email entered</span></label><input id="newMobile" type="tel" placeholder="+1 917 555 0123"></div></div><div class="fieldHint">At least one contact method is required. If both are entered, invitation and HEP delivery links go to both.</div><div class="row2"><div class="field"><label>Preferred language</label><select id="newLang"><option selected>English</option><option>Español</option><option>العربية</option></select></div><div class="field"><label>Condition <span class="optionalLabel">optional</span></label><input id="newCondition" placeholder="e.g., Knee pain"></div></div><div class="field"><label>Goals <span class="optionalLabel">optional</span></label><input id="newGoals" placeholder="e.g., Walk longer, stairs, return to work"></div><div class="deliveryNote">Email/SMS deliver the invitation and HEP link. App push reminders are enabled only after activation and permission.</div><button class="btn primary" style="width:100%" onclick="assignNew()">Send invitation + HEP</button></div>`)}
function assignExisting(){const raw=document.getElementById('assignPatientSelect')?.value||PATIENTS[0]?.name||'',name=raw.split(' · ')[0],p=patientByName(name),wasUpdate=!!((p.assignedExerciseIds||[]).length||/HEP v\d+/i.test(p.hep||'')),reason=document.getElementById('updateReason')?.value||document.getElementById('existingReason')?.value||'';S.assignPatient=name;S.selectedPatient=name;p.hep=nextHEPVersion(p);p.programName=S.programName;p.assignedExerciseIds=S.program.map(e=>e.id);p.lastAssigned='Just now';p.last='Today';p.status=wasUpdate?'HEP updated':'HEP assigned';p.statusType='green';p.assignmentReason=reason||(wasUpdate?'Program update':'New assignment');p.pending=false;p.assignmentEvents=p.assignmentEvents||[];p.assignmentEvents.unshift({when:'Just now',title:`${p.hep} ${wasUpdate?'published':'assigned'}`,detail:`${S.programName} · ${p.assignmentReason}`});const channels=deliveryChannels(p);p.lastDelivery=channels.length?`HEP notice sent to ${channels.join(' and ')}`:'Assigned in HEPmate only — no email/mobile on file';persist();closeModal();const delivered=channels.length?`A copy/link notice was sent to ${channels.join(' and ')}.`:'No email/mobile channel is on file, so the HEP was assigned in HEPmate only.';S.signalAction=`${p.hep} ${wasUpdate?'published':'assigned'} · ${p.assignmentReason} · ${S.programName}`;successCustom(wasUpdate?'HEP updated':'HEP assigned',`${S.programName} is now ${name}'s active ${p.hep}. The patient chart and HEP tab were updated immediately. ${delivered}`,`<button class="btn primary" onclick="closeModal();openPatient('${name.replace("'","\'")}')">View patient chart</button>`)}
function assignNew(){const first=document.getElementById('newFirst')?.value.trim()||'',last=document.getElementById('newLast')?.value.trim()||'',email=document.getElementById('newEmail')?.value.trim()||'',mobile=document.getElementById('newMobile')?.value.trim()||'',lang=document.getElementById('newLang')?.value||'English',condition=document.getElementById('newCondition')?.value.trim()||'',goals=document.getElementById('newGoals')?.value.trim()||'';if(!first){toast('First name is required','info');return}if(!email&&!mobile){toast('Enter an email, a mobile number, or both','info');return}const name=(first+' '+last).trim(),p=addOrUpdatePatient({name,initial:initials(first,last),condition:condition||'Not entered',goals:goals||'Not entered',email,mobile,preferredLanguage:lang||'English',hep:'Pending activation',programName:S.programName,assignedExerciseIds:S.program.map(e=>e.id),adherence:'—',status:'Invitation + HEP sent',statusType:'violet',last:'Invited just now',pending:true,reminderChannels:[...(email?['email']:[]),...(mobile?['sms']:[])],pushEligible:false,pushEnabled:false,lastDelivery:''});const channels=deliveryChannels(p);p.lastDelivery=`Invitation + HEP sent to ${channels.join(' and ')}`;p.assignmentEvents=[{when:'Just now',title:'HEP queued with invitation',detail:`${S.programName} · ${channels.join(' and ')}`}];persist();S.assignPatient=name;S.selectedPatient=name;closeModal();successCustom('Invitation + HEP sent',`${name}'s invitation and HEP link were sent to ${channels.join(' and ')}. ${channels.length===2?'Both email and mobile will receive delivery copies. ':''}The HEP is already queued in the patient record. After activation, app push reminders can be enabled separately.`,`<button class="btn primary" onclick="closeModal();openPatient('${name.replace("'","\'")}')">View patient record</button>`) }
function invitePatient(){showModal(`<div class="modalHead"><h2>${tx('common.invite')}</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px;color:var(--muted)">Quick Patient Setup — only one contact method is required. The patient can complete the rest after activation.</p><div class="row2"><div class="field"><label>First name</label><input id="inviteFirst" value="Maria"></div><div class="field"><label>Last name</label><input id="inviteLast" value="Lopez"></div></div><div class="row2"><div class="field"><label>Email <span class="optionalLabel">optional if mobile entered</span></label><input id="inviteEmail" type="email" value="maria@example.com" placeholder="patient@example.com"></div><div class="field"><label>Mobile <span class="optionalLabel">optional if email entered</span></label><input id="inviteMobile" type="tel" placeholder="+1 917 555 0123"></div></div><div class="fieldHint"><b>At least one is required.</b> If both are entered, invitations and HEP links are delivered to both. Reminders can use email and/or SMS; app push becomes available only after activation and permission.</div><div class="row2"><div class="field"><label>Preferred language</label><select id="inviteLang"><option selected>English</option><option>Español</option><option>العربية</option></select><div class="fieldHint">English is the default unless changed.</div></div><div class="field"><label>Condition <span class="optionalLabel">optional</span></label><input id="inviteCondition" placeholder="e.g., Knee pain"></div></div><div class="field"><label>Goals <span class="optionalLabel">optional</span></label><input id="inviteGoals" placeholder="e.g., Walk longer, stairs, return to work"></div><div class="deliveryNote">Condition and goals stay attached to the patient record and appear in the Patients list after activation.</div><button class="btn primary" style="width:100%" onclick="sendPatientInvite()">Send invitation</button>`)}
function sendPatientInvite(){const first=document.getElementById('inviteFirst')?.value.trim()||'',last=document.getElementById('inviteLast')?.value.trim()||'',email=document.getElementById('inviteEmail')?.value.trim()||'',mobile=document.getElementById('inviteMobile')?.value.trim()||'',lang=document.getElementById('inviteLang')?.value||'English',condition=document.getElementById('inviteCondition')?.value.trim()||'',goals=document.getElementById('inviteGoals')?.value.trim()||'';if(!first){toast('First name is required','info');return}if(!email&&!mobile){toast('Enter an email, a mobile number, or both','info');return}const name=(first+' '+last).trim(),p=addOrUpdatePatient({name,initial:initials(first,last),condition:condition||'Not entered',goals:goals||'Not entered',email,mobile,preferredLanguage:lang||'English',hep:'No HEP assigned',assignedExerciseIds:[],adherence:'—',status:'Invitation sent',statusType:'violet',last:'Invited just now',pending:true,reminderChannels:[...(email?['email']:[]),...(mobile?['sms']:[])],pushEligible:false,pushEnabled:false});S.selectedPatient=name;closeModal();const channels=deliveryChannels(p);successCustom('Invitation sent',`${name}'s invitation was sent to ${channels.join(' and ')}. ${channels.length===2?'Both email and mobile are saved as delivery channels. ':''}Condition and goals are optional and will remain on the patient record when activated.`,`<button class="btn primary" onclick="closeModal();nav('patients')">View patients</button>`) }

function explainHEPChange(){showModal(`<div class="modalHead"><h2>${I(ICON.ai)} What changed in HEP v2</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px">Compared with v1, Step-Up was added and standing hip abduction volume increased. The clinician recorded “progression” as the reason. Since that change, adherence stayed high while pain rose over the last two sessions.</p><div class="aiContext">${I(ICON.ai)} Summary only · no automatic changes</div>`)}
function patient(){const p=patientByName(S.selectedPatient);return `<div class="patientHero"><div class="patientHeroLeft"><div class="avatar">${p.initial}</div><div><h1>${p.name}</h1><p>${p.condition||'Condition not entered'} · ${p.hep||'No HEP assigned'} · Assigned clinician: Dr. Moustafa</p><div class="patientContact">Goal: ${p.goals||'Not entered'}${p.email?' · '+p.email:''}${p.mobile?' · '+p.mobile:''}${p.lastDelivery?' · '+p.lastDelivery:''}</div></div></div><div class="pageActions"><button class="btn secondary" onclick="showPatientAISummary()">${I(ICON.ai)} AI summary</button><button class="btn secondary" onclick="builderForPatient('${p.name.replace("'","\'")}','manual')">${I(ICON.edit)} ${p.assignedExerciseIds?.length?'Edit HEP':'Create HEP'}</button><button class="btn primary" onclick="nav('messages')">${I(ICON.message)} Message</button></div></div>${p.pending?`<div class="assignmentBanner"><b>Invitation pending activation.</b> ${p.programName?`A HEP is queued: ${p.programName}. `:''}Delivery channels: ${deliveryChannels(p).join(' and ')||'none on file'}.</div>`:''}<nav class="tabs">${[['overview',tx('common.overview')],['hep',tx('patient.hep')],['progress',tx('patient.progress')],['messages',tx('patient.messages')]].map(([id,l])=>`<button class="tab ${S.patientTab===id?'on':''}" onclick="S.patientTab='${id}';render()">${l}</button>`).join('')}</nav>${S.patientTab==='overview'?patientOverview():S.patientTab==='hep'?patientHEP():S.patientTab==='progress'?patientProgress():`<div class="card" style="padding:20px">Open the Messages workspace to continue the conversation.</div>`}`}

function patientOverview(){const p=patientByName(S.selectedPatient);if(p.name!=='Sarah Williams'){return `<div class="patientDetailGrid"><section><div class="card" style="padding:18px"><div class="cardHeader" style="padding:0 0 14px;border:0"><h2>${p.pending?'Patient invited':'Between-visit status'}</h2><span class="badge ${p.pending?'violet':'green'}">${p.status||'Active'}</span></div><div class="missionList"><div class="missionItem"><div><b>Condition</b><p>${p.condition||'Not entered'}</p></div></div><div class="missionItem"><div><b>Goal</b><p>${p.goals||'Not entered'}</p></div></div><div class="missionItem"><div><b>HEP</b><p>${p.programName||p.hep||'No HEP assigned'}</p></div></div><div class="missionItem"><div><b>Delivery & reminders</b><p>${deliveryChannels(p).join(' and ')||'No email/mobile channel on file'}${p.pending?' · Push available after activation':' · Email/SMS reminders use channels on file; app push requires permission'}</p></div></div></div>${p.pending?`<button class="btn secondary" style="margin-top:14px" onclick="activatePatient('${p.name.replace("'","\'")}')">Simulate patient activation</button>`:''}</div></section><aside><div class="memoryCard"><div class="cardHeader"><h2>Rehabilitation Memory</h2></div><div class="memoryList">${assignmentMemory(p)}<div class="memoryEvent"><span class="memoryDot"></span><div><b>${p.pending?'Invitation sent':'Patient active'}</b><p>${p.programName?'Program: '+p.programName+'. ':''}${deliveryChannels(p).length?'Delivery channel(s): '+deliveryChannels(p).join(' and ')+'.':''}</p><time>Just now</time></div></div></div></div></aside></div>`}const action=S.signalAction?`<div class="memoryEvent"><span class="memoryDot"></span><div><b>Clinician action</b><p>${S.signalAction}</p><time>Just now</time></div></div>`:'';return `<div class="patientDetailGrid"><section><div class="signalCard"><div><b>${tx('patient.needs')}</b><p>Pain increased from 4 → 7 across two sessions after Step-Up was introduced. Difficulty remained “just right,” and the last two session responses were “worse.”</p><div class="signalActions"><button class="btn small secondary" onclick="explainSignalAI()">${I(ICON.ai)} Explain signal</button><button class="btn small primary" onclick="openSignalReview()">Review</button></div></div><span class="badge red">High priority</span></div><div class="metricGrid"><div class="metricCard"><small>Adherence</small><strong>82%</strong><em>+6% vs prior week</em></div><div class="metricCard"><small>Current pain</small><strong>7/10</strong><em style="color:var(--red)">↑ 3 points</em></div><div class="metricCard"><small>Difficulty</small><strong style="font-size:16px">Just right</strong><em>Most sessions</em></div><div class="metricCard"><small>Post-session response</small><strong style="font-size:16px;color:var(--red)">Worse 2×</strong><em>Last 2 sessions</em></div></div>${chart()}<div class="card" style="margin-top:14px"><div class="cardHeader"><h2>Exercise response</h2><a>View all</a></div><div style="padding:0 14px">${[['Step-Up','Pain 7/10','Just right','Worse','Review'],['Sit-to-Stand','Pain 4/10','Just right','Same','Stable'],['Hip Abduction','Pain 3/10','Too easy','Better','Progress']].map(x=>`<div style="display:grid;grid-template-columns:1fr auto auto auto auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);font-size:11px;align-items:center"><b>${x[0]}</b><span>${x[1]}</span><span>${x[2]}</span><span>${x[3]}</span><span class="badge ${x[4]==='Review'?'red':'green'}">${x[4]}</span></div>`).join('')}</div></div></section><aside><div class="memoryCard"><div class="cardHeader"><h2>Rehabilitation Memory</h2><a>${tx('common.viewAll')}</a></div><div class="memoryList">${assignmentMemory(p)}${action}${[['Today','Attention signal created','Pain 7/10 for second consecutive session; response worse after program.'],['Aug 31','Barrier check','No barrier reported; adherence remained high.'],['Aug 28','HEP v2 published','Step-Up added. Clinician reason: progression.'],['Aug 25','Patient check-in','Pain 4/10 · difficulty just right · response same.'],['Aug 12','Initial HEP assigned','4 exercises assigned.']].map(x=>`<div class="memoryEvent"><span class="memoryDot"></span><div><b>${x[1]}</b><p>${x[2]}</p><time>${x[0]}</time></div></div>`).join('')}</div></div></aside></div>`}

function chart(){return `<div class="chartCard"><div class="chartTop"><h3>Pain trend + HEP changes</h3><div class="chartLegend"><span style="color:var(--red)">● Pain</span><span>┆ HEP change</span></div></div><div class="chartCanvas"><svg viewBox="0 0 700 240" width="100%" height="100%" preserveAspectRatio="none"><line x1="38" y1="18" x2="38" y2="205" stroke="#d9dfdb"/><line x1="38" y1="205" x2="680" y2="205" stroke="#d9dfdb"/><g stroke="#edf0ee"><line x1="38" y1="55" x2="680" y2="55"/><line x1="38" y1="105" x2="680" y2="105"/><line x1="38" y1="155" x2="680" y2="155"/></g><line x1="300" y1="18" x2="300" y2="205" stroke="#9fb1a8" stroke-dasharray="5 5"/><text x="308" y="30" font-size="11" fill="#69776f">HEP v2 · Step-Up added</text><polyline fill="none" stroke="#be4c50" stroke-width="4" points="45,123 140,140 230,149 320,116 420,85 530,67 670,70"/><circle cx="670" cy="70" r="5" fill="#be4c50"/><text x="3" y="59" font-size="10" fill="#7b8781">8</text><text x="3" y="109" font-size="10" fill="#7b8781">5</text><text x="3" y="159" font-size="10" fill="#7b8781">2</text><text x="42" y="225" font-size="10" fill="#7b8781">Aug 12</text><text x="635" y="225" font-size="10" fill="#7b8781">Sep 3</text></svg></div></div>`}
function patientHEP(){const p=patientByName(S.selectedPatient),ids=p.assignedExerciseIds||[];if(!ids.length)return `<div class="card" style="padding:22px"><h2 style="margin-top:0">No active HEP yet</h2><p style="color:var(--muted)">${p.pending?'A program can be queued while the invitation is pending.':'Build or assign a HEP to this patient.'}</p><button class="btn primary" onclick="builderForPatient('${p.name.replace("'","\'")}','manual')">Create HEP</button></div>`;return `<div class="card"><div class="cardHeader"><div><h2>${p.hep||'Active HEP'}</h2><p style="font-size:11px;color:var(--muted);margin:4px 0 0">${p.programName||'Patient-specific program'}${p.lastAssigned?' · assigned '+p.lastAssigned:''}</p></div><div><button class="btn small secondary" onclick="suggestModification('${ids[0]}')">${I(ICON.ai)} Suggest progression / regression</button> <button class="btn small primary" onclick="builderForPatient('${p.name.replace("'","\'")}','manual')">${tx('common.edit')}</button></div></div><div style="padding:0 16px">${ids.map(id=>{const e=EX.find(x=>x.id===id);return e?`<div class="exerciseSuggestion"><div class="exerciseThumb">MEDIA</div><div><b>${exText(e,'name')}</b><p>${exText(e,'desc')}</p></div><div class="dosePreview">${e.dose}<br>${clinicalTerm('freq',e.freq)}</div><span class="badge ${p.pending?'violet':'green'}">${p.pending?'Queued':'Active'}</span></div>`:''}).join('')}</div></div><div class="card" style="margin-top:14px"><div class="cardHeader"><h2>HEP history</h2><button class="btn small ghost" onclick="explainHEPChange()">${I(ICON.ai)} Explain what changed</button></div><div style="padding:12px 16px;font-size:12px"><b>${p.hep}</b> · ${p.assignmentReason||'Assigned'} · ${p.lastAssigned||'Previously assigned'}</div></div>`}

function patientProgressSarah(){return `${chart()}<div class="metricGrid" style="margin-top:14px"><div class="metricCard"><small>Adherence trend</small><strong>82%</strong><em>12 completed sessions</em></div><div class="metricCard"><small>Pain trend</small><strong>4 → 7</strong><em style="color:var(--red)">Worsening recently</em></div><div class="metricCard"><small>Difficulty</small><strong style="font-size:16px">Mostly just right</strong><em>1 exercise too easy</em></div><div class="metricCard"><small>Post-session response</small><strong style="font-size:16px">Mostly better</strong><em>Worse on last 2</em></div></div><div class="card" style="margin-top:14px"><div class="cardHeader"><h2>Barriers</h2></div><div class="missionList"><div class="missionItem"><div><b>No recurring barrier</b><p>Two missed sessions this month; one reported “didn’t have time.”</p></div><span class="badge green">Low</span></div></div></div>`}

function heps(){return savedHEPsPage(false)}
function savedHEPsPage(inBuilder=false){const tags=['All','Knee','Hip','Lumbar','Balance','Gait','Strength','Mobility','Post-op','Beginner'];const list=SAVED.filter(h=>(S.savedTag==='All'||(h.tags||[]).includes(S.savedTag))&&(!S.savedSearch||[h.name,h.desc,...(h.tags||[])].join(' ').toLowerCase().includes(S.savedSearch.toLowerCase())));return `${inBuilder?`<div class="builderTop day3"><div class="builderTitle"><div><h1>Saved HEPs</h1><p>Personal library · tagged and reusable</p></div></div><div class="builderActions"><button class="btn secondary small" onclick="builder()">Back to HEP Builder</button></div></div><div class="builderMain">`:pageTitle('Saved HEPs','Reusable programs you can assign, edit, duplicate, download or print.',`<button class="btn primary" onclick="builder()">${I(ICON.plus)} HEP Builder</button>`)}<div class="savedToolbar"><input placeholder="Search saved HEPs…" value="${S.savedSearch}" oninput="S.savedSearch=this.value;render()"><button class="btn secondary" onclick="builder('manual')">${I(ICON.plus)} New HEP</button></div><div class="filters">${tags.map(tag=>`<button class="filter ${S.savedTag===tag?'on':''}" onclick="S.savedTag='${tag}';render()">${tag==='All'?'All tags':tag}</button>`).join('')}</div><div class="savedGrid">${list.map(h=>savedCard(h)).join('')||`<div class="card" style="padding:20px">No saved HEPs match these filters.</div>`}</div>${inBuilder?'</div>':''}`}
function savedCard(h){return `<div class="savedCard"><div style="display:flex;justify-content:space-between;gap:10px"><span class="badge violet">${h.scope||'My HEP'}</span><button class="btn small ghost" onclick="suggestTags('${h.id}')">${I(ICON.ai)} Suggest tags with AI</button></div><h3>${templateName(h)}</h3><p>${h.desc}</p><div class="tagRow">${(h.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div><div style="font-size:11px;color:var(--muted)">Used ${h.used||0} times · Last used ${h.lastUsed||'—'}</div><div class="savedActions"><button class="btn small primary" onclick="assignSaved('${h.id}')">Assign HEP</button><button class="btn small secondary" onclick="openSaved('${h.id}')">Open & edit</button><button class="btn small ghost" onclick="duplicateSaved('${h.id}')">Duplicate</button><button class="btn small ghost" onclick="downloadSaved('${h.id}')">Download / Print</button></div></div>`}
function openSaved(id){const h=SAVED.find(x=>x.id===id);S.program=h.ids.map(id=>({...EX.find(e=>e.id===id)}));S.programName=h.name;S.builderMode='manual';S.builderTab='library';S.page='builder';persist();render();toast('Saved HEP opened')}
function duplicateSaved(id){const h=SAVED.find(x=>x.id===id);const copy={...h,id:'saved_'+Date.now(),name:h.name+' — Copy',used:0,lastUsed:'Not yet'};SAVED.unshift(copy);persist();render();toast('Saved HEP duplicated')}

function suggestTags(id){const h=SAVED.find(x=>x.id===id);showModal(`<div class="modalHead"><h2>${I(ICON.ai)} AI suggested tags</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px;color:var(--muted)">Based on the exercises and intended use of <b>${h.name}</b>:</p><div class="tagRow">${[...(h.tags||[]),'Home program'].slice(0,6).map(t=>`<span class="tag">${t}</span>`).join('')}</div><p style="font-size:11px;color:var(--muted)">AI only suggests organization metadata. You decide what is saved.</p><button class="btn primary" style="width:100%" onclick="closeModal();toast('Tags reviewed')">Done</button>`)}
function downloadSaved(id){const h=SAVED.find(x=>x.id===id);const exs=h.ids.map(id=>EX.find(e=>e.id===id)).filter(Boolean);const body=`<html><head><title>${h.name}</title><style>body{font-family:Arial;padding:32px;max-width:760px;margin:auto}li{margin:14px 0}</style></head><body><h1>${h.name}</h1><p>${h.desc}</p><ol>${exs.map(e=>`<li><b>${exText(e,'name')}</b> — ${e.dose}, ${clinicalTerm('freq',e.freq)}<br>${exText(e,'desc')}</li>`).join('')}</ol><p>HEPmate prototype handout</p></body></html>`;const blob=new Blob([body],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=h.name.replace(/[^a-z0-9]+/gi,'_')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Handout downloaded')}
function saveToLibraryModal(){if(!S.program.length)return;showModal(`<div class="modalHead"><h2>Save to Saved HEPs</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="field"><label>Program name</label><input id="saveName" value="${S.programName}"></div><div class="field"><label>Tags</label><input id="saveTags" value="Knee, Strength" placeholder="Knee, balance, gait…"></div><button class="btn secondary" style="width:100%;margin-bottom:8px" onclick="suggestSaveTags()">${I(ICON.ai)} Suggest tags with AI</button><button class="btn primary" style="width:100%" onclick="saveToLibrary()">Save for later</button>`)}

function saveToLibrary(){const name=document.getElementById('saveName')?.value.trim()||'Untitled HEP';const tags=(document.getElementById('saveTags')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);SAVED.unshift({id:'saved_'+Date.now(),name,desc:`${S.program.length} exercises · reusable home program`,ids:S.program.map(e=>e.id),scope:'My HEP',tags,used:0,lastUsed:'Not yet'});S.programName=name;persist();closeModal();successCustom('HEP saved','This program is now in Saved HEPs and can be assigned, edited, duplicated, downloaded or printed later.')}
function programCards(){return savedHEPCards()}
function templateCards(){return savedHEPCards()}
function builderHub(){return `${pageTitle('HEP Builder','Build a program first. Choose the patient only when you are ready to assign it.')}${S.program.length?`<div class="card" style="padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px"><div><b style="font-size:13px">Current draft · ${S.programName}</b><p style="font-size:11px;color:var(--muted);margin:3px 0 0">${S.program.length} exercises · autosaved</p></div><button class="btn secondary" onclick="builder('manual')">Resume draft</button></div>`:''}<div class="hepHub"><button class="hubCard" onclick="startNewBuilder('ai')"><div><div class="hubIcon">${I(ICON.ai)}</div><h2>AI HEP Builder</h2><p>Start with AI suggestions using optional clinical context. You still review, edit and approve every exercise.</p></div><span class="hubCTA">Start with AI ${I(ICON.arrow)}</span></button><button class="hubCard" onclick="startNewBuilder('manual')"><div><div class="hubIcon">${I(ICON.exercise)}</div><h2>Manual HEP Builder</h2><p>Build exercise by exercise from the library with full control over selection, dosage and instructions.</p></div><span class="hubCTA">Build manually ${I(ICON.arrow)}</span></button><button class="hubCard" onclick="builder('saved')"><div><div class="hubIcon">${I(ICON.heps)}</div><h2>Saved HEPs</h2><p>Reuse a tagged program, edit it, assign it, or print it.</p></div><span class="hubCTA">Browse saved HEPs ${I(ICON.arrow)}</span></button></div>`}
function builderPage(){if(!S.builderMode)return builderHub();if(S.builderMode==='saved')return savedHEPsPage(true);return `<div class="builderTop day3"><div class="builderTitle"><div><input class="programNameInput" value="${S.programName}" oninput="S.programName=this.value;persist()"><p class="builderWorkspaceNote"><span class="badge ${S.assignPatient?'green':''}">${S.assignPatient?'Patient-linked: '+S.assignPatient:'General draft · no patient selected'}</span> ${S.builderMode==='ai'?'AI HEP Builder':'Manual HEP Builder'}</p></div></div><div class="builderActions"><button class="btn secondary small" onclick="saveToLibraryModal()">Save to Saved HEPs</button><button class="btn primary small" ${!S.program.length?'disabled':''} onclick="assignChooser()">Assign HEP</button></div></div><div class="builderGrid"><section class="builderMain"><nav class="builderTabs">${[['ai','AI HEP Builder'],['manual','Manual HEP Builder'],['saved','Saved HEPs']].map(([id,l])=>`<button class="builderTab ${S.builderMode===id?'on':''}" onclick="S.builderMode='${id}';S.builderTab='${id==='manual'?'library':id}';render()">${l}</button>`).join('')}</nav>${S.builderMode==='ai'?aiBuilder():libraryBuilder()}</section><aside class="builderProgram"><div class="programHead"><div><h2>${tx('builder.program')} · ${S.program.length} Exercises</h2><span style="font-size:10px;color:var(--muted)">${tx('builder.drag')}</span></div><span class="badge green">Draft</span></div><div class="programScroll">${programItems()}</div><div class="programDetails"><b style="font-size:12px">${tx('builder.programDetails')}</b><div class="field"><label>${tx('builder.notes')}</label><textarea placeholder="Optional">Stop if symptoms significantly worsen and contact your clinician.</textarea></div><button class="btn small ghost" style="width:100%" onclick="${S.assignPatient?`S.selectedPatient='${S.assignPatient}';S.view='patient';S.patientPage='today';render()`:'previewGenericProgram()'}">${I(ICON.eye)} ${tx('builder.previewPatient')}</button></div><div class="programBottom"><button class="btn secondary" ${!S.program.length?'disabled':''} onclick="reviewProgram()">Review program</button><button class="btn primary" style="margin-top:8px" ${!S.program.length?'disabled':''} onclick="assignChooser()">Assign HEP ${I(ICON.arrow)}</button><div class="autosaveText">${tx('builder.autosaved')}</div></div></aside></div><div class="mobileProgramBar" onclick="programDrawer()"><div><b>${tx('builder.program')} · ${S.program.length}</b><br><span>${S.program.length?S.program.map(x=>exText(x,'name')).slice(0,2).join(', '):'No exercises yet'}</span></div>${I(ICON.chevron)}</div>`}
function previewGenericProgram(){if(!S.program.length){toast('Add exercises before previewing','info');return}showModal(`<div class="modalHead"><h2>Patient preview · not assigned</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px;color:var(--muted)">${S.programName} · ${S.program.length} exercises. This is a generic preview; no patient is attached.</p>${S.program.map((e,i)=>`<div class="exerciseSuggestion"><div class="exerciseThumb">${i+1}</div><div><b>${exText(e,'name')}</b><p>${exText(e,'desc')}</p></div><div class="dosePreview">${e.dose}<br>${clinicalTerm('freq',e.freq)}</div><span class="badge">Preview</span></div>`).join('')}<button class="btn primary" style="width:100%;margin-top:12px" onclick="closeModal()">Done</button>`)}
function programItems(){if(!S.program.length)return `<div class="programEmpty">Add exercises from AI suggestions or Manual HEP Builder. You can save this program before assigning it to anyone.</div>`;return S.program.map((e,i)=>`<div class="programItem"><span class="dragHandle">⋮⋮</span><div class="exerciseThumb">${i+1}</div><div><b>${exText(e,'name')}</b><p>${e.dose} · ${clinicalTerm('freq',e.freq)}</p></div><button class="kebab" title="AI modification suggestion" onclick="suggestModification('${e.id}')">${I(ICON.ai)}</button><button class="kebab" onclick="removeExercise('${e.id}')">${I(ICON.close)}</button></div>`).join('')}
function editAIContext(){const c=S.aiContext,conditions=['Knee Osteoarthritis','Post-op Knee','Knee Pain','Low Back Pain','Lumbar Stenosis','Hip Pain','Shoulder Pain','Balance / Fall Risk'],goals=['Stairs & walking tolerance','Walking / gait','Balance / fall prevention','Strength','Mobility / range of motion','Transfers / sit-to-stand','Reach / overhead use','Return to work/activity'],equipment=['None','Chair','Resistance band','Chair + resistance band','Counter / stable support','Step','Cane / walker','Ankle weights','Dumbbells'],precautions=['None','Weight-bearing restriction','Fall risk','Post-op precautions','Avoid high impact'];const sel=(id,val,opts,otherId,placeholder)=>`<select id="${id}" onchange="toggleOther('${id}','${otherId}')"><option ${!val?'selected':''}>Not specified</option>${opts.map(v=>`<option ${val===v?'selected':''}>${v}</option>`).join('')}<option ${val&&!opts.includes(val)?'selected':''}>Other</option></select><input id="${otherId}" class="${val&&!opts.includes(val)?'':'hidden'}" style="margin-top:7px" value="${val&&!opts.includes(val)?val:''}" placeholder="${placeholder}">`;showModal(`<div class="modalHead"><h2>Edit AI HEP context</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px;color:var(--muted)">These fields are optional. Choose a common rehab option or select <b>Other</b> and type what applies. Free-text entries are interpreted as context for ranking exercises; the clinician still approves every choice.</p><div class="row2"><div class="field"><label>Condition</label>${sel('ctxCondition',c.condition,conditions,'ctxConditionOther','Type condition')}</div><div class="field"><label>Primary goal</label>${sel('ctxGoals',c.goals,goals,'ctxGoalsOther','Type goal')}</div></div><div class="row2"><div class="field"><label>Pain / symptoms</label><select id="ctxPain"><option value="" ${c.pain===''||c.pain==null?'selected':''}>Not specified</option>${Array.from({length:11},(_,i)=>i).map(i=>`<option value="${i}" ${String(c.pain)===String(i)?'selected':''}>${i}/10</option>`).join('')}</select></div><div class="field"><label>Difficulty trend</label><select id="ctxDifficulty">${['Unknown','Too easy','Just right','Moderate','Too difficult'].map(v=>`<option ${c.difficulty===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="row2"><div class="field"><label>Equipment available</label>${sel('ctxEquipment',c.equipment||'None',equipment,'ctxEquipmentOther','e.g., kettlebells, TRX, ankle weights')}</div><div class="field"><label>Precautions</label>${sel('ctxPrecautions',c.precautions||'None',precautions,'ctxPrecautionsOther','Type precaution')}</div></div><div class="fieldHint">The free-text “What would you like to focus on?” instruction is assessed together with every field above when suggestions are generated.</div><button class="btn primary" style="width:100%" onclick="saveAIContext()">Save context</button>`)}
function saveAIContext(){S.aiContext.condition=readOther('ctxCondition','ctxConditionOther');S.aiContext.goals=readOther('ctxGoals','ctxGoalsOther');S.aiContext.pain=document.getElementById('ctxPain')?.value??'';S.aiContext.difficulty=document.getElementById('ctxDifficulty')?.value||'Unknown';S.aiContext.equipment=readOther('ctxEquipment','ctxEquipmentOther')||'None';S.aiContext.precautions=readOther('ctxPrecautions','ctxPrecautionsOther')||'None';persist();S.generated=false;closeModal();render();toast('AI context updated')}
function aiBuilder(){const c=S.aiContext,recognized=contextInsight();return `<div class="contextEditRow"><div><h2 style="margin:0;font-size:16px">${S.assignPatient?'Patient context':'Optional HEP context'}</h2><span class="aiContext">${I(ICON.ai)} ${S.assignPatient?'Loaded from '+S.assignPatient:'No patient selected'} · AI recommends · Clinician decides</span></div><button class="btn secondary small" onclick="editAIContext()">${I(ICON.edit)} Edit</button></div><div class="contextGrid"><div class="contextBox"><small>Condition</small><b>${c.condition||'Not entered'}</b></div><div class="contextBox"><small>Goal</small><b>${c.goals||'Not entered'}</b></div><div class="contextBox"><small>Pain</small><b>${c.pain!==''&&c.pain!=null?c.pain+'/10':'Not entered'}</b></div><div class="contextBox"><small>Equipment</small><b>${c.equipment||'Not entered'}</b></div><div class="contextBox"><small>Precautions</small><b>${c.precautions||'None'}</b></div><div class="contextBox"><small>Difficulty trend</small><b>${c.difficulty||'Unknown'}</b></div></div>${recognized.length?`<div class="contextRecognized">${recognized.map(x=>`<span class="badge green">${I(ICON.ai)} ${x}</span>`).join('')}</div>`:''}<div class="aiPrompt"><h3>${tx('builder.focus')}</h3><textarea id="aiFocus" oninput="S.aiContext.focus=this.value">${c.focus||''}</textarea><div class="aiMeta"><p>Suggestions are ranked using condition, goal, equipment, pain, difficulty, precautions and your focus instructions. Other/free-text entries are interpreted as context.</p><button class="btn primary small" onclick="generateAI()">${I(ICON.ai)} ${tx('builder.generate')}</button></div></div>${S.generated?`<div class="suggestionList fadeIn"><div class="suggestionHeader"><div><h2>${tx('builder.suggested')} (6)</h2><span style="font-size:11px;color:var(--muted)">Context-ranked suggestions · clinician reviews every choice</span></div><button class="btn small ghost" onclick="S.builderMode='manual';S.builderTab='library';render()">+ Manual HEP Builder</button></div>${aiSuggestionIds().map(id=>exerciseSuggestion(id,true)).join('')}</div>`:`<div style="margin-top:16px;border:1px dashed #cbd8d0;border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:12px">Generate a context-aware draft, or switch to Manual HEP Builder without losing your current program.</div>`}`}

function exerciseSuggestion(id,showReason=false){const e=EX.find(x=>x.id===id),added=S.program.some(x=>x.id===id);return `<div class="exerciseSuggestion"><div class="exerciseThumb">MEDIA</div><div><b>${exText(e,'name')}</b><p>${exText(e,'desc')}</p>${showReason?`<div class="aiSuggestionReason">${I(ICON.ai)} ${aiReasonFor(e)}</div>`:''}</div><div class="dosePreview">${e.dose}<br>${clinicalTerm('freq',e.freq)}</div><button class="btn small ${added?'ghost':'secondary'}" ${added?'disabled':''} onclick="addExercise('${e.id}')">${added?'✓ Added':'Add'}</button></div>`}
function libraryBuilder(){let list=EX.filter(e=>(S.libraryFilter==='All'||e.region===S.libraryFilter)&&(!S.librarySearch||exerciseSearchText(e).includes(S.librarySearch.toLowerCase())));return `<div class="libraryToolbar"><input placeholder="${S.lang==='es'?'Buscar ejercicios…':S.lang==='ar'?'ابحث عن تمرين…':'Search exercises…'}" value="${S.librarySearch}" oninput="S.librarySearch=this.value;render()"><button class="btn secondary small" onclick="customExercise()">+ Custom exercise</button></div><div class="filters">${['All','Knee','Hip','Lumbar','Ankle','Thoracic','Shoulder','Balance'].map(f=>`<button class="filter ${S.libraryFilter===f?'on':''}" onclick="S.libraryFilter='${f}';render()">${clinicalTerm('region',f)}</button>`).join('')}<button class="filter">★ Favorites</button><button class="filter">Recently used</button></div><p style="font-size:9px;color:var(--muted)">${tx('builder.manualHint')}</p><div class="exerciseGrid">${list.map(e=>`<div class="exerciseCard" onclick="S.previewExercise='${e.id}'"><div class="exerciseCardTop"><div class="exerciseThumb">MEDIA</div><div><h3>${exText(e,'name')}</h3><p>${exText(e,'desc')}</p><span class="badge" style="margin-top:5px">${clinicalTerm('region',e.region)}</span></div></div><div class="exerciseCardFooter"><button class="btn small ghost" onclick="event.stopPropagation();previewExercise('${e.id}')">${tx('common.preview')}</button><button class="btn small primary" onclick="event.stopPropagation();addExercise('${e.id}')">+ Add</button></div></div>`).join('')}</div>`}
function customExercise(){showModal(`<div class="modalHead"><h2>New custom exercise</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="field"><label>Exercise name</label><input value="Supported Mini Squat"></div><div class="field"><label>Patient instructions</label><textarea>Stand at a counter for support. Bend your knees into a comfortable mini squat, then return to standing.</textarea></div><div class="row2"><div class="field"><label>Body region</label><select><option>Knee</option><option>Hip</option></select></div><div class="field"><label>Equipment</label><input value="Counter"></div></div><div class="field"><label>Media</label><button class="btn secondary" style="width:100%">Upload photo or video</button></div><button class="btn primary" style="width:100%" onclick="closeModal();toast('Custom exercise saved')">Save exercise</button>`)}
function previewExercise(id){const e=EX.find(x=>x.id===id);showModal(`<div class="modalHead"><h2>${exText(e,'name')}</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><div class="previewMedia">EXERCISE MEDIA</div><p style="font-size:10px;color:var(--muted);line-height:1.55">${exText(e,'desc')}</p><div style="border-left:3px solid var(--green);background:var(--mint);padding:10px 12px;border-radius:7px;margin:10px 0;font-size:10px;line-height:1.55"><b>${S.lang==='es'?'Instrucciones para el paciente':S.lang==='ar'?'تعليمات المريض':'Patient instructions'}</b><br>${CLINICAL_LOCAL[S.lang]?.exercise?.[e.id]?.instruction||'Perform the movement slowly and within a comfortable range. Follow your clinician’s prescribed dosage.'}</div><div class="detailList"><div><span>Region</span><b>${clinicalTerm('region',e.region)}</b></div><div><span>Goal</span><b>${clinicalTerm('goal',e.goal)}</b></div><div><span>Equipment</span><b>${clinicalTerm('equip',e.equip)}</b></div><div><span>Default dosage</span><b>${e.dose}</b></div><div><span>Progression</span><b>View related exercises</b></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="addExercise('${e.id}');closeModal()">+ Add to program</button>`)}

function exercises(){const e=EX.find(x=>x.id===S.previewExercise)||EX[0];return `${pageTitle(tx('common.exercises'),'Browse HEPmate exercises, clinic content, favorites and custom exercises.',`<button class="btn secondary" onclick="customExercise()">+ Custom exercise</button><button class="btn primary" onclick="builder('manual')">${I(ICON.plus)} Add to HEP</button>`)}<div class="fullLibrary"><section>${libraryBuilder()}</section><aside class="previewPanel"><div class="previewMedia">EXERCISE MEDIA</div><div class="previewBody"><span class="badge green">HEPmate Library</span><h2>${e.name}</h2><p>${e.desc}. This preview stays visible while you browse on desktop.</p><div class="detailList"><div><span>Region</span><b>${e.region}</b></div><div><span>Goal</span><b>${e.goal}</b></div><div><span>Equipment</span><b>${e.equip}</b></div><div><span>Dosage</span><b>${e.dose}</b></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="addExercise('${e.id}')">+ Add to program</button></div></aside></div>`}
function messages(){const threads=[['Sarah Williams','Step-ups are bothering my knee','2m'],['Maya Patel','Can I do these before work?','1h'],['Robert Green','Thanks — feels easier now','Yesterday']];return `${pageTitle(tx('common.messages'),'Patient communication with original + translated text preserved.') }<div class="messagesGrid"><aside class="threads">${threads.map((x,i)=>`<button class="thread ${S.selectedThread===i?'on':''}" style="width:100%;border:0;text-align:left" onclick="S.selectedThread=${i};render()"><div class="avatar">${['SW','MP','RG'][i]}</div><div><b>${x[0]}</b><p>${x[1]}</p><span style="font-size:10px;color:var(--muted)">${x[2]}</span></div></button>`).join('')}</aside><section class="chat"><div class="chatHead"><div class="avatar">SW</div><div><b>Sarah Williams</b><div style="font-size:10px;color:var(--muted)">Preferred language: English</div></div><button class="btn small secondary" style="margin-left:auto" onclick="draftReply()">${I(ICON.ai)} Draft reply with AI</button></div><div class="chatBody"><div class="bubble">Hi Dr. Moustafa — the step-ups have been bothering the front of my knee the last two times.<div class="translationLine">Original · English</div></div><div class="bubble me">Thanks for letting me know. I’m going to review the exercise and your recent pain scores before we decide whether to modify it.</div><div class="bubble">Everything else feels okay.</div></div><div class="chatCompose"><input id="chatInput" placeholder="Write a message…"><button class="btn primary" onclick="sendMessage()">${I(ICON.message)} ${tx('common.send')}</button></div></section></div>`}
function draftReply(){const el=document.getElementById('chatInput');if(el){el.value='Thanks for telling me. I reviewed your recent responses and I want to adjust the step-up before you continue progressing it. If it causes a meaningful increase in symptoms, stop that exercise and message me.';toast('AI draft ready — review before sending')}}
function sendMessage(){const val=document.getElementById('chatInput')?.value?.trim();if(!val){toast('Write a message first','info');return}toast(tx('feedback.messageSent'));document.getElementById('chatInput').value=''}
function rtm(){return `${pageTitle(tx('common.rtm'),'RTM-ready monitoring workflow and documentation support. Eligibility remains payer/ruleset dependent.') }<div class="syntheticBar">Prototype only. HEPmate will surface potential eligibility/documentation readiness; it will not guarantee reimbursement.</div><div class="rtmGrid"><div class="rtmCard"><h3>Monitoring periods</h3><p>See device/activity days and identify patients who may need documentation review.</p><div style="margin:13px 0 6px;font-size:9px;display:flex;justify-content:space-between"><b>Sarah Williams</b><span>12 / 15 days</span></div><div class="progressBar"><span style="width:80%"></span></div>${[['Robert Green','18 / 30 device days','Potential 98977 window'],['Maya Patel','8 / 15 device days','Potential 98985 window'],['David Chen','21 / 30 device days','Review interaction time']].map(x=>`<div class="rtmPatient"><div><b>${x[0]}</b><p>${x[2]}</p></div><span class="badge green">${x[1]}</span></div>`).join('')}</div><div class="rtmCard"><h3>Interactive treatment time</h3><p>Track qualifying synchronous interaction separately from passive exercise logging.</p>${[['Sarah Williams','12 min','This period'],['Robert Green','24 min','This period'],['Maya Patel','8 min','This period']].map(x=>`<div class="rtmPatient"><div><b>${x[0]}</b><p>${x[2]}</p></div><span class="badge">${x[1]}</span></div>`).join('')}<button class="btn secondary" style="width:100%;margin-top:10px">Add interaction time</button></div><div class="rtmCard"><h3>Documentation readiness</h3><p>Structured evidence that can support clinician review and documentation.</p><div class="progressBar"><span style="width:72%"></span></div><p style="margin-top:8px">72% of active RTM patients have complete structured activity + interaction records in this demo.</p></div><div class="rtmCard"><h3>Ruleset</h3><p>Effective date: 2026 · Musculoskeletal RTM<br>Rules remain configurable by payer and effective date.</p><button class="btn ghost small">View rules</button></div></div>`}
function clinicPage(){return `${pageTitle(tx('common.clinic'),'Manage locations, team members, branding and shared templates.') }<div class="programGrid"><div class="programCard"><span class="badge green">Workspace</span><h3>Main Street Rehab</h3><p>1 location · 6 clinicians · 42 active patients</p><div class="programFooterRow"><button class="btn small ghost">Manage</button></div></div><div class="programCard"><span class="badge">Branding</span><h3>Patient-facing identity</h3><p>Logo, contact information, HEP PDF footer and invite settings.</p><div class="programFooterRow"><button class="btn small ghost">Edit</button></div></div><div class="programCard"><span class="badge violet">Shared content</span><h3>Clinic Templates</h3><p>12 shared HEP templates · 18 custom exercises</p><div class="programFooterRow"><button class="btn small ghost">Open</button></div></div></div>`}
function settingsPage(){return `${pageTitle(tx('common.settings'),'Personal preferences, language, notifications and account controls.') }<div style="max-width:620px"><div class="card" style="padding:16px"><div class="field"><label>${tx('common.language')}</label><select onchange="setLang(this.value)"><option value="en" ${S.lang==='en'?'selected':''}>English</option><option value="es" ${S.lang==='es'?'selected':''}>Español</option><option value="ar" ${S.lang==='ar'?'selected':''}>العربية</option></select></div><div class="field"><label>Default patient reminder time</label><input type="time" value="18:00"></div><div class="field"><label>Notifications</label><select><option>Important clinical signals + messages</option><option>All activity</option><option>Minimal</option></select></div><button class="btn primary" onclick="toast('Settings saved')">${tx('common.save')}</button></div></div>`}
function appContent(){switch(S.page){case'home':return dashboard();case'patients':return patients();case'patient':return patient();case'heps':return savedHEPsPage(false);case'saved':return savedHEPsPage(false);case'builder':return builderPage();case'exercises':return exercises();case'messages':return messages();case'rtm':return rtm();case'clinic':return clinicPage();case'settings':return settingsPage();default:return dashboard()}}
function app(){return shell(appContent())}
function patientApp(){return `<div class="patientApp"><header class="patientTop"><span class="wordmark">HEP<span>mate</span></span><div style="display:flex;gap:7px"><select class="btn secondary small" onchange="setLang(this.value)"><option value="en" ${S.lang==='en'?'selected':''}>EN</option><option value="es" ${S.lang==='es'?'selected':''}>ES</option><option value="ar" ${S.lang==='ar'?'selected':''}>AR</option></select><button class="userButton" onclick="S.view='app';S.page='home';render()"><div class="avatar">SW</div></button></div></header><main class="patientMain">${S.patientPage==='today'?patientToday():S.patientPage==='progress'?patientMobileProgress():S.patientPage==='messages'?patientMobileMessages():patientMore()}</main><nav class="patientBottomNav">${[['today',tx('common.today'),ICON.home],['progress',tx('common.progress'),ICON.progress],['messages',tx('common.messages'),ICON.message],['more',tx('common.more'),ICON.more]].map(([p,l,ic])=>`<button class="${S.patientPage===p?'on':''}" onclick="S.patientPage='${p}';render()">${I(ic)}<span>${l}</span></button>`).join('')}</nav></div>`}
function patientToday(){const items=['e1','e3','e4'];return `<div class="todayHero"><small>Good afternoon, Sarah</small><h1>${tx('patientApp.today')}</h1><p>${tx('patientApp.sub')}</p><div class="todayProgress"><span style="width:${Object.keys(S.patientCompleted).length/items.length*100}%"></span></div></div>${items.map((id,i)=>{const e=EX.find(x=>x.id===id),done=S.patientCompleted[id];return `<div class="patientExercise"><div class="patientExerciseMedia">EXERCISE VIDEO</div><div class="patientExerciseBody"><span class="badge">${i+1} of ${items.length}</span><h3>${exText(e,'name')}</h3><p>${e.dose} · ${clinicalTerm('freq',e.freq)}<br>${exText(e,'desc')}</p><div style="font-size:11px;font-weight:800;margin:10px 0 6px">How did this feel?</div><div class="ratingRow"><button class="ratingBtn">Too easy</button><button class="ratingBtn on">Just right</button><button class="ratingBtn">Too difficult</button></div><div class="painLine"><span>Pain</span><input type="range" min="0" max="10" value="${S.sessionPain}" oninput="S.sessionPain=this.value;this.nextElementSibling.textContent=this.value+'/10'"><b>${S.sessionPain}/10</b></div>${id==='e3'?`<div style="font-size:11px;font-weight:800;margin:12px 0 6px">How confident are you that you are doing this correctly?</div><div class="responseRow">${['Confident','Somewhat unsure','Not sure'].map(x=>`<button class="responseBtn ${S.confidence===x?'on':''}" onclick="S.confidence='${x}';render()">${x}</button>`).join('')}</div>`:''}<button class="btn ${done?'secondary':'primary'}" style="width:100%;margin-top:12px" onclick="completePatientExercise('${id}')">${done?'✓ '+tx('common.done'):tx('patientApp.complete')}</button></div></div>`}).join('')}<div class="patientProgressCard"><h2>After your program, how do you feel?</h2><div class="responseRow">${['Better','About the same','Worse'].map(x=>`<button class="responseBtn ${S.sessionResponse===x?'on':''}" onclick="S.sessionResponse='${x}';render()">${x}</button>`).join('')}</div></div><button class="btn dark" style="width:100%;margin-top:14px" onclick="finishPatientSession()">${tx('patientApp.finish')}</button>`}
function completePatientExercise(id){S.patientCompleted[id]=true;toast(tx('patientApp.complete'));render()}
function finishPatientSession(){const total=3,done=Object.keys(S.patientCompleted).length;if(done<total){barrierModal();return}successCustom('Session complete',`Your session was saved. Pain: ${S.sessionPain}/10 · Difficulty: just right · Response: ${S.sessionResponse}. Your clinician can review these trends.` ,`<button class="btn primary" onclick="closeModal();S.patientPage='progress';render()">View progress</button>`)}
function barrierModal(){showModal(`<div class="modalHead"><h2>What got in the way today?</h2><button class="closeBtn" onclick="closeModal()">${I(ICON.close)}</button></div><p style="font-size:12px;color:var(--muted)">One tap helps your clinician understand why the program was not completed.</p><div class="responseRow">${['Pain / soreness','Didn’t have time','Forgot','Wasn’t sure how','Didn’t feel safe','No equipment','Didn’t think I needed to','Other'].map(x=>`<button class="responseBtn" onclick="saveBarrier('${x.replace("'","\\'")}')">${x}</button>`).join('')}</div><button class="btn ghost" style="width:100%;margin-top:12px" onclick="closeModal()">Skip</button>`)}
function saveBarrier(v){S.barrier=v;closeModal();toast('Barrier saved');successCustom('Session saved',`Your clinician can see that ${v.toLowerCase()} got in the way today, along with your pain and exercise responses.`)}
function patientMobileProgress(){return `<div class="patientProgressCard"><h2>${tx('patientApp.progress')}</h2><div class="metricGrid"><div class="metricCard"><small>Adherence</small><strong>82%</strong></div><div class="metricCard"><small>Pain trend</small><strong>4 → 7</strong></div><div class="metricCard"><small>Difficulty</small><strong style="font-size:15px">Mostly just right</strong></div><div class="metricCard"><small>Session response</small><strong style="font-size:15px">Mostly better</strong></div></div></div><div class="patientProgressCard"><h2>Barriers</h2><div class="missionItem"><div><b>Pain / soreness</b><p>Reported once this month</p></div><span class="badge amber">1</span></div></div><div class="patientProgressCard"><h2>Last 4 weeks</h2>${chart()}</div>`}
function patientMobileMessages(){return `<div class="patientProgressCard"><h2>${tx('patientApp.messages')}</h2><div class="bubble">Your clinician updated your HEP on Aug 28.</div><div class="bubble me">Thanks — the new program is clear.</div><div class="chatCompose" style="padding:10px 0 0;border:0"><input placeholder="Message your clinician…"><button class="btn primary">${I(ICON.message)}</button></div></div>`}
function patientMore(){return `<div class="patientProgressCard"><h2>${tx('patientApp.more')}</h2><button class="btn secondary" style="width:100%;justify-content:flex-start">${I(ICON.globe)} ${tx('common.language')}</button><button class="btn secondary" style="width:100%;justify-content:flex-start;margin-top:8px">Education & resources</button><button class="btn secondary" style="width:100%;justify-content:flex-start;margin-top:8px" onclick="S.view='app';S.page='home';render()">Exit patient preview</button></div>`}
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';const r=document.getElementById('root');r.innerHTML=S.view==='marketing'?marketing():S.view==='auth'?auth():S.view==='patient'?patientApp():app();localizeDOM(r);if(S.searchOpen)setTimeout(()=>{renderSearchResults('');localizeDOM(document.getElementById('searchResults'))},0)}
render();
</script>
</body>
</html>
