<style>

.appbar{height:64px;background:#FBFAF6;padding:0 20px}.appLeft{display:flex;align-items:center;gap:14px}.clinicName{border-left:1px solid var(--line);padding-left:14px;font-size:12px;color:var(--muted)}.avatar{width:34px;height:34px;border-radius:50%;background:var(--sage);display:grid;place-items:center;font-size:11px;font-weight:850}.appGrid{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 64px)}.sidebar{background:#F1F2EC;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:64px;height:calc(100vh - 64px)}.sideLabel{padding:12px 10px 6px;font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.13em;color:#8A948E}.sideBtn{width:100%;display:flex;justify-content:space-between;border:0;background:none;text-align:left;padding:10px;border-radius:7px;color:#45544D;font-size:14px}.sideBtn.on{background:#DEE5DF;color:var(--ink);font-weight:800}.appMain{max-width:1320px;width:100%;margin:auto;padding:34px clamp(18px,4vw,46px) 90px}.pageHead{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:28px}.pageHead h1{font-size:40px;letter-spacing:-.045em;margin:5px 0}.pageHead p{margin:0;color:var(--muted)}.notice{font-size:12px;border-left:3px solid var(--amber);padding:10px 12px;background:#F5EFE2;color:#6E5A2D;margin-bottom:18px}

.aiIntro{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.patientFacts{border-top:1px solid var(--ink)}.fact{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.fact span{color:var(--muted)}.aiBox{background:#F0F2EC;border:1px solid var(--line);padding:18px}.aiBox h3{margin:0 0 8px}.aiBox textarea{width:100%;min-height:110px;border:1px solid #C8D0CA;border-radius:8px;padding:10px;background:white}.aiNote{font-size:11px;color:var(--muted);line-height:1.45;margin-top:10px}.placeholder{border-top:1px solid var(--ink);padding:28px 0;color:var(--muted)}
.suggestions{margin-top:24px}.suggestion{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:15px 0;border-top:1px solid var(--line)}.suggestion:first-child{border-top:1px solid var(--ink)}.suggestion h3{font-size:16px;margin:0 0 5px}.suggestion p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.reason{font-size:11px;color:#476356;margin-top:7px}.suggestionActions{display:flex;gap:7px;align-items:start}
.libraryBar{display:grid;grid-template-columns:1fr auto;gap:10px}.search{border:1px solid #C6CEC8;border-radius:8px;padding:11px 12px;background:white}.filters{display:flex;gap:6px;overflow:auto;padding:12px 0}.filter{border:1px solid var(--line);background:none;border-radius:7px;padding:7px 9px;font-size:11px;white-space:nowrap}.filter.on{background:var(--forest);color:white}.exerciseList,.templateList,.dataTable,.memory{border-top:1px solid var(--ink)}.exerciseRow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.thumb{width:54px;height:44px;background:#E3E9E3;border-radius:4px;display:grid;place-items:center;font-size:9px;color:#66756D}.exerciseRow h3,.templateRow h3{font-size:14px;margin:0 0 4px}.exerciseRow p,.templateRow p{font-size:11px;color:var(--muted);margin:0}.exerciseMeta{font-size:10px;color:#597067;margin-top:4px}.templateRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.programPanel{position:sticky;top:84px;background:#FBFAF6;border:1px solid #BEC7C1}.programTop{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.programTop h2{font-size:18px;margin:0}.countBadge{min-width:26px;height:26px;border-radius:50%;background:var(--forest);color:white;display:grid;place-items:center;font-size:11px;font-weight:850}.programBody{max-height:calc(100vh - 260px);overflow:auto;padding:0 16px}.emptyProgram{padding:30px 0;color:var(--muted);font-size:12px;line-height:1.5}.programItem{padding:14px 0;border-bottom:1px solid var(--line)}.programItemHead{display:flex;justify-content:space-between;gap:8px}.programItem h3{font-size:13px;margin:0}.programItem small{color:var(--muted)}.programBtns{display:flex}.mini{border:0;background:none;color:#718078;padding:2px 4px}.dose{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}.dose label{font-size:9px;color:var(--muted)}.dose input{width:100%;border:1px solid #CCD3CE;border-radius:6px;padding:7px;background:white;margin-top:3px}.programFooter{padding:14px 16px;border-top:1px solid var(--line);background:#F4F3ED}.programFooter .btn{width:100%;margin-top:7px}.autosave{font-size:10px;color:var(--muted);text-align:center;margin-top:7px}.mobileProgram{display:none;position:fixed;left:10px;right:10px;bottom:72px;z-index:70}.mobileProgram button{width:100%;display:flex;justify-content:space-between;box-shadow:var(--shadow)}
.dataRow{display:grid;grid-template-columns:1.2fr .8fr .7fr .7fr .6fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center;font-size:12px}.dataRow span{color:var(--muted)}.tabStrip{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px}.tabStrip button{border:0;background:none;padding:10px 14px;font-size:12px;border-bottom:2px solid transparent}.tabStrip button.on{font-weight:850;border-bottom-color:var(--green)}
.patientDetailGrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.6fr);gap:22px}.signalBox{background:#F8ECE8;border-left:3px solid var(--red);padding:14px;margin-bottom:18px}.signalBox p{font-size:12px;color:#755151;margin:5px 0 0}.metricGrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-left:1px solid var(--line)}.metric{padding:14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.metric small{color:var(--muted)}.metric strong{display:block;font-size:24px;margin-top:5px}.chartCard{margin-top:20px;border-top:1px solid var(--ink);padding-top:14px}.chartWrap{background:var(--white);border:1px solid var(--line);padding:12px}.mem{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.mem time{font-size:10px;color:var(--muted)}.mem h4{font-size:13px;margin:0 0 4px}.mem p{font-size:11px;color:var(--muted);margin:0;line-height:1.45}
.sheet{position:fixed;inset:0;background:rgba(16,33,27,.35);z-index:90;display:flex;align-items:flex-end}.sheetCard{background:var(--paper);width:100%;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}.sheetHead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}.sheetHead h2{margin:0}.x{border:0;background:none;font-size:24px}.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:white;padding:11px 14px;border-radius:8px;font-size:12px;z-index:120;box-shadow:var(--shadow)}.mobileBottom{display:none}
@media(max-width:1050px){.quickGrid{grid-template-columns:repeat(2,1fr)}.builderLayout{grid-template-columns:1fr}.programPanel{display:none}.mobileProgram{display:block}.aiIntro{grid-template-columns:1fr}.patientDetailGrid{grid-template-columns:1fr}.metricGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.siteNav{display:none}.hero{grid-template-columns:1fr;padding-top:54px}.story{grid-template-columns:1fr}.story>div+div{border-left:0;border-top:1px solid var(--line);padding-left:0}.auth{grid-template-columns:1fr}.authAside{min-height:300px}.appGrid{grid-template-columns:1fr}.sidebar{display:none}.appMain{padding-bottom:130px}.attentionRow{grid-template-columns:38px 1fr auto}.attentionRow>:nth-child(3){grid-column:2/4}.attentionRow>:nth-child(4){grid-column:2}.attentionRow>:nth-child(5){grid-column:3}.dataRow{grid-template-columns:1.2fr .8fr .7fr auto}.dataRow>:nth-child(4),.dataRow>:nth-child(5){display:none}.mobileBottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#FBFAF6;border-top:1px solid var(--line);z-index:65;padding-bottom:env(safe-area-inset-bottom)}.mobileBottom button{border:0;background:none;padding:10px 4px;font-size:10px;color:#69776F}.mobileBottom button.on{font-weight:850;color:var(--ink)}.clinicName{display:none}}
@media(max-width:560px){.siteActions .secondary{display:none}.hero h1{font-size:52px}.quickGrid{grid-template-columns:1fr 1fr}.quickTile{min-height:122px;padding:14px}.pageHead,.builderHead{align-items:start;flex-direction:column}.builderStatus{text-align:left}.libraryBar{grid-template-columns:1fr}.metricGrid{grid-template-columns:1fr 1fr}}
[dir="rtl"] .clinicName{border-left:0;border-right:1px solid var(--line);padding-left:0;padding-right:14px}[dir="rtl"] .sidebar{border-right:0;border-left:1px solid var(--line)}[dir="rtl"] .signalBox,[dir="rtl"] .notice{border-left:0;border-right:3px solid}[dir="rtl"] .quickGrid{border-left:0;border-right:1px solid var(--line)}
</style>

<body>
<div id="root"></div>
<div id="toast" class="toast hidden"></div>
<div id="sheet" class="sheet hidden" onclick="if(event.target===this)closeSheet()"><div class="sheetCard"><div class="sheetHead"><h2 id="sheetTitle"></h2><button class="x" onclick="closeSheet()">×</button></div><div id="sheetBody"></div></div></div>
<script>
const EX=[
{id:'e1',name:'Sit-to-Stand',region:'Knee',goal:'Strength',equipment:'Chair',desc:'Functional lower-extremity strengthening for transfers and loading.'},
{id:'e2',name:'Bridge',region:'Hip',goal:'Strength',equipment:'None',desc:'Posterior-chain and hip extensor strengthening.'},
{id:'e3',name:'Step-Up',region:'Knee',goal:'Function',equipment:'Step',desc:'Functional closed-chain strengthening for stair goals.'},
{id:'e4',name:'Standing Hip Abduction',region:'Hip',goal:'Strength',equipment:'Band',desc:'Hip abductor strengthening in standing.'},
{id:'e5',name:'Long Arc Quad',region:'Knee',goal:'Strength',equipment:'None',desc:'Open-chain knee extensor strengthening.'},
{id:'e6',name:'Heel Slide',region:'Knee',goal:'Mobility',equipment:'None',desc:'Knee flexion mobility and active range work.'},
{id:'e7',name:'Calf Raise',region:'Ankle',goal:'Strength',equipment:'Counter',desc:'Plantarflexor strengthening and lower-limb capacity.'},
{id:'e8',name:'Clamshell',region:'Hip',goal:'Strength',equipment:'Band',desc:'Hip external rotator and abductor strengthening.'},
{id:'e9',name:'Quad Set',region:'Knee',goal:'Activation',equipment:'Towel',desc:'Quadriceps activation with low movement demand.'},
{id:'e10',name:'Supine March',region:'Lumbar',goal:'Control',equipment:'None',desc:'Low-load trunk control and hip flexion coordination.'}
];
const TPL=[
{id:'t1',name:'Knee OA — Strength & Function',desc:'5 exercises · stairs, transfers, lower-limb strength',ids:['e1','e3','e4','e5','e7']},
{id:'t2',name:'TKA — Early Mobility',desc:'4 exercises · mobility, activation, transfer capacity',ids:['e6','e9','e1','e7']},
{id:'t3',name:'Hip Strength Starter',desc:'4 exercises · posterior chain and hip control',ids:['e2','e4','e8','e1']}
];
const I18N={en:{home:'Home',patients:'Patients',heps:'HEPs',exercises:'Exercises',messages:'Messages',outcomes:'Outcomes',rtm:'RTM',assistant:'AI Assistant',clinic:'Clinic',settings:'Settings',needs:'Who needs me?',sub:'Prioritized changes that deserve clinical attention.',create:'Create HEP',quick:'Quick actions',library:'Exercise Library',ai:'AI Builder',templates:'Templates',program:'Program',review:'Review & Assign',search:'Search exercises',generate:'Generate suggestions',saved:'Saved HEPs'},es:{home:'Inicio',patients:'Pacientes',heps:'HEPs',exercises:'Ejercicios',messages:'Mensajes',outcomes:'Resultados',rtm:'RTM',assistant:'Asistente IA',clinic:'Clínica',settings:'Configuración',needs:'¿Quién me necesita?',sub:'Cambios priorizados que merecen atención clínica.',create:'Crear HEP',quick:'Acciones rápidas',library:'Biblioteca de ejercicios',ai:'Constructor IA',templates:'Plantillas',program:'Programa',review:'Revisar y asignar',search:'Buscar ejercicios',generate:'Generar sugerencias',saved:'HEPs guardados'},ar:{home:'الرئيسية',patients:'المرضى',heps:'البرامج',exercises:'التمارين',messages:'الرسائل',outcomes:'النتائج',rtm:'المتابعة',assistant:'مساعد الذكاء الاصطناعي',clinic:'العيادة',settings:'الإعدادات',needs:'من يحتاجني؟',sub:'تغيّرات مهمة تستحق انتباه المعالج.',create:'إنشاء برنامج',quick:'إجراءات سريعة',library:'مكتبة التمارين',ai:'منشئ بالذكاء الاصطناعي',templates:'القوالب',program:'البرنامج',review:'مراجعة وتعيين',search:'ابحث عن تمرين',generate:'إنشاء اقتراحات',saved:'البرامج المحفوظة'}};
let S={view:'marketing',page:'home',tab:'ai',lang:localStorage.getItem('hmLang')||'en',program:JSON.parse(localStorage.getItem('hmProgram')||'[]'),generated:false,search:'',filter:'All',hepTab:'active'};
const t=k=>(I18N[S.lang]||I18N.en)[k]||k;function save(){localStorage.setItem('hmProgram',JSON.stringify(S.program));localStorage.setItem('hmLang',S.lang)}function toast(m){let x=document.getElementById('toast');x.textContent=m;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),1400)}function lang(v){S.lang=v;save();render()}function marketing(){S.view='marketing';render()}function auth(){S.view='auth';render()}function enter(){S.view='app';S.page='home';render()}function nav(p){S.page=p;render();scrollTo(0,0)}function builder(tab='ai'){S.page='builder';S.tab=tab;render();scrollTo(0,0)}
function add(id){if(!S.program.some(x=>x.id===id)){let e=EX.find(x=>x.id===id);S.program.push({...e,sets:3,reps:10,freq:'Daily'});save();toast(e.name+' added')}render()}function rem(id){S.program=S.program.filter(x=>x.id!==id);save();render()}function move(id,d){let i=S.program.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=S.program.length)return;[S.program[i],S.program[j]]=[S.program[j],S.program[i]];save();render()}function dose(id,k,v){let x=S.program.find(x=>x.id===id);if(x){x[k]=v;save()}}function tpl(id){let p=TPL.find(x=>x.id===id);p.ids.forEach(eid=>{if(!S.program.some(x=>x.id===eid)){let e=EX.find(x=>x.id===eid);S.program.push({...e,sets:3,reps:10,freq:'Daily'})}});save();toast('Template loaded');render()}function gen(){S.generated=true;render();toast('Suggestions generated')}function closeSheet(){document.getElementById('sheet').classList.add('hidden')}
function items(){if(!S.program.length)return `<div class="emptyProgram">Nothing added yet. Use AI suggestions, the exercise library, or a saved template. Everything lands in this same program.</div>`;return S.program.map((x,i)=>`<div class="programItem"><div class="programItemHead"><div><h3>${i+1}. ${x.name}</h3><small>${x.region} · ${x.goal}</small></div><div class="programBtns"><button class="mini" onclick="move('${x.id}',-1)">↑</button><button class="mini" onclick="move('${x.id}',1)">↓</button><button class="mini" onclick="rem('${x.id}')">×</button></div></div><div class="dose"><label>Sets<input value="${x.sets}" onchange="dose('${x.id}','sets',this.value)"></label><label>Reps<input value="${x.reps}" onchange="dose('${x.id}','reps',this.value)"></label><label>Freq<input value="${x.freq}" onchange="dose('${x.id}','freq',this.value)"></label></div></div>`).join('')}
function openProgram(){document.getElementById('sheetTitle').textContent=t('program')+' · '+S.program.length;document.getElementById('sheetBody').innerHTML=`<div style="padding:0 2px">${items()}<button class="btn primary" style="width:100%;margin-top:16px" onclick="review()">${t('review')}</button></div>`;document.getElementById('sheet').classList.remove('hidden')}
function review(){document.getElementById('sheetTitle').textContent=t('review');document.getElementById('sheetBody').innerHTML=`<div style="padding:12px 0"><p style="font-size:12px;color:var(--muted)">Sarah Williams · L knee OA · ${S.program.length} exercises · English</p>${S.program.map((x,i)=>`<div style="padding:12px 0;border-top:1px solid var(--line)"><strong>${i+1}. ${x.name}</strong><div style="font-size:11px;color:var(--muted);margin-top:4px">${x.sets} sets × ${x.reps} reps · ${x.freq}</div></div>`).join('')}<div class="field"><label>Reason for program update</label><select><option>Initial program</option><option>Progression</option><option>Regression</option><option>Symptom response</option><option>Goal change</option><option>Clinical reassessment</option></select></div><button class="btn primary" style="width:100%" onclick="toast('Prototype: assigned as HEP v1');closeSheet()">Assign to Sarah</button></div>`;document.getElementById('sheet').classList.remove('hidden')}
function header(){return `<header class="sitebar"><button class="btn" onclick="marketing()"><span class="wordmark">HEP<span>mate</span></span></button><nav class="siteNav"><a>Product</a><a>For Clinicians</a><a>For Patients</a><a>Pricing</a><a>Resources</a></nav><div class="siteActions"><button class="btn secondary" onclick="auth()">Sign in</button><button class="btn primary" onclick="auth()">Get started</button></div></header>`}
function marketingPage(){return header()+`<main class="marketing"><section class="hero"><div><div class="eyebrow">Rehabilitation follow-through</div><h1>Know what happens between visits.</h1><p>Build the home program. See how your patient responds. Surface the changes that deserve your attention.</p><div style="display:flex;gap:9px;margin-top:24px"><button class="btn primary" onclick="auth()">Start as a clinician</button><button class="btn secondary" onclick="enter()">Open product demo</button></div></div><div class="heroMock"><div class="mockTop"><span>HEPmate Clinical</span><span>Needs attention · 3</span></div>${[['red','Sarah Williams','Pain rose 4 → 7 after two sessions'],['','Robert Green','Sit-to-Stand rated too easy 3×'],['','Maya Patel','No program activity in 5 days']].map(r=>`<div class="mockRow"><i class="dot ${r[0]}"></i><div><strong>${r[1]}</strong><div style="font-size:11px;color:var(--muted);margin-top:4px">${r[2]}</div></div><button class="btn small ghost">Review</button></div>`).join('')}</div></section><section class="story"><div><strong>Built around follow-through.</strong><p>Not another exercise PDF tool. HEPmate connects prescription, response and clinician action.</p></div><div><strong>Create</strong><p>AI-assisted, manual library, saved templates and custom exercises.</p></div><div><strong>Understand</strong><p>Symptoms, difficulty, adherence, function and longitudinal progress.</p></div><div><strong>Act</strong><p>Prioritize meaningful changes and preserve what happened next.</p></div></section></main>`}
function authPage(){return header()+`<main class="auth"><section class="authAside"><div><div class="eyebrow" style="color:#A7C9B8">Clinician account</div><h1>Set up your rehabilitation workspace.</h1><p>Your language preference follows your account and can be changed later. Patient invitations can use a different preferred language.</p></div><small style="color:#AFC1B8">Prototype only · synthetic data · no real patient information</small></section><section class="authMain"><div class="authCard"><h2>Create clinician account</h2><p style="color:var(--muted)">This prototype simulates onboarding. Production authentication comes later.</p><div class="field"><label>Name</label><input value="Mohamed Moustafa"></div><div class="field"><label>Clinic</label><input value="Founding Rehab Clinic"></div><div class="field"><label>Preferred language</label><select onchange="lang(this.value)"><option value="en" ${S.lang==='en'?'selected':''}>English</option><option value="es" ${S.lang==='es'?'selected':''}>Español</option><option value="ar" ${S.lang==='ar'?'selected':''}>العربية</option></select></div><button class="btn primary" style="width:100%;padding:13px" onclick="enter()">Enter HEPmate</button></div></section></main>`}
function shell(content){let menu=[['home',t('home')],['patients',t('patients')],['heps',t('heps')],['exercises',t('exercises')],['messages',t('messages')],['outcomes',t('outcomes')],['rtm',t('rtm')],['assistant',t('assistant')]];return `<header class="appbar"><div class="appLeft"><button class="btn" onclick="nav('home')"><span class="wordmark">HEP<span>mate</span></span></button><span class="clinicName">Founding Rehab Clinic</span></div><div class="appRight"><select class="lang" onchange="lang(this.value)"><option value="en" ${S.lang==='en'?'selected':''}>EN</option><option value="es" ${S.lang==='es'?'selected':''}>ES</option><option value="ar" ${S.lang==='ar'?'selected':''}>AR</option></select><button class="btn small ghost">⌕</button><button class="btn small ghost">◌</button><div class="avatar">MM</div></div></header><div class="appGrid"><aside class="sidebar"><div class="sideLabel">Workspace</div>${menu.map(([p,l])=>`<button class="sideBtn ${(S.page===p||(p==='heps'&&S.page==='builder'))?'on':''}" onclick="nav('${p}')"><span>${l}</span><span>${p==='messages'?'2':''}</span></button>`).join('')}<div class="sideLabel">Organization</div><button class="sideBtn"><span>${t('clinic')}</span></button><button class="sideBtn"><span>${t('settings')}</span></button></aside><main class="appMain">${content}</main></div><nav class="mobileBottom"><button class="${S.page==='home'?'on':''}" onclick="nav('home')">${t('home')}</button><button class="${S.page==='patients'?'on':''}" onclick="nav('patients')">${t('patients')}</button><button class="${S.page==='heps'||S.page==='builder'?'on':''}" onclick="nav('heps')">${t('heps')}</button><button class="${S.page==='messages'?'on':''}" onclick="nav('messages')">${t('messages')}</button><button onclick="nav('assistant')">More</button></nav>${S.page==='builder'?`<div class="mobileProgram"><button class="btn primary" onclick="openProgram()"><span>${t('program')}</span><strong>${S.program.length}</strong></button></div>`:''}`}
function dashboard(){return `<div class="pageHead"><div><div class="eyebrow">Dashboard</div><h1>${t('needs')}</h1><p>${t('sub')}</p></div><div class="topActions"><button class="btn primary" onclick="builder('ai')">+ ${t('create')}</button><button class="btn secondary">Invite patient</button></div></div><div class="notice">Synthetic demo only. Do not enter real patient information.</div><section class="attention">${[['SW','Sarah Williams','Pain increased 4 → 7 across the last two sessions.','HEP v2 · 82% adherence','HIGH','high'],['RG','Robert Green','Sit-to-Stand rated “too easy” in 3 consecutive sessions.','HEP v3 · 94% adherence','REVIEW','med'],['MP','Maya Patel','No exercise activity in 5 days.','HEP v1 · 41% adherence','REVIEW','med']].map((r,i)=>`<div class="attentionRow"><div class="avatar">${r[0]}</div><div><b>${r[1]}</b><p>${r[2]}</p></div><span>${r[3]}</span><span class="severity ${r[5]}">${r[4]}</span><button class="btn small ghost" onclick="${i===0?"nav('patient')":"toast('Prototype patient')"}">Review</button></div>`).join('')}</section><div class="quickTitle"><h2>${t('quick')}</h2><span style="font-size:11px;color:var(--muted)">Fast-entry tiles from the Base44 concept, reorganized.</span></div><div class="quickGrid">${[["＋",t('create'),'AI, manual or template-based.',"builder('ai')"],["◎",t('patients'),'Roster, invite, progress and history.',"nav('patients')"],["▤",t('saved'),'Active, drafts, templates and archived.',"nav('heps')"],["⌕",t('exercises'),'Library, favorites, custom, recent.',"builder('library')"],["✉",t('messages'),'Patient conversations and follow-up.',"nav('messages')"],["↗",t('outcomes'),'Function, symptoms and measures.',"nav('outcomes')"],["◫",t('rtm'),'Monitoring and documentation workflow.',"nav('rtm')"],["✦",t('assistant'),'Summaries and reviewed suggestions.',"nav('assistant')"]].map(x=>`<button class="quickTile" onclick="${x[3]}"><div><div class="tileIcon">${x[0]}</div><strong>${x[1]}</strong><p>${x[2]}</p></div><span>Open →</span></button>`).join('')}</div>`}
function aiTab(){return `<div class="aiIntro"><div><div class="eyebrow">Patient context</div><div class="patientFacts">${[['Condition','Knee osteoarthritis'],['Goals','Stairs · walk 20+ min'],['Function','Sit-to-stand + stair difficulty'],['Equipment','Chair · band · step'],['Recent response','Pain 5/10 · adherence 82%'],['Precautions','None recorded']].map(x=>`<div class="fact"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div><div class="aiBox"><h3>What should the draft focus on?</h3><textarea>Focus on quadriceps and hip strength with functional loading for stairs. Keep the program simple and home-friendly.</textarea><button class="btn primary" style="width:100%;margin-top:9px" onclick="gen()">${t('generate')}</button><div class="aiNote">AI suggests. The clinician chooses. Nothing is added automatically.</div></div></div>${S.generated?`<section class="suggestions"><div class="quickTitle"><h2>Suggested draft</h2><span>5 suggestions</span></div>${['e1','e4','e3','e5','e7'].map(id=>{let e=EX.find(x=>x.id===id),a=S.program.some(x=>x.id===id);return `<div class="suggestion"><div><h3>${e.name}</h3><p>${e.desc}</p><div class="reason">Why suggested: aligns with Sarah's strength/stair goal and available equipment.</div></div><div class="suggestionActions"><button class="btn small ${a?'ghost':'primary'}" ${a?'disabled':''} onclick="add('${e.id}')">${a?'Added':'Add'}</button><button class="btn small ghost">Replace</button></div></div>`}).join('')}<button class="btn secondary" style="margin-top:12px" onclick="S.tab='library';render()">Browse library for more →</button></section>`:`<div class="placeholder">Generate a draft, or switch to the Exercise Library or Templates without losing the current program.</div>`}`}
function libraryTab(){let list=EX.filter(e=>(S.filter==='All'||e.region===S.filter)&&(!S.search||e.name.toLowerCase().includes(S.search.toLowerCase())||e.desc.toLowerCase().includes(S.search.toLowerCase())));return `<div class="libraryBar"><input class="search" placeholder="${t('search')}" value="${S.search}" oninput="S.search=this.value;render()"><button class="btn secondary">+ Custom exercise</button></div><div class="filters">${['All','Knee','Hip','Lumbar','Ankle'].map(f=>`<button class="filter ${S.filter===f?'on':''}" onclick="S.filter='${f}';render()">${f}</button>`).join('')}<button class="filter">★ Favorites</button><button class="filter">Recently used</button></div><div class="exerciseList">${list.map(e=>{let a=S.program.some(x=>x.id===e.id);return `<div class="exerciseRow"><div class="thumb">MEDIA</div><div><h3>${e.name}</h3><p>${e.desc}</p><div class="exerciseMeta">${e.region} · ${e.goal} · ${e.equipment}</div></div><div><button class="btn small ghost">Preview</button><button class="btn small ${a?'ghost':'primary'}" ${a?'disabled':''} onclick="add('${e.id}')">${a?'Added':'+ Add'}</button></div></div>`}).join('')}</div>`}
function templatesTab(){return `<div class="pageHead" style="margin-bottom:16px"><div><h1 style="font-size:26px">Saved HEP templates</h1><p>Reuse a starting point, then personalize before assigning.</p></div><button class="btn secondary">+ New template</button></div><div class="templateList">${TPL.map(p=>`<div class="templateRow"><div><h3>${p.name}</h3><p>${p.desc}</p></div><div><button class="btn small ghost">Preview</button><button class="btn small primary" onclick="tpl('${p.id}')">Use template</button></div></div>`).join('')}</div>`}
function builderPage(){return `<div class="builderHead"><div class="patientContext"><div class="avatar">SW</div><div class="contextCopy"><h1>Sarah Williams</h1><p>L knee OA · Goal: stairs + 20-minute walk · HEP v2</p></div></div><div class="builderStatus"><strong>Draft HEP</strong><br>Autosaved locally · synthetic demo</div></div><div class="builderLayout"><section><nav class="builderTabs"><button class="builderTab ${S.tab==='ai'?'on':''}" onclick="S.tab='ai';render()">${t('ai')}</button><button class="builderTab ${S.tab==='library'?'on':''}" onclick="S.tab='library';render()">${t('library')}</button><button class="builderTab ${S.tab==='templates'?'on':''}" onclick="S.tab='templates';render()">${t('templates')}</button></nav>${S.tab==='ai'?aiTab():S.tab==='library'?libraryTab():templatesTab()}</section><aside class="programPanel"><div class="programTop"><h2>${t('program')}</h2><span class="countBadge">${S.program.length}</span></div><div class="programBody">${items()}</div><div class="programFooter"><button class="btn secondary" onclick="S.tab='library';render()">+ ${t('library')}</button><button class="btn primary" onclick="review()" ${!S.program.length?'disabled':''}>${t('review')}</button><div class="autosave">Draft autosaves as you work</div></div></aside></div>`}
function patients(){return `<div class="pageHead"><div><div class="eyebrow">Patient roster</div><h1>${t('patients')}</h1><p>Episodes, active programs, adherence and attention status.</p></div><div class="topActions"><button class="btn secondary">Invite patient</button><button class="btn primary" onclick="builder('ai')">+ ${t('create')}</button></div></div><div class="dataTable">${[['Sarah Williams','L knee OA','HEP v2','82%','Attention'],['Robert Green','R TKA','HEP v3','94%','Review'],['Maya Patel','Low back pain','HEP v1','41%','Review'],['David Chen','Shoulder pain','HEP v2','88%','Stable']].map((r,i)=>`<div class="dataRow"><b>${r[0]}</b><span>${r[1]}</span><span>${r[2]}</span><span>${r[3]}</span><span>${r[4]}</span><button class="btn small ghost" onclick="${i===0?"nav('patient')":"toast('Prototype patient')"}">Open</button></div>`).join('')}</div>`}
function heps(){return `<div class="pageHead"><div><div class="eyebrow">Programs</div><h1>${t('heps')}</h1><p>Active assignments, drafts, reusable templates and history.</p></div><button class="btn primary" onclick="builder('ai')">+ ${t('create')}</button></div><div class="tabStrip">${[['active','Active'],['drafts','Drafts'],['templates',t('templates')],['archived','Archived']].map(x=>`<button class="${S.hepTab===x[0]?'on':''}" onclick="S.hepTab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${S.hepTab==='templates'?`<div class="templateList">${TPL.map(p=>`<div class="templateRow"><div><h3>${p.name}</h3><p>${p.desc}</p></div><button class="btn small primary" onclick="tpl('${p.id}');builder('templates')">Use</button></div>`).join('')}</div>`:`<div class="dataTable"><div class="dataRow"><b>Sarah Williams</b><span>Knee OA Program</span><span>v2</span><span>Updated Aug 28</span><span>Active</span><button class="btn small ghost" onclick="builder('library')">Edit</button></div><div class="dataRow"><b>Robert Green</b><span>TKA Progression</span><span>v3</span><span>Updated Aug 30</span><span>Active</span><button class="btn small ghost">Open</button></div></div>`}`}
function patient(){return `<div class="pageHead"><div><button class="btn small" onclick="nav('patients')">← ${t('patients')}</button><div class="eyebrow" style="margin-top:12px">Patient overview</div><h1>Sarah Williams</h1><p>L knee OA · Episode started Aug 12 · Goal: stairs + 20-minute walk</p></div><div class="topActions"><button class="btn secondary" onclick="builder('library')">Edit HEP</button><button class="btn primary">Message Sarah</button></div></div><div class="patientDetailGrid"><section><div class="signalBox"><strong>Needs review</strong><p>Pain increased from 4 → 7 across two sessions after Step-Up was introduced. Difficulty was “just right,” so the symptom response—not effort—is driving this signal.</p></div><div class="metricGrid"><div class="metric"><small>Adherence</small><strong>82%</strong></div><div class="metric"><small>Current pain</small><strong>7/10</strong></div><div class="metric"><small>Function</small><strong>↑ 18%</strong></div><div class="metric"><small>Last activity</small><strong>Today</strong></div></div><div class="chartCard"><h3>Symptoms + clinical changes</h3><div class="chartWrap"><svg viewBox="0 0 640 220" width="100%"><line x1="48" y1="20" x2="48" y2="185" stroke="#C8D0CA"/><line x1="48" y1="185" x2="610" y2="185" stroke="#C8D0CA"/><line x1="255" y1="20" x2="255" y2="185" stroke="#A9B9B0" stroke-dasharray="5 5"/><text x="263" y="32" font-size="11" fill="#607168">HEP v2 · Step-Up added</text><polyline fill="none" stroke="#A44444" stroke-width="4" points="55,115 145,130 235,142 325,105 415,82 505,68 595,72"/><circle cx="595" cy="72" r="5" fill="#A44444"/><text x="10" y="48" font-size="10" fill="#66736C">8</text><text x="10" y="112" font-size="10" fill="#66736C">5</text><text x="10" y="180" font-size="10" fill="#66736C">2</text><text x="55" y="205" font-size="10" fill="#66736C">Aug 12</text><text x="560" y="205" font-size="10" fill="#66736C">Sep 2</text></svg></div></div></section><aside><div class="quickTitle" style="margin-top:0"><h2>Rehabilitation Memory</h2></div><div class="memory"><div class="mem"><time>Today</time><div><h4>Attention signal created</h4><p>Pain 7/10 for second consecutive session.</p></div></div><div class="mem"><time>Aug 28</time><div><h4>HEP v2 published</h4><p>Step-Up added for stair goal. Reason: progression.</p></div></div><div class="mem"><time>Aug 25</time><div><h4>Patient check-in</h4><p>Pain 4/10 · difficulty just right · session completed.</p></div></div><div class="mem"><time>Aug 12</time><div><h4>Initial HEP assigned</h4><p>4 exercises · goal: stairs and walking tolerance.</p></div></div></div></aside></div>`}
function placeholder(title,copy){return `<div class="pageHead"><div><div class="eyebrow">HEPmate</div><h1>${title}</h1><p>${copy}</p></div></div><div class="placeholder">This destination is now fixed in the product navigation. The next build fills it without moving the menu around again.</div>`}
function app(){let c=S.page==='home'?dashboard():S.page==='patients'?patients():S.page==='patient'?patient():S.page==='heps'?heps():S.page==='builder'?builderPage():S.page==='exercises'?(S.tab='library',builderPage()):S.page==='messages'?placeholder(t('messages'),'Patient conversations, translation and actionable follow-up.'):S.page==='outcomes'?placeholder(t('outcomes'),'Function, PROMs and longitudinal progress.'):S.page==='rtm'?placeholder(t('rtm'),'RTM-ready workflow and documentation.'):placeholder(t('assistant'),'Context-aware summaries and clinician-reviewed suggestions.');return shell(c)}
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';document.getElementById('root').innerHTML=S.view==='marketing'?marketingPage():S.view==='auth'?authPage():app()}
render();
</script>
</body>
</html>
